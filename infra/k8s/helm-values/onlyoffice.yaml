# Component: OnlyOffice Document Server Community Edition >= 9.4 — study 1.5 L.192-199
# Chart used: `docs`, published by ONLYOFFICE itself (github.com/ONLYOFFICE/
#   Kubernetes-Docs).
#   Helm repo: https://download.onlyoffice.com/charts/stable
#   [CORRECTED] the repo/chart name here used to be
#   "onlyoffice.github.io/docs-cloud-chart" / "onlyoffice/docs-cloud", which
#   was fabricated and 404s - found by actually running
#   dev-cluster/deploy.sh. [UNCERTAIN]: found via ONLYOFFICE/Kubernetes-Docs'
#   own README (github.com, reachable), but this sandboxed environment's
#   egress proxy blocks download.onlyoffice.com outright, so the index.yaml
#   itself was never independently fetched - confirm on first real run.
#
# 1.5 L.198 — target architecture chosen FROM THE INITIAL DESIGN: Document Server
# cluster + load balancer + Redis (session storage), rather than a single instance to
# be evolved later — simpler to plan for in infra than to retrofit.
#
# Convention: this file carries the common values (image, Redis, Seafile WOPI
# integration/official connector); the numeric sizing (replicas/resources) is in the
# onlyoffice-100.yaml / onlyoffice-2000.yaml overlays.

image:
  repository: onlyoffice/documentserver
  tag: "9.4"

# 1.5 L.198 — explicit cluster: several Document Server replicas behind a load
# balancer (ClusterIP Service + Ingress), with shared Redis for the session.
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: onlyoffice-redis-secret

env:
  JWT_ENABLED: "true"
  JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: onlyoffice-jwt-secret
        key: secret
  # 2.6 L.469 — `document.permissions.chat: false`: this parameter is set at the
  # level of the CONFIG OF EACH DOCUMENT opened (JS config passed at opening time by
  # the integrator), not at the global Document Server level — Document Server does
  # not expose an equivalent global flag. It is therefore set on the
  # Seafile<->OnlyOffice connector side (see connectors/, out of scope for this
  # repository), which must include `"permissions": {"chat": false}` in the config
  # JSON of every document opened from Seafile. Documented here for reference
  # (2.6 L.469-473).

persistence:
  data:
    enabled: true
    size: 20Gi
    storageClass: ""

service:
  type: ClusterIP
  port: 80

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see ../manifests/caddy.yaml's header comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: office.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: onlyoffice-tls
      hosts:
        - office.libre365.example.org
