# Sizing overlay — 100 users
# Reference load, study 1.5 L.195-196: "100 consultants x 20 documents opened in
# parallel" (2000 potential connections) -> ~8 cores / 16 GB RAM minimum with margin,
# to be validated with a JMeter load test before going to production (1.5 L.196).
# Usage: helm upgrade --install onlyoffice onlyoffice/docs -f onlyoffice.yaml -f onlyoffice-100.yaml
#
# [CORRECTED] the real chart has no single top-level `replicaCount`/
# `resources` - it deploys `docservice` and `converter` as two
# independently-scaled Deployments (see onlyoffice.yaml's own header,
# found by actually running dev-cluster/deploy.sh then verifying the
# chart's real source).

docservice:
  replicas: 2 # cluster from the initial design (1.5 L.198), even at 100 users
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

converter:
  replicas: 2
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
# i.e. ~8 cores / 16 GB RAM combined across docservice+converter, consistent with the
# order of magnitude adopted in 1.5 L.196 for the reference load scenario.
