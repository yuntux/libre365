# Component: External Secrets Operator (ESO) — populates real Kubernetes
# Secrets from OpenBao (../helm-values/openbao.yaml), study 4.5.
#
# Chart: external-secrets (external-secrets project, CNCF)
#   Helm repo: https://charts.external-secrets.io
#   chart    : external-secrets
#
# See ../manifests/external-secrets-store.yaml (the ClusterSecretStore
# wiring ESO to OpenBao) and ../manifests/external-secrets.yaml (one
# ExternalSecret per `existingSecret:`/`secretKeyRef:` referenced across
# this directory) for the actual secret definitions.

installCRDs: true

replicaCount: 2

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "250m"
    memory: "128Mi"

webhook:
  replicaCount: 2

certController:
  replicaCount: 1
