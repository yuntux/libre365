# Component: Seafile — file storage and synchronization (study 1.4)
# Chart used: haiwen/seafile-server has no official Helm chart published by Seafile;
# community chart adopted: `seafile-charts/seafile-ce`
#   Helm repo: https://seafile-charts.github.io/seafile-charts (or an equivalent
#   community fork, e.g. `bahamas10/seafile` on ArtifactHub) — to be confirmed at
#   deployment time, otherwise fall back to a raw manifest derived from the official
#   `seafileltd/seafile-mc` Docker image.
#
# 1.4 L.136 — sizing driven by the volume of stored data and the sync bandwidth, not
# by the number of active users: no dedicated 100/2000 variant for Seafile (unlike
# Synapse/OnlyOffice/Keycloak), a single values file suffices; only
# `persistence.size` needs to be revised upward as the data volume grows.
#
# 1.4 L.141 — known limitation: horizontal clustering (several frontends + shared
# cache) only exists in the (paid) Pro edition. The Community edition below stays
# single-node, scalable vertically only — to be anticipated budget-wise beyond a
# load threshold, see the study.

image:
  repository: seafileltd/seafile-mc
  tag: "11.0.13"

replicaCount: 1 # mono-noeud, edition Community (1.4 L.141)

resources:
  requests:
    cpu: "2"
    memory: "8Gi"
  limits:
    cpu: "4"
    memory: "16Gi"

env:
  # 2.11 L.565 — interdiction des liens de partage non authentifies : tout partage
  # externe non authentifie doit passer par Gokapi (1.8), pas par un lien de partage
  # Seafile public.
  SHARE_LINK_LOGIN_REQUIRED: "true"
  # Complement documente en 2.11 L.565 : peut etre desactive plus finement par role
  # dans seahub_settings.py (CAN_GENERATE_SHARE_LINK), hors perimetre values Helm
  # generiques — a positionner via un ConfigMap seahub_settings.py additionnel si besoin.

  # 1.5 L.193 — integration OnlyOffice comme office server (edition Community >= 9.4,
  # plafond de connexions leve).
  OFFICE_SERVER_TYPE: "OnlyOffice"
  ONLYOFFICE_APIJS_URL: "https://office.libre365.example.org/web-apps/apps/api/documents/api.js"
  ONLYOFFICE_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: onlyoffice-jwt-secret
        key: secret

  # 1.7 — SSO Keycloak (OIDC natif Seafile)
  ENABLE_OAUTH: "true"
  OAUTH_PROVIDER_DOMAIN: "sso.libre365.example.org"
  OAUTH_CLIENT_ID: "seafile"

  SEAFILE_SERVER_HOSTNAME: "files.libre365.example.org"

persistence:
  data:
    enabled: true
    size: 500Gi
    storageClass: ""
  # Dimensionnement du volume a reviser en continu selon le volume reel stocke (1.4 L.136)

mysql:
  enabled: true
  auth:
    database: seafile_db
    existingSecret: seafile-mysql-secret

memcached:
  enabled: true

ingress:
  enabled: true
  className: ""
  hosts:
    - host: files.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: seafile-tls
      hosts:
        - files.libre365.example.org
