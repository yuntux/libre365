# Brique : Seafile — stockage et synchronisation de fichiers (etude 1.4)
# Chart utilise : haiwen/seafile-server n'a pas de chart Helm officiel publie par
# Seafile ; chart communautaire retenu : `seafile-charts/seafile-ce`
#   repo Helm : https://seafile-charts.github.io/seafile-charts (ou fork communautaire
#   equivalent, ex. `bahamas10/seafile` sur ArtifactHub) — a valider au moment du
#   deploiement, sinon repli sur manifest raw derive de l'image officielle Docker
#   `seafileltd/seafile-mc`.
#
# 1.4 L.136 — dimensionnement pilote par le volume de donnees stockees et la bande
# passante de synchronisation, pas par le nombre d'utilisateurs actifs : pas de variante
# 100/2000 dediee pour Seafile (contrairement a Synapse/OnlyOffice/Keycloak), un seul
# fichier de values suffit ; seul `persistence.size` doit etre revu a la hausse avec la
# croissance du volume de donnees.
#
# 1.4 L.141 — limite connue : le clustering horizontal (plusieurs frontaux + cache
# partage) n'existe que sur l'edition Pro (payante). L'edition Community ci-dessous
# reste mono-noeud, scalable verticalement uniquement — a anticiper budgetairement au-
# dela d'un seuil de charge, cf. etude.

image:
  repository: seafileltd/seafile-mc
  tag: "11.0.13"

replicaCount: 1 # mono-noeud, edition Community (1.4 L.141)

resources:
  requests:
    cpu: "2"
    memory: "8Gi"
  limits:
    cpu: "4"
    memory: "16Gi"

env:
  # 2.11 L.565 — interdiction des liens de partage non authentifies : tout partage
  # externe non authentifie doit passer par Gokapi (1.8), pas par un lien de partage
  # Seafile public.
  SHARE_LINK_LOGIN_REQUIRED: "true"
  # Complement documente en 2.11 L.565 : peut etre desactive plus finement par role
  # dans seahub_settings.py (CAN_GENERATE_SHARE_LINK), hors perimetre values Helm
  # generiques — a positionner via un ConfigMap seahub_settings.py additionnel si besoin.

  # 1.5 L.193 — integration OnlyOffice comme office server (edition Community >= 9.4,
  # plafond de connexions leve).
  OFFICE_SERVER_TYPE: "OnlyOffice"
  ONLYOFFICE_APIJS_URL: "https://office.libre365.example.org/web-apps/apps/api/documents/api.js"
  ONLYOFFICE_JWT_SECRET:
    valueFrom:
      secretKeyRef:
        name: onlyoffice-jwt-secret
        key: secret

  # 1.7 — SSO Keycloak (OIDC natif Seafile)
  ENABLE_OAUTH: "true"
  OAUTH_PROVIDER_DOMAIN: "sso.libre365.example.org"
  OAUTH_CLIENT_ID: "seafile"

  SEAFILE_SERVER_HOSTNAME: "files.libre365.example.org"

persistence:
  data:
    enabled: true
    size: 500Gi
    storageClass: ""
  # Dimensionnement du volume a reviser en continu selon le volume reel stocke (1.4 L.136)

mysql:
  enabled: true
  auth:
    database: seafile_db
    existingSecret: seafile-mysql-secret

memcached:
  enabled: true

ingress:
  enabled: true
  className: ""
  hosts:
    - host: files.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: seafile-tls
      hosts:
        - files.libre365.example.org
