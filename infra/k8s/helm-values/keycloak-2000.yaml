# Sizing overlay — 2000 users (study 1.7 L.271: 2-4 cores / 4-8 GB per node,
# same range as at 100 -> the number of replicas increases to absorb the
# connections/second load rather than per-pod resources).
# Usage: helm upgrade --install keycloak bitnami/keycloak -f keycloak.yaml -f keycloak-2000.yaml
replicaCount: 4

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

postgresql:
  primary:
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
