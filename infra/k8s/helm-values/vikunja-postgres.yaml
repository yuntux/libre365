# Component: PostgreSQL for Vikunja — standalone release (study 1.6)
# Chart used: bitnami/postgresql
#   Helm repo: https://charts.bitnami.com/bitnami
#   chart    : postgresql
#
# [ADDED] found missing by actually running dev-cluster/deploy.sh
# ("Error: repo vikunja not found" - deploy.sh referenced a `helm repo add
# vikunja` that was never added at all, and vikunja.yaml itself had never
# been matched against a real chart - see ../vikunja.yaml's own header for
# the full story). The real go-vikunja/helm-chart `vikunja` chart has no
# bundled database - it defaults to SQLite with a PersistentVolumeClaim,
# and only talks to an external MySQL/PostgreSQL when configured to via
# plain VIKUNJA_DATABASE_* env vars (see ../vikunja.yaml). This release is
# that external PostgreSQL, same "promote to its own top-level release"
# pattern already used for keycloak-postgres.yaml/seafile-mysql.yaml/
# onlyoffice-postgres.yaml. (The `vikunja-postgres-secret` ExternalSecret
# this release's `auth.existingSecret` points at already existed in
# ../manifests/external-secrets.yaml before this fix - only the release
# installing it and the values file matching its real schema were
# missing.)
#
# [UNCERTAIN, not verified against a live `helm install` from this
# sandboxed environment]: the exact Service hostname this chart's fullname
# template produces for the `vikunja-postgres` release name -
# ../vikunja.yaml's `env.VIKUNJA_DATABASE_HOST` assumes
# "vikunja-postgres-postgresql" (release name does NOT already contain the
# chart name "postgresql", so bitnami's common.names.fullname helper
# should append it, same as keycloak-postgres/onlyoffice-postgres) -
# confirm with `kubectl get svc -n libre365 -l
# app.kubernetes.io/instance=vikunja-postgres` at deployment time.

auth:
  database: vikunja
  username: vikunja
  existingSecret: vikunja-postgres-secret

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

primary:
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
