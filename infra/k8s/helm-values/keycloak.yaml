# Component: Keycloak — central SSO/IAM (study 1.7 L.270-271)
# Chart used: bitnami/keycloak
#   Helm repo: https://charts.bitnami.com/bitnami
#   chart    : keycloak
#
# 1.7 L.271 — highly available Keycloak cluster chosen FROM THE INITIAL TARGET (SSO is
# a single point of failure critical to the whole stack). Keycloak is natively designed
# for horizontal clustering (several nodes behind a load balancer, distributed
# Infinispan cache): no known difficulty following growth beyond 2000 users.
#
# Sizing driven by the number of connections/second, not the total number of users
# (1.7 L.262) — the same 2-4 cores/4-8 GB range is kept for both scales (1.7 L.271),
# the main lever being replicaCount (HA) rather than per-pod resources. See the
# keycloak-100.yaml / keycloak-2000.yaml overlays.

image:
  repository: bitnamilegacy/keycloak
  tag: "26.3.3"

auth:
  adminUser: admin
  existingSecret: keycloak-admin-secret

# 1.7 L.271 — distributed Infinispan cache for HA cluster mode
cache:
  enabled: true
  stack: kubernetes

proxy: edge

extraEnvVars:
  - name: KC_HOSTNAME
    value: "sso.libre365.example.org"
  # 1.7 — Native MFA: TOTP + WebAuthn/FIDO2 enabled in Keycloak's standard
  # authentication flows (realm configuration, not an environment variable) —
  # to be set via Ansible/realm import (see infra/ansible/, out of scope here).
  # SMS and email OTP: not natively covered, require a custom Keycloak SPI
  # (1.7 L.266-268) — a development project, out of scope for this k8s repo.

postgresql:
  enabled: true
  auth:
    database: keycloak
    existingSecret: keycloak-postgres-secret

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public HTTP(S) entry
# point (see its header comment) - this native Ingress object would need an
# Ingress Controller this repo doesn't deploy, and would duplicate Caddy's
# own reverse-proxy routing to this same Service. hostname/tls kept as
# documentation of where this chart expects to be reached; kept in sync
# with platform.yaml's `domains` by the same sync_platform.py patcher.
ingress:
  enabled: false
  ingressClassName: ""
  hostname: sso.libre365.example.org
  tls: true
  extraTls:
    - hosts:
        - sso.libre365.example.org
      secretName: keycloak-tls
