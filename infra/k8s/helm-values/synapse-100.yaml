# Overlay de dimensionnement — 100 utilisateurs (etude 1.2 L.87)
# Usage : helm upgrade --install synapse ananace-charts/matrix-synapse -f synapse.yaml -f synapse-100.yaml
synapse:
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
  workers:
    synchrotron:
      replicaCount: 1
    genericWorkers:
      replicaCount: 1

postgresql:
  primary:
    resources:
      requests:
        cpu: "1"
        memory: "3Gi"
      limits:
        cpu: "2"
        memory: "6Gi"
