# Component: Visio (DINUM/LaSuite numérique "Meet") — study 1.3 L.106-120
# Chart used: suitenumerique/meet (if published at https://github.com/suitenumerique/meet
#   /charts) — failing an official Helm chart published at the time of writing, fall
#   back to a raw manifest (Deployment/Service/Ingress) derived from the official
#   `lasuite/meet-backend` + `lasuite/meet-frontend` image (Django REST Framework, see
#   study 2.9 L.519). This values file is written in "chart" format to stay consistent
#   with the repository's convention; to be adapted into raw manifests if no chart is
#   actually available at deployment time.
#
# visio backend = LiveKit (1.3 L.106), the same LiveKit cluster as Element Call (2.4 L.432).
# Recording egress to SeaweedFS S3 (2.12 L.585-592).

backend:
  image:
    repository: lasuite/meet-backend
    tag: "v1.30.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  env:
    DJANGO_SETTINGS_MODULE: "meet.settings.production"
    # 1.7 — SSO Keycloak (OIDC)
    OIDC_OP_AUTHORIZATION_ENDPOINT: "https://sso.libre365.example.org/realms/libre365/protocol/openid-connect/auth"
    OIDC_OP_TOKEN_ENDPOINT: "https://sso.libre365.example.org/realms/libre365/protocol/openid-connect/token"
    OIDC_OP_USER_ENDPOINT: "https://sso.libre365.example.org/realms/libre365/protocol/openid-connect/userinfo"
    # Required by suitenumerique/meet's own settings.py (django-configurations
    # `values.Value`, no default).
    OIDC_OP_JWKS_ENDPOINT: "https://sso.libre365.example.org/realms/libre365/protocol/openid-connect/certs"
    OIDC_RP_CLIENT_ID: "visio-meet"
    # Client secret from visio-meet-oidc-secret (external-secrets.yaml,
    # OpenBao-sourced) - matches the "visio-meet" Keycloak client declared
    # in infra/ansible/roles/keycloak_realm/defaults/main.yml.
    OIDC_RP_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: visio-meet-oidc-secret
          key: client-secret
    LIVEKIT_API_URL: "https://livekit.libre365.example.org"
    # 2.12 L.587 — self-hosted SeaweedFS as the S3 destination for LiveKit Egress, rather
    # than a shared network volume (NFS) between pods for a file written locally by
    # the Egress pod.
    AWS_S3_ENDPOINT_URL: "http://seaweedfs-s3.libre365.svc.cluster.local:8333"
    AWS_STORAGE_BUCKET_NAME: "visio-recordings"
    RECORDING_ENABLE: "true"

frontend:
  image:
    repository: lasuite/meet-frontend
    tag: "v1.30.0"
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

postgresql:
  enabled: true
  auth:
    database: meet
    existingSecret: visio-meet-postgres-secret

redis:
  enabled: true
  # Django session/cache

# 2.12 L.585-589 — LiveKit Egress configured to write to the SeaweedFS
# bucket "visio-recordings" (see seaweedfs.yaml), no retention managed here
# (set at the bucket level / see the SeaweedFS lifecycle policy).
liveKitEgress:
  s3:
    endpoint: "http://seaweedfs-s3.libre365.svc.cluster.local:8333"
    bucket: "visio-recordings"
    # Same admin S3 credential seaweedfs.yaml's `s3.libre365.example.org`
    # provisions (infra/k8s/manifests/external-secrets.yaml's
    # seaweedfs-s3-credentials) - was previously "minio-egress-credentials",
    # referenced here but never actually declared anywhere as an
    # ExternalSecret (a pre-existing gap, fixed alongside this migration).
    accessKeySecretRef: seaweedfs-s3-credentials
    forcePathStyle: true

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see ../manifests/caddy.yaml's header comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: visio.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: visio-meet-tls
      hosts:
        - visio.libre365.example.org
