# Sizing overlay — 100 users (study 1.7 L.271: 2-4 cores / 4-8 GB)
# HA chosen from the initial target: 2 replicas minimum even at 100 users.
# Usage: helm upgrade --install keycloak bitnami/keycloak -f keycloak.yaml -f keycloak-100.yaml
replicaCount: 2

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

postgresql:
  primary:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
