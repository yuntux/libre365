# Overlay de dimensionnement — 100 utilisateurs (etude 1.7 L.271 : 2-4 coeurs / 4-8 Go)
# HA retenue des la cible initiale : 2 replicas minimum meme a 100 utilisateurs.
# Usage : helm upgrade --install keycloak bitnami/keycloak -f keycloak.yaml -f keycloak-100.yaml
replicaCount: 2

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

postgresql:
  primary:
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
