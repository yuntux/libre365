# Component: Novu — unified notification center (study 2.1 L.381-382)
# Chart used: novuhq/helm-charts (official Novu chart)
#   Helm repo: https://novuhq.github.io/helm-charts
#   chart    : novu
#
# 2.1 L.382 — Novu chosen for the notification center UI and multi-channel
# infrastructure; ingestion (Matrix Application Service webhook connectors,
# Grommunio webhook/IMAP, Seafile webhook, Vikunja webhook) is the real development
# project, independent of the tool chosen — out of scope for this k8s repository
# (see connectors/). Also reused by unified search (2.2 L.399) and the presence
# aggregator (2.8 L.504), which share the same ingestion/connectors component.

api:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

ws:
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

web:
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

mongodb:
  enabled: true
  auth:
    existingSecret: novu-mongodb-secret

redis:
  enabled: true

# 1.7 — account/organization provisioning via Keycloak SSO at the level of the
# cross-cutting application portal (2.3) rather than via Novu's native auth (Novu is
# not exposed directly to consultants as a standalone application, but integrated
# into the top bar, see caddy-injection.yaml).
env:
  API_ROOT_URL: "https://notifications.libre365.example.org/api"
  WS_URL: "wss://notifications.libre365.example.org"
  FRONT_BASE_URL: "https://notifications.libre365.example.org"

ingress:
  enabled: true
  className: ""
  hosts:
    - host: notifications.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: novu-tls
      hosts:
        - notifications.libre365.example.org
