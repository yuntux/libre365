# Component: Novu — unified notification center (study 2.1 L.381-382)
#
# [CORRECTED] Novu has NO official Helm chart at all - this file used to
# claim "novuhq/helm-charts (official Novu chart)" at
# "https://novuhq.github.io/helm-charts", which does not exist (found while
# actually running dev-cluster/deploy.sh: that repo add 404s, and there is
# no "helm-charts" repository under the novuhq GitHub org at all).
# Chart used: Nova-Edge/novu-chart, a COMMUNITY chart that explicitly
# disclaims official Novu support (its own README: "created by the
# community and is not officially supported by the Novu team"), published
# as an OCI artifact - no index.yaml-based repo to point Helm at, pinned by
# version directly at install time instead:
#   oci://ghcr.io/nova-edge/charts/novu, version 0.2.1 (see
#   dev-cluster/deploy.sh/redeploy.sh)
# [UNCERTAIN] this is a low-adoption chart (2 GitHub stars at the time of
# writing) - schema below (top-level api/worker/ws/web/mongodb/redis/
# ingress/global) was verified against its real values.yaml (not guessed),
# but its actual runtime behavior has not been exercised against a live
# cluster from this sandboxed environment.
#
# [CORRECTED] found by the new helm-template-validate CI check (not a live
# cluster this time): EVERY published version of this chart through 0.2.1
# (the one pinned here) ships a values.schema.json with a real authoring
# bug of its own - its "service" schema nests `"required": ["type"]` one
# level too deep, inside "properties" instead of alongside it (confirmed
# directly against github.com/Nova-Edge/novu-chart's tagged
# charts/novu/values.schema.json for both novu-v0.2.0 and novu-v0.2.1).
# JSON Schema then reads "required" as a property NAME needing its own
# sub-schema, and an array isn't a valid one there - so Helm's metaschema
# validation of the chart's OWN schema file fails unconditionally, before
# even looking at anything in this values file. Not fixable from here:
# dev-cluster/deploy.sh/redeploy.sh install this release with
# `--skip-schema-validation` to work around it (see deploy.sh's own
# comment on that line for the full story).
#
# 2.1 L.382 — Novu chosen for the notification center UI and multi-channel
# infrastructure; ingestion (Matrix Application Service webhook connectors,
# Grommunio webhook/IMAP, Seafile webhook, Vikunja webhook) is the real development
# project, independent of the tool chosen — out of scope for this k8s repository
# (see connectors/). Also reused by unified search (2.2 L.399) and the presence
# aggregator (2.8 L.504), which share the same ingestion/connectors component.

api:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

ws:
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

web:
  replicaCount: 2
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

mongodb:
  enabled: true
  # [UNCERTAIN] assumes the chart's mongodb dependency is (or behaves like)
  # the Bitnami mongodb chart, whose `auth.existingSecret` this passes
  # through to - the community chart's own values.yaml only documents
  # `mongodb.enabled`/`mongodb.serviceBindings` by default, so this specific
  # pass-through key was not independently confirmed against its exact
  # dependency version from this sandboxed environment.
  auth:
    existingSecret: novu-mongodb-secret

# [CORRECTED] found live on a user's VM: this chart's bundled
# `bitnami/redis` dependency's own default `image.repository:
# bitnami/redis` pins an old tag (7.4.3-debian-12-r0) that 404s outright
# - "docker.io/bitnami/redis:7.4.3-debian-12-r0: not found" -
# ImagePullBackOff looping on `novu-redis-master-0` for many minutes,
# starving the kubelet's pod-worker queue and slowing down unrelated
# pods elsewhere in the cluster. Same "moved behind Bitnami Secure
# Images" story as onlyoffice-rabbitmq.yaml/seafile-mysql.yaml's own
# headers, but note this is a DIFFERENT failure mode from those: the
# `bitnami/redis` repository itself still has hundreds of live tags
# (confirmed via the Docker Hub registry API, and already working live
# for onlyoffice-redis.yaml's own current/recent tag) - it's specifically
# this OLD pinned tag that was pruned from the free tier, not the whole
# repository. `bitnamilegacy/redis` carries the exact same tag
# (confirmed: HTTP 200 on its manifest).
#
# [KNOWN TECH DEBT] bitnamilegacy is a frozen, unmaintained snapshot (no
# future security patches on this copy) - a stopgap to unblock dev, not
# a long-term choice. Migrating this repo's Bitnami-chart dependencies
# (postgresql x5, mysql, rabbitmq, redis, mongodb, memcached) to
# officially-maintained images is tracked as separate follow-up work,
# same reasoning already applied to Keycloak (switched to
# quay.io/keycloak/keycloak entirely - see ../manifests/keycloak.yaml).
# RabbitMQ specifically was investigated first: the official RabbitMQ
# Cluster Operator (ghcr.io/rabbitmq/cluster-operator, manages the
# official docker.io/library/rabbitmq image directly, verified against
# its real CRD) is the natural replacement chart-wise, but it auto-
# generates its own default-user credentials rather than accepting a
# pre-supplied username/password the way this repo's OpenBao/
# ExternalSecret pattern expects everywhere else - a real architecture
# change, not a drop-in swap, so out of scope for tonight's unblock.
redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis

# [CORRECTED] moved from a bare top-level `env:` (silently ignored by the
# real chart - its values.yaml has no such key) to `global.env`, the actual
# location its schema documents for injecting environment variables into
# every component. 1.7 — account/organization provisioning via Keycloak SSO
# at the level of the cross-cutting application portal (2.3) rather than
# via Novu's native auth (Novu is not exposed directly to consultants as a
# standalone application, but integrated into the top bar, see
# caddy-injection.yaml).
global:
  env:
    API_ROOT_URL: "https://notifications.libre365.example.org/api"
    WS_URL: "wss://notifications.libre365.example.org"
    FRONT_BASE_URL: "https://notifications.libre365.example.org"
  # [CORRECTED] `global` values are shared across a parent chart and all
  # its subcharts by Helm's own convention - this reaches the bundled
  # `redis` (and `mongodb`) dependencies above without needing to repeat
  # it per-subchart. Required alongside `redis.image.repository`: the
  # bitnami/redis subchart's own template refuses to render at all for
  # an image outside its hardcoded "recognized" allowlist otherwise (same
  # `common.errors.insecureImages` check as onlyoffice-rabbitmq.yaml's
  # own header - verified against that chart's real template/helper
  # source, not guessed).
  security:
    allowInsecureImages: true

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see ../manifests/caddy.yaml's header comment for the full rationale.
# [CORRECTED] the chart's real `ingress` schema takes a single `host`
# string, not an ingress-nginx-style `hosts`/`paths` list (the previous
# version of this file used a shape this chart doesn't define at all) -
# harmless while `enabled: false`, but wrong for whenever this ever needs
# turning on.
ingress:
  enabled: false
  className: ""
  host: notifications.libre365.example.org
  tls:
    - secretName: novu-tls
      hosts:
        - notifications.libre365.example.org
