# Component: MinIO — S3-compatible object storage (study 2.12 L.587)
# Chart used: minio/minio (official MinIO chart)
#   Helm repo: https://charts.min.io/
#   chart    : minio
#
# 2.12 L.587 — self-hosted MinIO chosen as the S3 destination for LiveKit Egress
# rather than a filesystem share (NFS) between pods: one more self-hosted component,
# not a cloud dependency. Retention on this bucket is set by the firm itself
# (generic lifecycle rule or the absence of one), rather than imposed on it
# (see 2.12 L.587).

image:
  repository: minio/minio
  tag: RELEASE.2024-10-13T13-34-11Z

mode: distributed # multi-node HA, consistent with the growth objective (chapter 4.1)
replicas: 4

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

persistence:
  enabled: true
  size: 500Gi
  storageClass: ""

# 2.12 L.587-592 — bucket dedicated to meeting recordings (LiveKit Egress
# destination) + bucket dedicated to the staging area before pickup by PeerTube.
buckets:
  - name: visio-recordings
    policy: none
    purge: false
  - name: peertube-staging
    policy: none
    purge: false

# 2.12 L.589 — ObjectCreated notifications exposed via webhook, consumed by the
# handoff connector to PeerTube (daily batch, see peertube.yaml and connectors/,
# out of scope for this k8s repository).
existingSecret: minio-root-credentials

ingress:
  enabled: true
  ingressClassName: ""
  hosts:
    - s3.libre365.example.org
  tls:
    - secretName: minio-tls
      hosts:
        - s3.libre365.example.org

consoleIngress:
  enabled: true
  ingressClassName: ""
  hosts:
    - minio-console.libre365.example.org
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio-console.libre365.example.org
