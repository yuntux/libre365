# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values, used INSTEAD
# of the synapse-100.yaml / synapse-2000.yaml production sizing overlays (mutually
# exclusive alternatives to this one, not to be stacked with it).
#
# Usage:
#   helm upgrade --install synapse ananace-charts/matrix-synapse -n libre365-dev \
#     -f synapse.yaml -f dev/synapse.yaml
#
# Key paths reused below are the real ones this chart actually defines,
# verified against its source (gitlab.com/ananace/charts,
# charts/matrix-synapse) after a live deployment failure - see
# ../synapse.yaml's own header for the full story. `workers:` in particular
# is a TOP-LEVEL key here, not nested under `synapse:` as an earlier version
# of this file assumed.

synapse:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# 1.2 L.89 — the base synapse.yaml turns on every worker (federation-sender,
# generic-worker, synchrotron, media-repository), which is the production
# architecture target but means several extra pods to schedule and wait on
# in a local k3d cluster for no functional benefit in dev (a single Synapse
# process handles the load of a handful of dev users just fine). Disabled
# here per worker (no single top-level "workers.enabled" toggle exists in
# this chart - see ../synapse.yaml's own header) - overriding just the
# `enabled` field on each worker Helm already deep-merges over the base
# file's own definition of it.
workers:
  federation_sender:
    enabled: false
  generic_worker:
    enabled: false
  media_repository:
    enabled: false
  synchrotron:
    enabled: false

postgresql:
  primary:
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"

# Not touched here (intentionally): livenessProbe/readinessProbe timings,
# autoscaling, PodDisruptionBudget. Not attested anywhere in this repo's existing
# Synapse values files, and no network access in this sandbox to confirm the
# ananace-chart's exact schema for them — left at the chart's own defaults.
