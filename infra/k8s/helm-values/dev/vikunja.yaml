# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values.
# Vikunja has no -100/-2000 sizing overlay (see vikunja.yaml header: a single sizing
# suffices from 100 to 2000 users) — this file plays the same "applied second, on
# top" role for the dev tier.
#
# Usage:
#   helm upgrade --install vikunja oci://ghcr.io/go-vikunja/helm-chart/vikunja \
#     --version 2.3.0 -n libre365-dev -f vikunja.yaml -f dev/vikunja.yaml
#
# [CORRECTED] the real chart nests everything under a top-level `vikunja:`
# key (`vikunja.controllers.main.replicas`/
# `vikunja.controllers.main.containers.main.resources`, not top-level
# `replicaCount:`/`resources:`) - see ../vikunja.yaml's own header for the
# full story, verified against the chart's real source.

vikunja:
  controllers:
    main:
      replicas: 1
      containers:
        main:
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
