# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values, used INSTEAD
# of the keycloak-100.yaml / keycloak-2000.yaml production sizing overlays (those are
# mutually exclusive alternatives to this one, not to be stacked with it: dev only
# needs Keycloak to boot and be usable, not to reproduce a production capacity plan).
#
# Usage:
#   helm upgrade --install keycloak bitnami/keycloak -n libre365-dev \
#     -f keycloak.yaml -f dev/keycloak.yaml
#
# Key paths reused below are exactly the ones already used in keycloak.yaml /
# keycloak-100.yaml / keycloak-2000.yaml (Bitnami chart convention). No key not
# already attested elsewhere in this repo for this chart has been introduced.

# Single instance: the HA target (1.7 L.271) is a production concern, not a dev one.
replicaCount: 1

# 1.7 L.271 — the base keycloak.yaml enables the distributed Infinispan cache
# (`cache.enabled: true`) needed for HA clustering across several replicas. With a
# single dev replica there is nothing to distribute the cache across, so it is
# disabled here for faster startup (Infinispan cluster formation adds noticeable
# boot latency with no benefit at replicaCount: 1).
cache:
  enabled: false

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

postgresql:
  primary:
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Not touched here (intentionally): livenessProbe/readinessProbe timings,
# autoscaling, PodDisruptionBudget. These keys are not attested anywhere in this
# repo's existing Keycloak values files, this sandbox has no network access to the
# Bitnami chart repository to verify their exact schema, and dev speed does not
# require tuning them — the chart's own defaults are used as-is.
