# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values.
# MinIO has no -100/-2000 sizing overlay — this file plays the same "applied second,
# on top" role for the dev tier.
#
# Usage:
#   helm upgrade --install minio minio/minio -n libre365-dev \
#     -f minio.yaml -f dev/minio.yaml
#
# Key paths reused below (`mode`, `replicas`, `resources.requests/limits.cpu/memory`)
# are exactly the ones already used in minio.yaml.

# Chapter 4.1 growth objective (base file) calls for `mode: distributed` with 4
# replicas (multi-node HA, erasure coding). That is the clustering feature itself —
# switched to a single standalone node for dev, using the same keys the base file
# already sets.
mode: standalone
replicas: 1

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
