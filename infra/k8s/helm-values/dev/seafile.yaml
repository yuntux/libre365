# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values.
# Seafile has no -100/-2000 sizing overlay (see seafile.yaml header: sizing driven by
# stored data volume, not user count) — this file plays the same "applied second, on
# top" role for the dev tier.
#
# Usage:
#   helm upgrade --install seafile seafile-charts/ce -n libre365-dev \
#     -f seafile.yaml -f dev/seafile.yaml
#
# [CORRECTED] the real chart nests everything under a top-level `seafile:`
# key (`seafile.extraResources`, not top-level `resources:`) - see
# ../seafile.yaml's own header for the full story, verified against the
# chart's real source.

seafile:
  # Base file requests 2 cores / 8Gi (sized for real data volume + sync traffic, 1.4
  # L.136) — far more than a local dev instance with a handful of test files needs.
  extraResources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

  configs:
    seafileDataVolume:
      storage: 10Gi
