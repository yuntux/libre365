# Dev-speed hardening overlay for External Secrets Operator - see
# ../../../../dev-cluster/README.md, "Testing secret propagation".
# Usage:
#   helm upgrade --install external-secrets external-secrets/external-secrets \
#     -n libre365 -f external-secrets.yaml -f dev/external-secrets.yaml
replicaCount: 1
webhook:
  replicaCount: 1
certController:
  replicaCount: 1

resources:
  requests:
    cpu: "25m"
    memory: "32Mi"
  limits:
    cpu: "100m"
    memory: "64Mi"
