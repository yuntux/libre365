# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values.
#
# Usage:
#   helm upgrade --install seafile-memcached bitnami/memcached -n libre365-dev \
#     -f seafile-memcached.yaml -f dev/seafile-memcached.yaml

resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "100m"
    memory: "128Mi"
