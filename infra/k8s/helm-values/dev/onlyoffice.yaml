# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values, used INSTEAD
# of the onlyoffice-100.yaml / onlyoffice-2000.yaml production sizing overlays
# (mutually exclusive alternatives to this one, not to be stacked with it). Because
# the base onlyoffice.yaml carries no docservice/converter sizing of its own (those
# only exist in the -100/-2000 overlays), this file must set them directly.
#
# Usage:
#   helm upgrade --install onlyoffice onlyoffice/docs -n libre365-dev \
#     -f onlyoffice.yaml -f dev/onlyoffice.yaml
#
# [CORRECTED] the real chart splits sizing across `docservice`/`converter`,
# not a single top-level `replicaCount`/`resources`, and has no bundled
# Redis at all - see onlyoffice-100.yaml/onlyoffice.yaml's own headers for
# the full story (found by actually running dev-cluster/deploy.sh, then
# verifying the chart's real source). Redis itself is now trimmed via its
# own standalone release's dev overlay (dev/onlyoffice-redis.yaml).

# 1.5 L.198 — the base cluster-from-day-one design is a production concern; a single
# Document Server instance is plenty for local dev.
docservice:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

converter:
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# [CORRECTED] found by actually running dev-cluster/deploy.sh: the chart's
# own `ds-files`/`ds-runtime-config` PVCs hardcode `accessModes:
# [ReadWriteMany]` (shared between `docservice` and `converter`), which
# k3d's `local-path` StorageClass cannot provision at all - see
# ../../manifests/dev/onlyoffice-storage.yaml's header for the full
# story and the statically pre-provisioned PVCs this points at instead
# (applied by dev-cluster/deploy.sh right before this release). Both
# volumes are hostPath-backed on a single pinned node, so both
# Deployments must land on that exact same node too.
persistence:
  existingClaim: onlyoffice-ds-files-dev
  runtimeConfig:
    existingClaim: onlyoffice-ds-runtime-config-dev

nodeSelector:
  kubernetes.io/hostname: k3d-libre365-dev-agent-0
