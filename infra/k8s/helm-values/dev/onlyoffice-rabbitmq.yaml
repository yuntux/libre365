# Dev-speed hardening overlay — k3d local dev tier (docker-compose -> k3d migration).
# This is an ADDITIONAL -f file layered on top of the base chart values.
#
# Usage:
#   helm upgrade --install onlyoffice-rabbitmq bitnami/rabbitmq -n libre365-dev \
#     -f onlyoffice-rabbitmq.yaml -f dev/onlyoffice-rabbitmq.yaml

persistence:
  size: 1Gi

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"
