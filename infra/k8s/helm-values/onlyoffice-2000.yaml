# Sizing overlay — 2000 users
# Extrapolation of the reference scenario 1.5 L.195-196 (100 x 20 documents = 2000
# connections) to the 2000-user scale: the number of Document Server replicas
# increases to absorb the volume of simultaneous connections, each replica staying
# sized as at 100 (~8 cores/16 GB), in line with the cluster's horizontal scaling
# principle adopted in 1.5 L.198.
# Usage: helm upgrade --install onlyoffice onlyoffice/docs-cloud -f onlyoffice.yaml -f onlyoffice-2000.yaml
replicaCount: 4

resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"
# i.e. ~16 cores / 32 GB RAM combined across the 4 replicas, to be refined with a
# real load test (JMeter, 1.5 L.196) before going to production at this scale.

redis:
  master:
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
