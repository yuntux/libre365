# Component: Element Call — native Matrix video-conferencing app, MatrixRTC protocol,
# LiveKit SFU backend (study 1.3 L.107).
# No official Helm chart maintained by Element at this time (element-call is packaged
# as a single container serving the static app + a small LiveKit JWT auth service):
# raw manifest based on a generic Deployment, values below in "chart-like" format to
# stay consistent with the repository's convention should a community chart be
# adopted later (e.g. via a generic chart such as `bjw-s/app-template`).

replicaCount: 2

image:
  repository: ghcr.io/element-hq/element-call
  tag: "v0.25.0"

env:
  # 1.3 L.107 — LiveKit backend shared with Visio for the media SFU part.
  - name: LIVEKIT_URL
    value: "wss://livekit.libre365.example.org"
  - name: LIVEKIT_JWT_SERVICE_URL
    value: "http://element-call-auth.libre365.svc.cluster.local:8080"
  - name: MATRIX_HOMESERVER_URL
    value: "https://matrix.libre365.example.org"
  - name: DEFAULT_HOMESERVER
    value: "libre365.example.org"

# LiveKit JWT auth service dedicated to Element Call (Matrix token <-> LiveKit token exchange)
authService:
  enabled: true
  image:
    repository: ghcr.io/element-hq/lk-jwt-service
    tag: "0.6.0"
  env:
    - name: LIVEKIT_URL
      value: "wss://livekit.libre365.example.org"
    - name: LIVEKIT_KEY
      valueFrom:
        secretKeyRef:
          name: livekit-keys
          key: api-key
    - name: LIVEKIT_SECRET
      valueFrom:
        secretKeyRef:
          name: livekit-keys
          key: api-secret
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see keycloak.yaml's ingress comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: call.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: element-call-tls
      hosts:
        - call.libre365.example.org
