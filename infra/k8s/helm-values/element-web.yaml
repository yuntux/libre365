# Component: Element Web — Matrix client (study 1.2 L.84)
# Chart used: ananace-chart/matrix-element-web (https://ananace.gitlab.io/charts)
#   Helm repo: https://ananace.gitlab.io/charts
#   chart    : matrix-element-web
# (community chart; no official chart maintained by Element/New Vector to date)
#
# No dedicated 100/2000 variant: Element Web is a stateless static (SPA) client, its
# sizing only varies by the number of frontend replicas (see the bottom of the file)
# and not by CPU/RAM (negligible load, served as static files).

replicaCount: 2

image:
  repository: vectorim/element-web
  tag: "v1.11.86"

config:
  default_server_config:
    "m.homeserver":
      base_url: "https://matrix.libre365.example.org"
      server_name: "libre365.example.org"
    "m.identity_server":
      base_url: "https://vector.im"

  # 2.4 L.427-436 — MatrixRTC / Element Call natively embedded as a room widget,
  # LiveKit backend (1.3 L.107).
  element_call:
    url: "https://call.libre365.example.org"
    use_exclusively: false
    participant_limit: 8
    brand: "Element Call"

  # 2.4 L.436 — /visio widget (adapted from Tchap) pointing to DINUM/LaSuite Meet Visio.
  jitsi:
    preferredDomain: "" # not used: dedicated /visio widget, see connectors/ (out of scope for this k8s repository)

  sso_immediate_redirect: true
  disable_custom_urls: false
  disable_guests: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

ingress:
  enabled: true
  className: ""
  hosts:
    - host: chat.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: element-web-tls
      hosts:
        - chat.libre365.example.org
