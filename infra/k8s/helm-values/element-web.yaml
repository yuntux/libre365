# Component: Element Web — Matrix client (study 1.2 L.84)
# Chart used: ananace-chart/element-web (https://ananace.gitlab.io/charts)
#   Helm repo: https://ananace.gitlab.io/charts
#   chart    : element-web
# (community chart; no official chart maintained by Element/New Vector to date)
#
# No dedicated 100/2000 variant: Element Web is a stateless static (SPA) client, its
# sizing only varies by the number of frontend replicas (see the bottom of the file)
# and not by CPU/RAM (negligible load, served as static files).
#
# [CORRECTED] found by actually running dev-cluster/deploy.sh: the chart name
# itself was wrong ("matrix-element-web" doesn't exist in the ananace-charts
# index; the real chart directory/name is "element-web"). While re-verifying
# this chart's real source (gitlab.com/ananace/charts, charts/element-web)
# after that failure, found a second, silent bug: `defaultServer.url` and
# `defaultServer.name` are top-level, REQUIRED keys the chart itself uses to
# build config.json's `default_server_config` block (templates/configuration.yaml)
# - the previous `config.default_server_config` below was not just misplaced,
# it would have been silently dropped entirely (the chart's own generated
# default_server_config dict wins over `.Values.config` on that specific key
# via a `merge` where the chart's own dict is the merge destination) while
# also failing to satisfy the chart's `required` check on defaultServer.url/name.

replicaCount: 2

image:
  repository: vectorim/element-web
  tag: "v1.12.27"

defaultServer:
  url: "https://matrix.libre365.example.org"
  name: "libre365.example.org"
  identity_url: "https://vector.im"

config:
  # 2.4 L.427-436 — MatrixRTC / Element Call natively embedded as a room widget,
  # LiveKit backend (1.3 L.107). Element Call now ships bundled inside the
  # Element Web package itself rather than being reached at a configured
  # `url` (that field, and `participant_limit`, no longer exist in Element
  # Web's config schema) - [UNCERTAIN, not re-verified end-to-end]: this
  # may make the standalone Element Call deployment
  # (infra/k8s/helm-values/element-call.yaml, the `call.libre365.example.org`
  # Caddy site block) redundant for the embedded-widget use case; worth
  # reassessing before the next deployment rather than assumed unaffected.
  element_call:
    use_exclusively: false
    brand: "Element Call"

  # 2.4 L.436 — /visio widget (adapted from Tchap) pointing to DINUM/LaSuite Meet Visio.
  jitsi:
    preferredDomain: "" # not used: dedicated /visio widget, see connectors/ (out of scope for this k8s repository)

  sso_redirect_options:
    immediate: true
  disable_custom_urls: false
  disable_guests: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see ../manifests/caddy.yaml's header comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: chat.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: element-web-tls
      hosts:
        - chat.libre365.example.org
