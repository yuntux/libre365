# Brique : Element Web — client Matrix (etude 1.2 L.84)
# Chart utilise : ananace-chart/matrix-element-web (https://ananace.gitlab.io/charts)
#   repo Helm : https://ananace.gitlab.io/charts
#   chart    : matrix-element-web
# (chart communautaire ; pas de chart officiel maintenu par Element/New Vector a ce jour)
#
# Pas de variante 100/2000 dediee : Element Web est un client statique (SPA) sans etat,
# le dimensionnement varie uniquement par le nombre de replicas front (cf. bas de fichier)
# et non par CPU/RAM (charge negligeable, servie en fichiers statiques).

replicaCount: 2

image:
  repository: vectorim/element-web
  tag: "v1.11.86"

config:
  default_server_config:
    "m.homeserver":
      base_url: "https://matrix.libre365.example.org"
      server_name: "libre365.example.org"
    "m.identity_server":
      base_url: "https://vector.im"

  # 2.4 L.427-436 — MatrixRTC / Element Call embarque nativement comme widget de room,
  # backend LiveKit (1.3 L.107).
  element_call:
    url: "https://call.libre365.example.org"
    use_exclusively: false
    participant_limit: 8
    brand: "Element Call"

  # 2.4 L.436 — widget /visio (adapte de Tchap) pointant vers Visio DINUM/LaSuite Meet.
  jitsi:
    preferredDomain: "" # non utilise : widget /visio dedie, cf. connectors/ (hors perimetre de ce depot k8s)

  sso_immediate_redirect: true
  disable_custom_urls: false
  disable_guests: true

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

ingress:
  enabled: true
  className: ""
  hosts:
    - host: chat.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: element-web-tls
      hosts:
        - chat.libre365.example.org
