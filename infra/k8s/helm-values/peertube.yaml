# Component: PeerTube — enterprise video platform (study 2.12 L.576-592)
# Chart used: community chart `peertube-helm/peertube` (ArtifactHub, several community
#   forks exist — to be confirmed at deployment time) or, failing that, a raw manifest
#   derived from the official `chocobozzz/peertube` image.
#   Helm repo: https://peertube-helm.github.io/charts (to be confirmed)
#
# 2.12 L.581-582 — basic configuration: organization by channels/playlists (one
# channel per team or meeting type), ActivityPub federation disabled (strictly
# internal use, federation is not an expressed need, see 2.12 L.583).
# Fed by the MinIO -> PeerTube handoff connector (daily batch, see 2.12
# L.589, development out of scope for this k8s repository, see connectors/).

image:
  repository: chocobozzz/peertube
  tag: "v8.2.4-bookworm"

replicaCount: 1

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

config:
  webserver:
    hostname: "videos.libre365.example.org"
  # 2.12 L.583 — ActivityPub federation disabled: strictly internal use.
  federation:
    videos:
      federate_unlisted: false

  # 2.12 L.581-582 — default "internal" visibility (not publicly listed,
  # but visible to any authenticated user of the instance): PeerTube's
  # privacy enum is 1=public, 2=unlisted, 3=private (owner only),
  # 4=internal (any authenticated instance user), 5=password-protected.
  defaults:
    publish:
      privacy: 4

  # 1.7 — Keycloak SSO (official PeerTube OpenID Connect plugin,
  # `peertube-plugin-auth-openidconnect`). [UNCERTAIN]: PeerTube plugin
  # settings are stored in its database, set through the admin UI or `PUT
  # /api/v1/plugins/{npmName}/settings` - not through a config file/env
  # var, and no real community Helm chart exposes a `plugins:` values
  # block. This block is therefore NON-FUNCTIONAL as static Helm values.
  # Making it work needs the same shape as Gokapi's bootstrap
  # (infra/k8s/manifests/gokapi.yaml's initContainer): a Job/initContainer
  # that (1) installs `peertube-plugin-auth-openidconnect` via `POST
  # /api/v1/plugins/install` and (2) PUTs its settings, both authenticated
  # as the root account - tracked as follow-up work. The client secret is
  # already generated as peertube-oidc-secret (external-secrets.yaml,
  # OpenBao-sourced), ready to be consumed by that future bootstrap Job.
  # plugins:
  #   openid_connect:
  #     enabled: true
  #     discover_url: "https://sso.libre365.example.org/realms/libre365/.well-known/openid-configuration"
  #     client_id: "peertube"
  #     client_secret: (from peertube-oidc-secret)

  signup:
    enabled: false # accounts provisioned via Keycloak SSO only

postgresql:
  enabled: true
  auth:
    database: peertube
    existingSecret: peertube-postgres-secret

redis:
  enabled: true

persistence:
  storage:
    enabled: true
    size: 1Ti
    storageClass: ""

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see keycloak.yaml's ingress comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: videos.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: peertube-tls
      hosts:
        - videos.libre365.example.org
