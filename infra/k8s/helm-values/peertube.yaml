# Component: PeerTube — enterprise video platform (study 2.12 L.576-592)
# Chart used: community chart `peertube-helm/peertube` (ArtifactHub, several community
#   forks exist — to be confirmed at deployment time) or, failing that, a raw manifest
#   derived from the official `chocobozzz/peertube` image.
#   Helm repo: https://peertube-helm.github.io/charts (to be confirmed)
#
# 2.12 L.581-582 — basic configuration: organization by channels/playlists (one
# channel per team or meeting type), ActivityPub federation disabled (strictly
# internal use, federation is not an expressed need, see 2.12 L.583).
# Fed by the MinIO -> PeerTube handoff connector (daily batch, see 2.12
# L.589, development out of scope for this k8s repository, see connectors/).

image:
  repository: chocobozzz/peertube
  tag: "v6.3.2-bookworm"

replicaCount: 1

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

config:
  webserver:
    hostname: "videos.libre365.example.org"
  # 2.12 L.583 — ActivityPub federation disabled: strictly internal use.
  federation:
    videos:
      federate_unlisted: false
    prevent_search_indexation:
      enabled: true

  # 2.12 L.581-582 — default "internal" visibility (not publicly listed, but visible
  # to any authenticated user of the instance), rather than "public" or "unlisted".
  defaults:
    publish:
      privacy: 3 # 1=public, 2=unlisted, 3=private (internal depending on instance config), 4=password-protected — to be confirmed against the exact PeerTube version

  # 1.7 — Keycloak SSO (official PeerTube OpenID Connect plugin). Client
  # secret from peertube-oidc-secret (external-secrets.yaml, OpenBao-
  # sourced) - client_id was set with no client_secret at all found during
  # a review pass. [UNCERTAIN]: this community chart's exact field shape
  # for injecting a Kubernetes Secret into a plugin setting isn't
  # independently confirmed (PeerTube plugin settings are normally
  # persisted via its own admin API/database rather than a static config
  # file - the whole `plugins:` block here was already flagged
  # unconfirmed against the actual chart, see this file's header) -
  # mirrors the existingSecret/existingSecretKey pattern this same file
  # already uses for postgresql/redis as the most consistent guess given
  # that pre-existing uncertainty; verify against the real chart at
  # deployment time.
  plugins:
    openid_connect:
      enabled: true
      discover_url: "https://sso.libre365.example.org/realms/libre365/.well-known/openid-configuration"
      client_id: "peertube"
      client_secret:
        existingSecret: peertube-oidc-secret
        existingSecretKey: client-secret

  signup:
    enabled: false # accounts provisioned via Keycloak SSO only

postgresql:
  enabled: true
  auth:
    database: peertube
    existingSecret: peertube-postgres-secret

redis:
  enabled: true

persistence:
  storage:
    enabled: true
    size: 1Ti
    storageClass: ""

# Disabled: Caddy (../manifests/caddy.yaml) is the sole public entry point -
# see keycloak.yaml's ingress comment for the full rationale.
ingress:
  enabled: false
  className: ""
  hosts:
    - host: videos.libre365.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: peertube-tls
      hosts:
        - videos.libre365.example.org
