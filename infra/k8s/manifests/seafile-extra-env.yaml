# Non-secret environment variables for Seafile CE (study 1.4/1.5/1.7) that
# the real `haiwen/seafile-helm-chart` `ce` chart's own `seafile.env` map
# cannot carry: that chart's templates/seafile-env.yaml only ever writes the
# fixed list of variable names in its own `seafile.presetEnv` (SEAFILE_*,
# CACHE_PROVIDER, REDIS_*/MEMCACHED_*, ENABLE_*, ...) - anything else placed
# under `seafile.env` in ../helm-values/seafile.yaml is silently dropped
# ([CORRECTED], found by actually running dev-cluster/deploy.sh, then
# verifying the chart's real source at gitlab.com/ananace/charts... no,
# github.com/haiwen/seafile-helm-chart, template/13.0/ce).
#
# The chart's own `seafile.extraEnv` field is the only way to inject
# additional variables - but despite the name, it is NOT a list of plain
# EnvVar entries: seafile-deployment.yaml appends it inside the container's
# `envFrom:` list, so each entry must be a whole `configMapRef`/`secretRef`,
# injecting every key of the referenced object as-is. This ConfigMap is
# that mechanism for Seafile's non-secret settings (see
# ../helm-values/seafile.yaml's `seafile.extraEnv`); the OIDC client secret
# goes through the existing `seafile-oidc-secret` the same way (its
# ExternalSecret's key was renamed to the literal env var name
# OAUTH_CLIENT_SECRET for exactly this reason - see external-secrets.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: seafile-extra-env
  namespace: libre365
data:
  # 2.11 L.565 — ban on unauthenticated share links: any unauthenticated
  # external sharing must go through Gokapi (1.8), not a public Seafile
  # share link.
  SHARE_LINK_LOGIN_REQUIRED: "true"

  # 1.5 L.193 — OnlyOffice integration as the office server (Community
  # edition >= 9.4, connection cap lifted). The JWT secret itself
  # (ONLYOFFICE_JWT_SECRET) is a credential, sourced through
  # seafile-secret instead (see ../helm-values/seafile.yaml).
  OFFICE_SERVER_TYPE: "OnlyOffice"
  ONLYOFFICE_APIJS_URL: "https://office.libre365.example.org/web-apps/apps/api/documents/api.js"

  # 1.7 — Keycloak SSO (native Seafile OIDC), client_id "seafile"
  # (infra/ansible/roles/keycloak_realm/defaults/main.yml).
  ENABLE_OAUTH: "true"
  OAUTH_PROVIDER_DOMAIN: "sso.libre365.example.org"
  OAUTH_CLIENT_ID: "seafile"
