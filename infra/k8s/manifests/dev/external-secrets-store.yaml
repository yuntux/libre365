# Dev-only ClusterSecretStore - see dev-cluster/README.md, "Testing secret
# propagation". Applied INSTEAD OF ../external-secrets-store.yaml in the
# k3d dev cluster (dev-cluster/deploy.sh), never both.
#
# [CORRECTED] `apiVersion: external-secrets.io/v1beta1` used to fail with
# "no matches for kind ClusterSecretStore ... ensure CRDs are installed
# first" even once the CRDs were confirmed Established - found by actually
# running dev-cluster/deploy.sh: `external-secrets` 2.10.0 (the version
# `helm upgrade --install` currently pulls, unpinned) serves `v1` only
# (`served: true`) and merely lists `v1beta1` for backward-compat CRD
# metadata (`served: false`) - the same promotion most CRD-based operators
# eventually make. Confirmed directly against the live CRD's
# `spec.versions[*].served` on a real cluster, not guessed.
#
# Uses a static token rather than the Kubernetes-auth method the
# production store uses: OpenBao's dev-mode server
# (../../helm-values/dev/openbao.yaml, `server.dev.enabled: true`) issues
# one fixed, well-known root token by design (there is no unseal/policy
# ceremony to authenticate against in dev mode) - configuring the
# Kubernetes auth method against a throwaway dev server would test nothing
# that the production path doesn't already need verifying for real
# (infra/ansible/roles/openbao_config).

apiVersion: v1
kind: Secret
metadata:
  name: openbao-dev-root-token
  namespace: libre365
type: Opaque
stringData:
  token: "libre365-dev-root-token"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.libre365.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-dev-root-token
          namespace: libre365
          key: token
