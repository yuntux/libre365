# Component: Gokapi — large file sharing with E2EE (study 1.8 L.311-312)
# No known official Helm chart for Gokapi (Forceu/Gokapi): raw manifest
# Deployment + Service + PVC, derived from the official `f0rc3/gokapi` image.
#
# Version pinned to v2.2.4. OIDC is configured non-interactively via a
# one-time setup wizard (internal/configuration/setup/Setup.go) that
# persists everything to config.json; the `initContainer` below submits
# that setup payload over HTTP. See docs/oidc.md for the full story.
#
# 1.8 L.311-312 — two mandatory conditions at deployment time:
#   1. Explicitly enable true end-to-end encryption - this is NOT Gokapi's
#      default. The setup payload below uses `encrypt_sel: "5"`
#      (`encryption.EndToEndEncryption`), the level that actually means
#      zero-knowledge E2EE (level 3 is `FullEncryptionStored`, server
#      holds the key - not the same thing).
#   2. DO NOT ENABLE the "File Request" feature (upload by an external third
#      party with no account): it bypasses E2EE even when full encryption is
#      otherwise active (1.8 L.304, L.312). This is a per-API-key/user
#      permission (`ApiPermManageFileRequests`) rather than a single global
#      toggle - since no user/API key created by the bootstrap below is
#      ever granted that permission, the net effect (no one can create a
#      File Request) holds by omission.
# Native OIDC toward Keycloak (1.8 L.303, L.306) — MANDATORY to use Gokapi's
# up-to-date Keycloak documentation at deployment time (a previous configuration
# example allowed unauthorized access, see 1.8 L.306).
#
# Tasmane branding: colors are injected via Caddy's injection directive
# (infra/k8s/manifests/caddy.yaml's depot.<domain> site block,
# infra/k8s/manifests/caddy-injection.yaml's gokapi-branding.html) rather
# than Gokapi's native /app/custom/custom.css mechanism - the Caddy route
# needs no coordination with Gokapi's own file layout across upgrades. See
# caddy-injection.yaml's own comment for the full rationale.

apiVersion: v1
kind: ConfigMap
metadata:
  name: gokapi-setup-bootstrap
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
data:
  # Runs as an initContainer (same image as the main container) BEFORE
  # Gokapi ever serves real traffic: v2.x's one-time setup wizard
  # (internal/configuration/setup/Setup.go) is UNAUTHENTICATED on first
  # boot by design ("No auth required on initial setup" - checked against
  # the real source) - the initContainer completing it here, before the
  # Service/Ingress ever exist for this Deployment's pod, is what makes
  # that safe rather than racing an anonymous request against the public
  # internet.
  #
  # Idempotent (checks for an existing config.json first, matching this
  # repo's other bootstrap automation, e.g.
  # infra/ansible/roles/grommunio_cert's `creates:`), so it's a no-op after
  # the very first successful run - config.json then lives on the same PVC
  # as the app's data, surviving every pod restart/rollout.
  #
  # The exact JSON wire format below (`[{"name": ..., "value": ...}, ...]`,
  # POSTed to /setup/setupResult) is Setup.go's own internal, undocumented
  # form-submission contract, not a stable public API - reconstructed by
  # reading every `getFormValue*(formObjects, "...")` call in that file
  # and VERIFIED by actually building the pinned v2.2.4 tag from source
  # (go generate + go build) and running this exact script against the
  # real binary in a sandboxed test, confirming config.json comes out with
  # the expected Method/Encryption.Level/OAuth fields - not just read from
  # the source and assumed correct.
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    # [ADDED] found live on a user's VM: in the k3d dev cluster,
    # GOKAPI_OAUTH_ISSUER below resolves to caddy-dev, which terminates
    # TLS with Caddy's own internal CA (see infra/k8s/manifests/dev/
    # caddy.yaml) rather than a publicly-trusted one - Gokapi's OIDC
    # discovery call would otherwise fail x509 verification, and unlike
    # oauth2-proxy, Gokapi has no "skip TLS verification" flag at all
    # (checked its own docs/advanced.rst). Built BEFORE the config.json
    # early-exit below since the main container needs this bundle on
    # EVERY start, not just this container's first run. Harmless/no-op in
    # production: /etc/gokapi-ca-input/ca.crt only exists when the
    # "caddy-dev-ca" ConfigMap does (dev-cluster/trust-caddy-dev-ca.sh,
    # never applied outside the k3d dev cluster) - the resulting bundle
    # is then just a byte-for-byte copy of the image's own default one.
    CA_BUNDLE="${GOKAPI_CA_BUNDLE_DIR}/ca-bundle.crt"
    cp /etc/ssl/certs/ca-certificates.crt "$CA_BUNDLE"
    if [ -f /etc/gokapi-ca-input/ca.crt ]; then
      cat /etc/gokapi-ca-input/ca.crt >> "$CA_BUNDLE"
      echo "Trusting caddy-dev's internal CA (dev-cluster/trust-caddy-dev-ca.sh) in addition to the default CA bundle"
    fi

    CONFIG_FILE="${GOKAPI_CONFIG_DIR}/config.json"

    if [ -f "$CONFIG_FILE" ]; then
      echo "config.json already exists at $CONFIG_FILE, skipping setup bootstrap (idempotent)"
      exit 0
    fi

    /app/gokapi &
    GOKAPI_PID=$!

    echo "Waiting for the setup webserver to accept connections..."
    i=0
    while [ "$i" -lt 30 ]; do
      if curl -sf "http://127.0.0.1:${GOKAPI_PORT}/setup/start" > /dev/null 2>&1; then
        break
      fi
      i=$((i + 1))
      sleep 1
    done

    cat > /tmp/setup_payload.json <<PAYLOAD
    [
      {"name": "dbtype_sel", "value": "0"},
      {"name": "sqlite_location", "value": "gokapi.sqlite"},
      {"name": "redis_location", "value": ""},
      {"name": "redis_prefix", "value": ""},
      {"name": "redis_user", "value": ""},
      {"name": "redis_password", "value": ""},
      {"name": "redis_ssl_sel", "value": "false"},
      {"name": "auth_username", "value": ""},
      {"name": "auth_pw", "value": ""},
      {"name": "oauth_provider", "value": "${GOKAPI_OAUTH_ISSUER}"},
      {"name": "oauth_id", "value": "${GOKAPI_OAUTH_CLIENT_ID}"},
      {"name": "oauth_secret", "value": "${GOKAPI_OAUTH_CLIENT_SECRET}"},
      {"name": "oauth_recheck_interval", "value": "12"},
      {"name": "oauth_admin_user", "value": "${GOKAPI_ADMIN_EMAIL}"},
      {"name": "oauth_only_registered_users", "value": "false"},
      {"name": "oauth_restrict_groups", "value": "false"},
      {"name": "oauth_allowed_groups", "value": ""},
      {"name": "oauth_scope_groups", "value": ""},
      {"name": "auth_header_admin", "value": ""},
      {"name": "auth_headerkey", "value": ""},
      {"name": "auth_header_only_registered_users", "value": "false"},
      {"name": "port", "value": "${GOKAPI_PORT}"},
      {"name": "localhost_sel", "value": "false"},
      {"name": "public_name", "value": "Gokapi"},
      {"name": "url", "value": "${GOKAPI_PUBLIC_URL}"},
      {"name": "url_redirection", "value": ""},
      {"name": "ssl_sel", "value": "false"},
      {"name": "logip_sel", "value": "false"},
      {"name": "showfilename_sel", "value": "true"},
      {"name": "authentication_sel", "value": "1"},
      {"name": "storage_sel_image", "value": "local"},
      {"name": "storage_sel", "value": "local"},
      {"name": "storage_sel_proxy", "value": "false"},
      {"name": "s3_bucket", "value": ""},
      {"name": "s3_region", "value": ""},
      {"name": "s3_api", "value": ""},
      {"name": "s3_secret", "value": ""},
      {"name": "s3_endpoint", "value": ""},
      {"name": "enc_pw", "value": ""},
      {"name": "cleare2e", "value": "false"},
      {"name": "encrypt_sel", "value": "5"}
    ]
    PAYLOAD

    echo "Submitting non-interactive setup..."
    RESPONSE=$(curl -sf -X POST -H "Content-Type: application/json" --data @/tmp/setup_payload.json "http://127.0.0.1:${GOKAPI_PORT}/setup/setupResult")
    echo "Setup response: $RESPONSE"

    wait "$GOKAPI_PID" 2>/dev/null || true

    if [ ! -f "$CONFIG_FILE" ]; then
      echo "Bootstrap failed: $CONFIG_FILE was not created" >&2
      exit 1
    fi
    echo "Gokapi bootstrap complete: $CONFIG_FILE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gokapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gokapi
    spec:
      initContainers:
        - name: gokapi-setup-bootstrap
          image: f0rc3/gokapi:v2.2.4
          command: ["/bin/sh", "/etc/gokapi-bootstrap/bootstrap.sh"]
          env:
            - name: GOKAPI_CONFIG_DIR
              value: "/app/config"
            - name: GOKAPI_DATA_DIR
              value: "/app/data"
            - name: GOKAPI_PORT
              value: "53842"
            # 1.7/1.8 L.303 — Native OIDC toward Keycloak
            - name: GOKAPI_OAUTH_ISSUER
              value: "https://sso.libre365.example.org/realms/libre365"
            - name: GOKAPI_OAUTH_CLIENT_ID
              value: "gokapi"
            - name: GOKAPI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gokapi-oidc-secret
                  key: client-secret
            # Whichever Keycloak user logs in with this email first becomes
            # Gokapi's initial super-admin (Setup.go's `oauth_admin_user`) -
            # must correspond to a real user in the realm. Domain-derived,
            # not a fixed literal - patched by scripts/sync_platform.py the
            # same way every other admin@<domain> reference in this repo is
            # (see _BARE_DOMAIN_PATTERNS).
            - name: GOKAPI_ADMIN_EMAIL
              value: "admin@libre365.example.org"
            - name: GOKAPI_PUBLIC_URL
              value: "https://depot.libre365.example.org"
            # [ADDED] see bootstrap.sh's own comment above - unset/unused
            # outside the k3d dev cluster.
            - name: GOKAPI_CA_BUNDLE_DIR
              value: "/etc/gokapi-ca"
            - name: SSL_CERT_FILE
              value: "/etc/gokapi-ca/ca-bundle.crt"
          volumeMounts:
            - name: gokapi-data
              mountPath: /app/data
              subPath: data
            - name: gokapi-config
              mountPath: /app/config
              subPath: config
            - name: gokapi-setup-bootstrap
              mountPath: /etc/gokapi-bootstrap
            - name: gokapi-ca-bundle
              mountPath: /etc/gokapi-ca
            - name: caddy-dev-ca
              mountPath: /etc/gokapi-ca-input
              readOnly: true
      containers:
        - name: gokapi
          image: f0rc3/gokapi:v2.2.4
          ports:
            - containerPort: 53842
          env:
            - name: GOKAPI_CONFIG_DIR
              value: "/app/config"
            - name: GOKAPI_DATA_DIR
              value: "/app/data"
            - name: GOKAPI_PORT
              value: "53842"
            # [ADDED] see bootstrap.sh's own comment above - this
            # container only READS the bundle the initContainer already
            # built (same emptyDir, see the volume below); unset/unused
            # outside the k3d dev cluster.
            - name: SSL_CERT_FILE
              value: "/etc/gokapi-ca/ca-bundle.crt"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: gokapi-data
              mountPath: /app/data
              subPath: data
            - name: gokapi-config
              mountPath: /app/config
              subPath: config
            - name: gokapi-ca-bundle
              mountPath: /etc/gokapi-ca
      volumes:
        - name: gokapi-data
          persistentVolumeClaim:
            claimName: gokapi-data
        - name: gokapi-config
          # Same PVC as gokapi-data, different subPath - config.json
          # (written once by the initContainer above) must persist across
          # every pod restart/rollout exactly like the uploaded files do.
          persistentVolumeClaim:
            claimName: gokapi-data
        - name: gokapi-setup-bootstrap
          configMap:
            name: gokapi-setup-bootstrap
            defaultMode: 0o555
        # [ADDED] see bootstrap.sh's own comment above - populated by the
        # initContainer, read by the main container; ephemeral by design
        # (rebuilt from scratch, identically, on every pod start).
        - name: gokapi-ca-bundle
          emptyDir: {}
        # [ADDED] optional: this ConfigMap only exists in the k3d dev
        # cluster (dev-cluster/trust-caddy-dev-ca.sh) - `optional: true`
        # makes the mount resolve to an empty directory instead of
        # failing when it doesn't exist (production).
        - name: caddy-dev-ca
          configMap:
            name: caddy-dev-ca
            optional: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokapi-data
  namespace: libre365
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
# [CORRECTED] found live on a user's VM ("spec.ingressClassName: Invalid
# value: ''" - k8s rejects an empty string, only a real class name or the
# field's total absence are valid): this file used to also define its own
# Ingress for depot.libre365.example.org, but Caddy (../manifests/caddy.yaml,
# ../manifests/dev/caddy.yaml) already routes that exact hostname to this
# Service - Caddy is the sole public entry point for every component in
# this repo (see e.g. novu.yaml's own header for the same rationale). That
# Ingress was a genuine duplicate of Caddy's own route, not a
# harder-to-notice version of the same bug - removed entirely rather than
# just fixing the invalid field.
apiVersion: v1
kind: Service
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  selector:
    app.kubernetes.io/name: gokapi
  ports:
    - port: 80
      targetPort: 53842
