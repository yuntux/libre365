# Component: Gokapi — large file sharing with E2EE (study 1.8 L.311-312)
# No known official Helm chart for Gokapi (Forceu/Gokapi): raw manifest
# Deployment + Service + PVC, derived from the official `f0rc3/gokapi` image.
#
# 1.8 L.311-312 — two mandatory conditions at deployment time:
#   1. Explicitly enable encryption level 3 (E2EE) — this is NOT Gokapi's default
#      behavior.
#   2. DO NOT ENABLE the "File Request" feature (upload by an external third party
#      with no account): it bypasses E2EE even if level 3 is otherwise active (1.8
#      L.304, L.312).
# Native OIDC toward Keycloak (1.8 L.303, L.306) — MANDATORY to use Gokapi's
# up-to-date Keycloak documentation at deployment time (a previous configuration
# example allowed unauthorized access, see 1.8 L.306).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gokapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gokapi
    spec:
      containers:
        - name: gokapi
          image: f0rc3/gokapi:v1.9.6
          ports:
            - containerPort: 53842
          env:
            # 1.8 L.302 — encryption level 3 = true E2EE, to be enabled
            # EXPLICITLY (not the default).
            - name: GOKAPI_ENCRYPTION_LEVEL
              value: "3"
            # 1.8 L.304 — File Request deliberately disabled: do not set
            # GOKAPI_FILE_REQUEST_ENABLED=true here.
            - name: GOKAPI_FILE_REQUEST_ENABLED
              value: "false"
            # 1.7/1.8 L.303 — Native OIDC toward Keycloak
            - name: GOKAPI_OAUTH_PROVIDER
              value: "keycloak"
            - name: GOKAPI_OAUTH_ISSUER_URL
              value: "https://sso.libre365.example.org/realms/libre365"
            - name: GOKAPI_OAUTH_CLIENT_ID
              value: "gokapi"
            - name: GOKAPI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gokapi-oidc-secret
                  key: client-secret
            - name: GOKAPI_PUBLIC_URL
              value: "https://depot.libre365.example.org"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: gokapi-data
              mountPath: /app/data
            - name: gokapi-custom
              mountPath: /app/custom
      volumes:
        - name: gokapi-data
          persistentVolumeClaim:
            claimName: gokapi-data
        - name: gokapi-custom
          configMap:
            name: gokapi-custom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gokapi-custom
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
data:
  # Gokapi's own documented customization mechanism (docs/advanced.rst,
  # "Customization"): any file dropped in a `custom` folder mounted at
  # /app/custom/ is served at /custom/ and, for this one specific filename,
  # applied automatically - "create a file in the folder named custom.css.
  # The CSS will be applied to all pages." Not a guessed env var: verified
  # against Gokapi's own docs before writing this.
  custom.css: |
    /* Tasmane graphic-charter tokens - see infra/k8s/manifests/caddy-injection.yaml's
       banner.css for the full rationale (same source: the firm's own Brand
       Guidelines). Kept in sync by hand today - if this ever needs to be
       generated from a single place instead of copy-pasted in two
       ConfigMaps, that's a scripts/sync_platform.py job, not a runtime one. */
    :root {
      --libre365-brand-primary: #2B3B58;   /* Madison */
      --libre365-brand-secondary: #F55364; /* Ripe Malinka */
      --libre365-brand-accent: #FF6900;    /* Burtuqali Orange */
      --libre365-brand-surface: #EEEEEE;   /* Off White */
      --libre365-brand-text: #0C141A;      /* Midnight Edition */
      --libre365-brand-on-primary: #FFFFFF;
    }

    body {
      font-family: "Aileron", system-ui, -apple-system, sans-serif;
      background: var(--libre365-brand-surface);
      color: var(--libre365-brand-text);
    }

    /* Gokapi's own template class names are NOT verified against the
       installed v1.9.6 release from this sandbox (no live instance to
       inspect) - .btn-primary/.navbar are Bootstrap's own well-known
       default classes, which Gokapi's UI is built on, so this is a
       reasonable starting point, not a guess made up from nothing; still,
       confirm against the real rendered markup on first deploy and adjust
       selectors if Gokapi's templates don't use them as expected. */
    .navbar, .bg-primary {
      background-color: var(--libre365-brand-primary) !important;
      color: var(--libre365-brand-on-primary) !important;
    }

    .btn-primary {
      background-color: var(--libre365-brand-primary) !important;
      border-color: var(--libre365-brand-primary) !important;
    }

    .btn-primary:hover {
      background-color: var(--libre365-brand-secondary) !important;
      border-color: var(--libre365-brand-secondary) !important;
    }

    a {
      color: var(--libre365-brand-primary);
    }

    a:hover {
      color: var(--libre365-brand-secondary);
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokapi-data
  namespace: libre365
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  selector:
    app.kubernetes.io/name: gokapi
  ports:
    - port: 80
      targetPort: 53842
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gokapi
  namespace: libre365
spec:
  ingressClassName: ""
  tls:
    - hosts:
        - depot.libre365.example.org
      secretName: gokapi-tls
  rules:
    - host: depot.libre365.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gokapi
                port:
                  number: 80
