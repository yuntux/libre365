# Component: Gokapi — large file sharing with E2EE (study 1.8 L.311-312)
# No known official Helm chart for Gokapi (Forceu/Gokapi): raw manifest
# Deployment + Service + PVC, derived from the official `f0rc3/gokapi` image.
#
# 1.8 L.311-312 — two mandatory conditions at deployment time:
#   1. Explicitly enable encryption level 3 (E2EE) — this is NOT Gokapi's default
#      behavior.
#   2. DO NOT ENABLE the "File Request" feature (upload by an external third party
#      with no account): it bypasses E2EE even if level 3 is otherwise active (1.8
#      L.304, L.312).
# Native OIDC toward Keycloak (1.8 L.303, L.306) — MANDATORY to use Gokapi's
# up-to-date Keycloak documentation at deployment time (a previous configuration
# example allowed unauthorized access, see 1.8 L.306).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gokapi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gokapi
    spec:
      containers:
        - name: gokapi
          image: f0rc3/gokapi:v1.9.6
          ports:
            - containerPort: 53842
          env:
            # 1.8 L.302 — encryption level 3 = true E2EE, to be enabled
            # EXPLICITLY (not the default).
            - name: GOKAPI_ENCRYPTION_LEVEL
              value: "3"
            # 1.8 L.304 — File Request deliberately disabled: do not set
            # GOKAPI_FILE_REQUEST_ENABLED=true here.
            - name: GOKAPI_FILE_REQUEST_ENABLED
              value: "false"
            # 1.7/1.8 L.303 — Native OIDC toward Keycloak
            - name: GOKAPI_OAUTH_PROVIDER
              value: "keycloak"
            - name: GOKAPI_OAUTH_ISSUER_URL
              value: "https://sso.libre365.example.org/realms/libre365"
            - name: GOKAPI_OAUTH_CLIENT_ID
              value: "gokapi"
            - name: GOKAPI_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gokapi-oidc-secret
                  key: client-secret
            - name: GOKAPI_PUBLIC_URL
              value: "https://depot.libre365.example.org"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: gokapi-data
              mountPath: /app/data
      volumes:
        - name: gokapi-data
          persistentVolumeClaim:
            claimName: gokapi-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokapi-data
  namespace: libre365
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gokapi
  namespace: libre365
  labels:
    app.kubernetes.io/name: gokapi
spec:
  selector:
    app.kubernetes.io/name: gokapi
  ports:
    - port: 80
      targetPort: 53842
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gokapi
  namespace: libre365
spec:
  ingressClassName: ""
  tls:
    - hosts:
        - depot.libre365.example.org
      secretName: gokapi-tls
  rules:
    - host: depot.libre365.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gokapi
                port:
                  number: 80
