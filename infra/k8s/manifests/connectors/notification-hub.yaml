# Component: notification-hub — in-house connector, unified notification center
# (study, chapter 2.1 and 2.7). No Helm chart: this is a small in-house
# Python/FastAPI service (connectors/notification-hub), built locally by k3d's
# dev workflow rather than published to a registry — raw Deployment + Service,
# following the same style as infra/k8s/manifests/gokapi.yaml.
#
# Image built locally (`k3d image import`) and never pulled from a registry —
# see dev-cluster/README.md for the build/import step run before `kubectl apply`.
# replicas: 1 — dev tier only, fast iteration over availability ("durcir en
# dev pour aller plus vite").

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-hub
  namespace: libre365
  labels:
    app.kubernetes.io/name: notification-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-hub
    spec:
      containers:
        - name: notification-hub
          image: libre365/notification-hub:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            # Novu is a Helm release in this namespace (infra/k8s/helm-values/
            # novu.yaml + dev/novu.yaml) — in-cluster Service DNS name.
            # "novu-api" assumes the chart's common <release>-<subchart>
            # naming for its api component (unverified against a live
            # template in this sandbox — see dev-cluster/lib-expose.sh).
            # Port 3000 matches Novu's documented self-hosted API default.
            - name: NOVU_API_URL
              value: "http://novu-api.libre365.svc.cluster.local:3000"
            # Synapse is a Helm release in this namespace — in-cluster Service
            # DNS name, same as used by infra/k8s/manifests/caddy.yaml.
            - name: SYNAPSE_URL
              value: "http://synapse.libre365.svc.cluster.local:8008"
            # GENERATED by scripts/sync_platform.py from platform.yaml's
            # `services.keycloak` (study 2.3, the banner's notification
            # bell) - do not hand-edit, change platform.yaml instead.
            - name: KEYCLOAK_ISSUER
              value: "https://sso.libre365.example.org/realms/libre365"
            # Novu's own API secret key - already used to trigger
            # notifications (app/novu_client.py's Authorization: ApiKey
            # header) but a review pass found it was declared there and
            # never actually wired here, so NOVU_API_KEY was always empty
            # in practice. Reused as-is for the widget-session HMAC (study
            # 2.1/2.3, see app/main.py's `/widget/session`) - the same
            # server-side secret, never sent to the browser.
            - name: NOVU_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novu-api-key
                  key: api-key
            # Novu's own "application identifier" (public, not a secret) -
            # a value generated by Novu itself once the self-hosted
            # instance/organization is first set up through its own admin
            # UI - cannot be known ahead of time from this repository, must
            # be filled in at deployment time (see
            # infra/k8s/manifests/external-secrets.yaml's own comment on
            # this same gap for the parallel case).
            - name: NOVU_APP_ID
              value: "" # [TO CONFIRM AT DEPLOYMENT]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-hub
  namespace: libre365
  labels:
    app.kubernetes.io/name: notification-hub
spec:
  selector:
    app.kubernetes.io/name: notification-hub
  ports:
    - port: 4001
      targetPort: 4001
