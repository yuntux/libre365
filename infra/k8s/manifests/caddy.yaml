# Brique : Caddy — reverse proxy transverse + portail applicatif (etude 2.3 L.407-417)
# Pas de chart Helm dedie retenu : manifest raw Deployment + ConfigMap, car l'image
# Caddy doit etre construite avec le plugin `caddy2-html-injection-plugin` (xcaddy),
# ce qui sort du perimetre d'un chart generique.
#
# 2.3 L.408-417 — injection HTML cote reverse proxy retenue (et non un portail iframe,
# ecarte pour raisons de securite : clickjacking, cookies tiers, degradation API
# navigateur). Le bandeau applicatif transverse (menu, cloche notifications, recherche,
# cf. caddy-injection.yaml) est injecte a la volee dans le HTML de chaque application,
# qui reste par ailleurs en navigation plein ecran native — pas de contenu applicatif
# embarque en iframe (exception ciblee : widget video Visio dans une room Matrix,
# cf. 2.4, gere par Element/Matrix lui-meme, pas par Caddy).
#
# Image a construire avec xcaddy :
#   xcaddy build --with github.com/lolPants/caddy2-html-injection-plugin
# (nom de module a verifier/ajuster selon le plugin communautaire retenu au moment du
# build — plusieurs plugins d'injection HTML existent pour Caddy 2, cf. etude L.408).

apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-caddyfile
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
data:
  Caddyfile: |
    {
        # Build avec le module d'injection HTML (xcaddy), cf. commentaire d'en-tete.
        order html_inject before respond
    }

    # Portail d'onboarding statique (2.5 L.454-457) — hors injection, page autonome
    onboarding.libre365.example.org {
        root * /srv/onboarding
        file_server
    }

    # 2.3 L.417 — chaque application reste en navigation plein ecran native ; le bandeau
    # transverse est injecte via le plugin d'injection HTML avant </body>, point
    # d'ancrage DOM fragile aux montees de version (2.3 L.413) a revalider a chaque MAJ.
    chat.libre365.example.org {
        reverse_proxy element-web.libre365.svc.cluster.local:80
        html_inject {
            selector "</body>"
            file /etc/caddy/snippets/banner.html
            position before
        }
    }

    files.libre365.example.org {
        reverse_proxy seafile.libre365.svc.cluster.local:80
        html_inject {
            selector "</body>"
            file /etc/caddy/snippets/banner.html
            position before
        }
    }

    taches.libre365.example.org {
        reverse_proxy vikunja.libre365.svc.cluster.local:80
        html_inject {
            selector "</body>"
            file /etc/caddy/snippets/banner.html
            position before
        }
    }

    videos.libre365.example.org {
        reverse_proxy peertube.libre365.svc.cluster.local:9000
        html_inject {
            selector "</body>"
            file /etc/caddy/snippets/banner.html
            position before
        }
    }

    depot.libre365.example.org {
        reverse_proxy gokapi.libre365.svc.cluster.local:80
        # Pas d'injection sur Gokapi : usage potentiel par des tiers externes
        # non authentifies (liens de telechargement), bandeau interne non pertinent ici.
    }

    # Visio, Element Call, OnlyOffice, Keycloak, MinIO console : reverse-proxy direct,
    # sans injection (applications embarquees en widget/iframe cible, cf. 2.3 L.414, ou
    # non concernees par le bandeau transverse).
    visio.libre365.example.org {
        reverse_proxy visio-meet-frontend.libre365.svc.cluster.local:80
    }

    call.libre365.example.org {
        reverse_proxy element-call.libre365.svc.cluster.local:80
    }

    office.libre365.example.org {
        reverse_proxy onlyoffice.libre365.svc.cluster.local:80
    }

    sso.libre365.example.org {
        reverse_proxy keycloak.libre365.svc.cluster.local:80
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      containers:
        - name: caddy
          # Image custom construite via xcaddy avec le plugin d'injection HTML — a
          # publier dans le registre du cabinet, cf. commentaire d'en-tete.
          image: registry.libre365.example.org/libre365/caddy-injection:latest
          ports:
            - containerPort: 80
            - containerPort: 443
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: banner-snippet
              mountPath: /etc/caddy/snippets/banner.html
              subPath: banner.html
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-caddyfile
        - name: banner-snippet
          configMap:
            name: caddy-html-banner
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: libre365
spec:
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
  type: LoadBalancer
