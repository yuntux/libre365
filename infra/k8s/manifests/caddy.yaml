# Component: Caddy — cross-cutting reverse proxy + application portal (study 2.3 L.407-417)
# No dedicated Helm chart adopted: raw Deployment + ConfigMap manifest, because the
# Caddy image must be built with the `toowoxx/caddy2-html-injection-plugin` plugin
# (xcaddy), which is outside the scope of a generic chart.
#
# 2.3 L.408-417 — HTML injection on the reverse proxy side chosen (rather than an
# iframe portal, ruled out for security reasons: clickjacking, third-party cookies,
# degraded browser API support). The cross-cutting application top bar (menu,
# notification bell, search, see caddy-injection.yaml) is injected on the fly into
# each application's HTML, which otherwise stays in native full-screen navigation —
# no application content embedded as an iframe (targeted exception: the Visio video
# widget in a Matrix room, see 2.4, handled by Element/Matrix itself, not by Caddy).
#
# Image to build with xcaddy:
#   xcaddy build --with github.com/toowoxx/caddy2-html-injection-plugin
# (registers the `injection` directive used below - content_type is optional,
# any response is eligible when omitted).
#
# Caddy is the SOLE public HTTP(S) entry point for every service in
# platform.yaml's `domains` list (this Caddyfile now covers all of them,
# Synapse/SeaweedFS/Novu included — see the bottom of this file). This is a
# deliberate simplification: every Helm chart in infra/k8s/helm-values/ also
# ships its own native Kubernetes `ingress:` block, but no
# Ingress Controller (nginx-ingress, Traefik...) is deployed anywhere in
# this repository to satisfy those objects, and cert-manager is unnecessary
# here — Caddy obtains and renews TLS certificates automatically for any
# bare-domain site address (no `http://` prefix, no `tls off`), a built-in
# feature ("Automatic HTTPS"), not something bolted on separately. Those
# per-chart `ingress:` blocks are therefore explicitly disabled
# (`enabled: false`) in every values file — see each file's own comment.
# Re-enabling one instead of routing through Caddy would need a real
# Ingress Controller deployed first (not currently in scope).

apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-caddyfile
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
data:
  Caddyfile: |
    {
        # Built with the HTML injection module (xcaddy), see the header comment.
        order injection after encode
    }

    # Serves banner.css/banner.js (caddy-html-banner ConfigMap,
    # infra/k8s/manifests/caddy-injection.yaml) at /libre365-banner/* on
    # every site the injected banner appears on - imported into each of
    # those site blocks below, matched before the reverse_proxy handling
    # everything else on that same hostname.
    (banner_assets) {
        handle_path /libre365-banner/* {
            root * /srv/banner-assets
            file_server
        }
    }

    # Static onboarding portal (2.5 L.454-457) — no injection, standalone page
    onboarding.libre365.example.org {
        root * /srv/onboarding
        file_server
    }

    # Mozilla autoconfig for Thunderbird (study 1.9) — static XML, no
    # injection. Served at the fixed path Thunderbird's account wizard
    # checks (http(s)://autoconfig.<domain>/mail/config-v1.1.xml); content
    # comes from the caddy-autoconfig ConfigMap below, mounted at
    # /srv/autoconfig/mail so the file lands at
    # /srv/autoconfig/mail/config-v1.1.xml. See docs/clients.md.
    autoconfig.libre365.example.org {
        root * /srv/autoconfig
        file_server
    }

    # 2.3 L.417 — each application stays in native full-screen navigation; the
    # cross-cutting top bar is injected via the HTML injection plugin before
    # </body>, a DOM anchor point fragile to version upgrades (2.3 L.413) to be
    # revalidated on every update.
    chat.libre365.example.org {
        import banner_assets
        handle {
            reverse_proxy element-web.libre365.svc.cluster.local:80
            injection {
                inject /etc/caddy/snippets/banner.html
                before "</body>"
            }
        }
    }

    files.libre365.example.org {
        import banner_assets
        handle {
            reverse_proxy seafile.libre365.svc.cluster.local:80
            injection {
                inject /etc/caddy/snippets/banner.html
                before "</body>"
            }
        }
    }

    taches.libre365.example.org {
        import banner_assets
        handle {
            reverse_proxy vikunja.libre365.svc.cluster.local:80
            injection {
                inject /etc/caddy/snippets/banner.html
                before "</body>"
            }
        }
    }

    videos.libre365.example.org {
        import banner_assets
        handle {
            reverse_proxy peertube.libre365.svc.cluster.local:9000
            injection {
                inject /etc/caddy/snippets/banner.html
                before "</body>"
            }
        }
    }

    depot.libre365.example.org {
        # Colors-only injection (Tasmane branding, study 1.8) - deliberately
        # NOT the cross-app menu/search/notifications banner (banner.html):
        # Gokapi is reachable by unauthenticated external third parties
        # following a download link, who must never see the internal
        # portal bar. See caddy-injection.yaml's gokapi-branding.html for
        # why this replaced an earlier attempt at a Gokapi-side custom.css
        # file (Gokapi has no such mechanism in the pinned v1.9.6).
        reverse_proxy gokapi.libre365.svc.cluster.local:80
        injection {
            inject /etc/caddy/snippets/gokapi-branding.html
            before "</body>"
        }
    }

    # Visio, Element Call, OnlyOffice, Keycloak, SeaweedFS Admin UI: direct reverse proxy,
    # no injection (applications embedded as a targeted widget/iframe, see 2.3 L.414,
    # or not concerned by the cross-cutting top bar).
    visio.libre365.example.org {
        reverse_proxy visio-meet-frontend.libre365.svc.cluster.local:80
    }

    call.libre365.example.org {
        reverse_proxy element-call.libre365.svc.cluster.local:80
    }

    # study 1.7/docs/oidc.md — OnlyOffice Document Server has no login
    # screen of its own (its JWT only signs individual document-open
    # requests from Seafile), so a Keycloak SSO gate is added here instead:
    # /oauth2/* is routed to oauth2-proxy itself (login start + callback),
    # everything else goes through forward_auth first (redirects an
    # unauthenticated browser to Keycloak) before ever reaching Document
    # Server. "oauth2-proxy-onlyoffice" assumes that Helm release name for
    # infra/k8s/helm-values/oauth2-proxy-onlyoffice.yaml (unverified against
    # an actual `helm install` from this sandboxed environment, same
    # category of assumption already documented for "novu-api" below).
    office.libre365.example.org {
        route /oauth2/* {
            reverse_proxy oauth2-proxy-onlyoffice.libre365.svc.cluster.local:4180
        }
        route {
            forward_auth oauth2-proxy-onlyoffice.libre365.svc.cluster.local:4180 {
                uri /oauth2/auth
                copy_headers X-Auth-Request-User X-Auth-Request-Email
            }
            reverse_proxy onlyoffice.libre365.svc.cluster.local:80
        }
    }

    sso.libre365.example.org {
        # Keycloak Operator's auto-created Service (see
        # ../manifests/keycloak.yaml's own comment) - "keycloak-service" on
        # port 8080, not "keycloak" on port 80 the way the retired Bitnami
        # chart's Service was named.
        reverse_proxy keycloak-service.libre365.svc.cluster.local:8080
    }

    # Matrix client API (study 1.2) — same domain as the chart's own
    # `matrix.serverName` (see synapse.yaml), so federation traffic from
    # other homeservers reaches this same hostname by default (Matrix
    # servers try `https://<server_name>:8448/` directly when no
    # `.well-known/matrix/server` delegation is published — none is here,
    # so no well-known handling is added on this :443 block).
    matrix.libre365.example.org {
        reverse_proxy synapse.libre365.svc.cluster.local:8008
    }

    # Matrix federation (server-to-server, study 1.2) — separate site
    # address (same hostname, port 8448): Caddy's automatic HTTPS applies
    # per site address regardless of port, so this gets its own certificate
    # exactly like the :443 block above. Requires containerPort 8448 to
    # also be exposed on this Deployment/Service (see below).
    matrix.libre365.example.org:8448 {
        reverse_proxy synapse.libre365.svc.cluster.local:8448
    }

    # SeaweedFS S3 API (study 2.12) — no injection (API traffic, not a
    # browsed application). Release name "seaweedfs" (chart name
    # "seaweedfs" too, so the chart's fullname template collapses to just
    # the release name - verified in seaweedfs/seaweedfs's
    # templates/shared/_helpers.tpl) -> Service "seaweedfs-s3".
    s3.libre365.example.org {
        reverse_proxy seaweedfs-s3.libre365.svc.cluster.local:8333
    }

    # SeaweedFS Admin UI (study 2.12) — no injection (administration UI,
    # not part of the cross-cutting application bar's audience).
    seaweedfs-admin.libre365.example.org {
        reverse_proxy seaweedfs-admin.libre365.example.org:23646
    }

    # Novu notification center (study 2.1) — no injection (consumed by the
    # in-house connectors and Novu's own UI, not embedded in the portal bar).
    # "novu-api" IS verified (not guessed) against the real chart actually
    # used - Nova-Edge/novu-chart, a community chart, since no official
    # Novu chart exists at all (see infra/k8s/helm-values/novu.yaml's own
    # header for the full story): its templates/_helpers.tpl defines
    # `novu.api.fullname` as `<release>-api`, confirmed to produce exactly
    # "novu-api" with the release name used here - same verification
    # already documented for the k3d dev cluster in
    # dev-cluster/lib-expose.sh.
    notifications.libre365.example.org {
        reverse_proxy novu-api.libre365.svc.cluster.local:3000
    }

    # Novu's `web` ADMIN dashboard (template/workflow management) — a
    # separate surface from the API above, gated by Keycloak SSO via
    # oauth2-proxy (same pattern as the office.libre365.example.org block,
    # see docs/oidc.md). "novu-web" is verified the same way as "novu-api"
    # above (`novu.web.fullname` -> `<release>-web`); "oauth2-proxy-novu" is
    # this repo's own Helm release name (helm upgrade --install
    # oauth2-proxy-novu ..., see dev-cluster/deploy.sh), not a chart-side
    # naming assumption at all.
    notifications-admin.libre365.example.org {
        route /oauth2/* {
            reverse_proxy oauth2-proxy-novu.libre365.svc.cluster.local:4180
        }
        route {
            forward_auth oauth2-proxy-novu.libre365.svc.cluster.local:4180 {
                uri /oauth2/auth
                copy_headers X-Auth-Request-User X-Auth-Request-Email
            }
            reverse_proxy novu-web.libre365.svc.cluster.local:4200
        }
    }

    # App-portal banner's backend (study 2.3) — banner.js (injected into
    # chat/files/taches/videos below) calls this domain directly from the
    # browser for the search box, notification bell and presence dot; none
    # of unified-search/notification-hub/presence-aggregator had a public
    # route before (they were internal/webhook-driven only). Each endpoint
    # verifies the caller's Keycloak-issued access token itself (JWKS,
    # RS256) - this site block does no auth of its own, only CORS + routing.
    # Only the specific paths banner.js actually calls are exposed -
    # notification-hub's /webhooks/* receivers are deliberately NOT
    # forwarded here.
    api.libre365.example.org {
        @allowed_origin header Origin "https://chat.libre365.example.org" "https://files.libre365.example.org" "https://taches.libre365.example.org" "https://videos.libre365.example.org"
        header @allowed_origin {
            Access-Control-Allow-Origin "{http.request.header.Origin}"
            Access-Control-Allow-Methods "GET, OPTIONS"
            Access-Control-Allow-Headers "Authorization, Content-Type"
            Vary "Origin"
        }
        @options method OPTIONS
        respond @options 204

        route /search* {
            reverse_proxy unified-search.libre365.svc.cluster.local:4002
        }
        route /portal/* {
            reverse_proxy unified-search.libre365.svc.cluster.local:4002
        }
        route /widget/session {
            reverse_proxy notification-hub.libre365.svc.cluster.local:4001
        }
        route /presence/* {
            reverse_proxy presence-aggregator.libre365.svc.cluster.local:4003
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-autoconfig
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
data:
  # Mozilla autoconfig for Thunderbird (study 1.9) — served by the
  # autoconfig.libre365.example.org Caddyfile site block above, mounted at
  # /srv/autoconfig/mail so this key lands at
  # /srv/autoconfig/mail/config-v1.1.xml (the fixed path Thunderbird's
  # account wizard requests). See docs/clients.md for the full rationale
  # and the "exchange" vs. "imap"/"smtp" server blocks below.
  config-v1.1.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <clientConfig version="1.1">
      <emailProvider id="libre365.example.org">
        <domain>libre365.example.org</domain>
        <displayName>libre365</displayName>
        <displayShortName>libre365</displayShortName>

        <!-- Primary path (study 1.9 L.325/350): native EWS account, since
             Grommunio emulates Exchange Web Services and Thunderbird has
             supported native Exchange/EWS accounts since 91. When
             Thunderbird's account wizard can use this block, no separate
             Microsoft Autodiscover round-trip is needed. -->
        <incomingServer type="exchange">
          <hostname>mail.libre365.example.org</hostname>
          <ewsURL>https://mail.libre365.example.org/EWS/Exchange.asmx</ewsURL>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </incomingServer>

        <!-- Fallback (study 1.9's own documented alternative): plain
             IMAP/SMTP, for a Thunderbird build or a client that doesn't
             use the exchange block above. -->
        <incomingServer type="imap">
          <hostname>mail.libre365.example.org</hostname>
          <port>993</port>
          <socketType>SSL</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </incomingServer>

        <outgoingServer type="smtp">
          <hostname>mail.libre365.example.org</hostname>
          <port>587</port>
          <socketType>STARTTLS</socketType>
          <username>%EMAILADDRESS%</username>
          <authentication>password-cleartext</authentication>
        </outgoingServer>
      </emailProvider>
    </clientConfig>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      containers:
        - name: caddy
          # Custom image built via xcaddy with the HTML injection plugin — to be
          # published to the firm's registry, see the header comment.
          image: registry.libre365.example.org/libre365/caddy-injection:latest
          ports:
            - containerPort: 80
            - containerPort: 443
            # Matrix federation (study 1.2) - see the
            # matrix.libre365.example.org:8448 Caddyfile block above.
            - containerPort: 8448
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: banner-snippet
              mountPath: /etc/caddy/snippets/banner.html
              subPath: banner.html
            - name: gokapi-branding-snippet
              mountPath: /etc/caddy/snippets/gokapi-branding.html
              subPath: gokapi-branding.html
            - name: autoconfig
              mountPath: /srv/autoconfig/mail
            - name: banner-assets
              mountPath: /srv/banner-assets
            - name: onboarding
              mountPath: /srv/onboarding
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-caddyfile
        - name: banner-snippet
          configMap:
            name: caddy-html-banner
        - name: gokapi-branding-snippet
          configMap:
            name: caddy-html-banner
            items:
              - key: gokapi-branding.html
                path: gokapi-branding.html
        - name: autoconfig
          configMap:
            name: caddy-autoconfig
        - name: banner-assets
          # Same ConfigMap as banner-snippet above, restricted to the two
          # keys served as static files (banner.html stays mounted
          # separately, as a single file consumed by the injection
          # directive, not file_server).
          configMap:
            name: caddy-html-banner
            items:
              - key: banner.css
                path: banner.css
              - key: banner.js
                path: banner.js
              - key: sso-silent-callback.html
                path: sso-silent-callback.html
        - name: onboarding
          # Study 2.5 - generated by scripts/sync_platform.py, see
          # infra/k8s/manifests/onboarding.yaml (the onboarding.<domain>
          # Caddyfile site block at the top of this file already points
          # `root` at this same path).
          configMap:
            name: onboarding-page
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
  namespace: libre365
  annotations:
    # Consumed by external-dns (../helm-values/external-dns.yaml, `sources:
    # [service]`) to create/maintain the A/AAAA records for every hostname
    # this Service actually fronts - the DNS-zone-population half of what
    # Caddy's own Automatic HTTPS does NOT do (it only obtains/renews
    # certificates once a domain already resolves here). Kept as a hand-
    # maintained list matching the Caddyfile's site addresses above (add a
    # hostname here whenever a new one is added there) - each domain
    # literal is still patched by scripts/sync_platform.py like every other
    # occurrence in this file, since this is plain text within a file
    # already in DOMAIN_TARGET_FILES.
    # Single line, no spaces after the commas: external-dns splits this
    # value on "," without necessarily trimming whitespace, so a folded
    # multi-line scalar here would risk a leading-space-prefixed hostname.
    external-dns.alpha.kubernetes.io/hostname: "onboarding.libre365.example.org,autoconfig.libre365.example.org,chat.libre365.example.org,files.libre365.example.org,taches.libre365.example.org,videos.libre365.example.org,depot.libre365.example.org,visio.libre365.example.org,call.libre365.example.org,office.libre365.example.org,sso.libre365.example.org,matrix.libre365.example.org,s3.libre365.example.org,seaweedfs-admin.libre365.example.org,notifications.libre365.example.org,notifications-admin.libre365.example.org,api.libre365.example.org"
spec:
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: matrix-federation
      port: 8448
      targetPort: 8448
  type: LoadBalancer
