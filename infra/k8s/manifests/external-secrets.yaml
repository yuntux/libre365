# --- [UNCERTAIN] ----------------------------------------------------------

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-mysql-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-mysql-secret
  data:
    # [CORRECTED] the previous single "password" key was a guess (flagged
    # as such in this same comment); confirmed by actually running
    # dev-cluster/deploy.sh: the real chart (haiwen/seafile-helm-chart's
    # `ce`, github.com/haiwen/seafile-helm-chart, template/13.0/ce) has NO
    # bundled MySQL/MariaDB subchart at all - it only ever talks to an
    # externally-provisioned MySQL via SEAFILE_MYSQL_DB_HOST (see
    # ../helm-values/seafile.yaml). That external MySQL is provisioned
    # here as its own `seafile-mysql` bitnami/mysql release (see
    # dev-cluster/deploy.sh), whose `auth.existingSecret` requires exactly
    # these 3 key names (bitnami/mysql chart's own documented convention).
    # The same root/app-user passwords are duplicated (not just
    # cross-referenced) into `seafile-secret` below, under the different
    # key names Seafile's own container entrypoint expects
    # (SEAFILE_MYSQL_DB_PASSWORD / INIT_SEAFILE_MYSQL_ROOT_PASSWORD) - both
    # sides MUST resolve to the same OpenBao property to actually work.
    - secretKey: mysql-root-password
      remoteRef:
        key: libre365/seafile-mysql
        property: root-password
    - secretKey: mysql-password
      remoteRef:
        key: libre365/seafile-mysql
        property: password
    - secretKey: mysql-replication-password
      remoteRef:
        key: libre365/seafile-mysql
        property: replication-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seafile-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-secret
    # REDIS_PASSWORD isn't sourced from OpenBao: it's a static empty value
    # (this deployment uses memcached, not redis - see
    # ../helm-values/seafile.yaml's CACHE_PROVIDER), but the seafile-mc
    # container's own entrypoint script still expects the env var to
    # exist (haiwen/seafile-helm-chart's own README documents creating it
    # empty for the `ce` edition too).
    template:
      data:
        REDIS_PASSWORD: ""
  data:
    # Every key here is injected as-is into the seafile container via
    # `envFrom.secretRef` (this chart's own `seafile.existingSecret` -
    # see ../helm-values/seafile.yaml), so key names are literal env var
    # names, not an arbitrary convention - confirmed against
    # github.com/haiwen/seafile-helm-chart's own README (the
    # `kubectl create secret generic seafile-secret` example for the `ce`
    # edition) after actually running dev-cluster/deploy.sh.
    - secretKey: JWT_PRIVATE_KEY
      remoteRef:
        key: libre365/seafile
        property: jwt-private-key
    - secretKey: INIT_SEAFILE_ADMIN_PASSWORD
      remoteRef:
        key: libre365/seafile
        property: admin-password
    # Must resolve to the exact same OpenBao properties as
    # seafile-mysql-secret's mysql-password/mysql-root-password above -
    # this is the same MySQL server, seen from the application side
    # instead of the bitnami/mysql release's own existingSecret.
    - secretKey: SEAFILE_MYSQL_DB_PASSWORD
      remoteRef:
        key: libre365/seafile-mysql
        property: password
    - secretKey: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
      remoteRef:
        key: libre365/seafile-mysql
        property: root-password
    # Same underlying JWT secret as onlyoffice-jwt-secret's own "secret"
    # key (shared by onlyoffice.yaml, which reads it under that different
    # key name) - duplicated here under the literal env var name Seafile's
    # OnlyOffice integration expects, since this chart's envFrom-only
    # extraEnv/existingSecret mechanism can't rename a key on the fly.
    - secretKey: ONLYOFFICE_JWT_SECRET
      remoteRef:
        key: libre365/onlyoffice
        property: jwt-secret
