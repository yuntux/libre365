# --- [CONVENTION] (Bitnami / official chart defaults) --------------------

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
  data:
    # Keys "username"/"password" (Keycloak Operator's `bootstrapAdmin.user.
    # secret` convention - see infra/k8s/manifests/keycloak.yaml - not the
    # retired Bitnami chart's single "admin-password" key).
    - secretKey: username
      remoteRef:
        key: libre365/keycloak
        property: admin-username
    - secretKey: password
      remoteRef:
        key: libre365/keycloak
        property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-postgres-secret
  data:
    # "password"/"postgres-password": bitnami/postgresql chart's
    # existingSecret convention (non-admin app user / superuser). "username"
    # is NOT read by that chart (it takes `auth.username` as a plain value,
    # see infra/k8s/helm-values/keycloak-postgres.yaml) - added only
    # because the Keycloak Operator's `db.usernameSecret` needs the DB
    # username sourced from a secret key too (see
    # infra/k8s/manifests/keycloak.yaml), pointing at this same Secret.
    - secretKey: username
      remoteRef:
        key: libre365/keycloak-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: libre365/keycloak-postgres
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: libre365/keycloak-postgres
        property: postgres-password
