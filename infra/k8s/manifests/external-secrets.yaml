apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: onlyoffice-oidc-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: onlyoffice-oidc-secret
  data:
    # oauth2-proxy-onlyoffice.yaml: config.existingSecret, official chart
    # convention for all three of these keys together in one Secret -
    # gates OnlyOffice via a forward_auth proxy since Document Server has
    # no native OIDC login of its own (see docs/oidc.md).
    - secretKey: client-id
      remoteRef:
        key: libre365/onlyoffice
        property: oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: libre365/onlyoffice
        property: oidc-client-secret
    - secretKey: cookie-secret
      remoteRef:
        key: libre365/onlyoffice
        property: oauth2-proxy-cookie-secret
---
