  data:
    # oauth2-proxy-novu.yaml: config.existingSecret - gates Novu's `web`
    # admin dashboard only (novu-api stays ungated, see docs/oidc.md).
    - secretKey: client-id
      remoteRef:
        key: libre365/novu
        property: oidc-client-id
    - secretKey: client-secret
      remoteRef:
        key: libre365/novu
        property: oidc-client-secret
    - secretKey: cookie-secret
