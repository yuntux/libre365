# Component: ExternalSecret resources — one per `existingSecret:`/
# `secretKeyRef:` referenced across infra/k8s/helm-values/*.yaml (study
# 4.5). Each one tells External Secrets Operator (ESO,
# ../helm-values/external-secrets.yaml) to read a value from OpenBao (via
# the `openbao` ClusterSecretStore, external-secrets-store.yaml) and keep a
# real Kubernetes Secret of that name in sync with it, instead of a human
# running `kubectl create secret` by hand.
#
# Confidence levels — read before writing a value into OpenBao at the paths
# below:
#   [DECLARED]  the secretKey name is already explicitly declared
#               elsewhere in this exact repo's own values files (e.g.
#               synapse.yaml's `secretKey: client-secret`) - zero guessing.
#   [CONVENTION] the secretKey name follows a well-established, stable
#               upstream chart/vendor convention (e.g. Bitnami's
#               "postgres-password"/"password" pair for its postgresql
#               subchart) - not independently re-verified against the
#               exact chart version pinned in platform.yaml from this
#               sandboxed environment (no network access to
#               charts.bitnami.com/charts.min.io etc.) - cross-check
#               against that chart's own README/values.schema.json before
#               relying on it in a real deployment.
#   [UNCERTAIN] a chart-specific expectation with a less standardized
#               convention behind it - flagged individually below.
#
# Grommunio's admin password is NOT here: it has no Kubernetes Secret at
# all (Proxmox VM appliance, Ansible-managed - see infra/ansible/), a
# different mechanism entirely. LiveKit's `livekit-keys` Secret
# (element-call.yaml) is also absent: LiveKit itself has no deployment
# anywhere in this repository (see infra/k8s/helm-values/README.md, "Out
# of scope") - nothing would consume it yet.

# --- [DECLARED] ---------------------------------------------------------

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: synapse-oidc-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: synapse-oidc-secret
  data:
    - secretKey: client-secret # synapse.yaml: secretKey: client-secret
      remoteRef:
        key: libre365/synapse
        property: oidc-client-secret
