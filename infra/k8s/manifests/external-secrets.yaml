# --- [UNCERTAIN] ----------------------------------------------------------

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seafile-mysql-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: seafile-mysql-secret
  data:
    # Lower confidence than the [CONVENTION] entries above: seafile-mc
    # bundles its own internal MariaDB rather than using a generic
    # community mariadb/postgresql subchart with a single well-known
    # existingSecret convention - "password" is this file's best guess,
    # not backed by the same level of established precedent. Confirm
    # against the seafile-ce chart's own values.yaml/README before relying
    # on this key name.
    - secretKey: password
      remoteRef:
        key: libre365/seafile-mysql
        property: password
