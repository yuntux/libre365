# --- [CONVENTION] (Bitnami / official chart defaults) --------------------

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-admin-secret
  data:
    - secretKey: admin-password # bitnami/keycloak auth.existingSecret convention
      remoteRef:
        key: libre365/keycloak
        property: admin-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-postgres-secret
  namespace: libre365
spec:
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: keycloak-postgres-secret
  data:
    # Bitnami postgresql subchart existingSecret convention: both the
    # non-admin app user's password AND the superuser's are expected in
    # the same Secret when a non-"postgres" database/user is configured.
    - secretKey: password
      remoteRef:
        key: libre365/keycloak-postgres
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: libre365/keycloak-postgres
        property: postgres-password
---
