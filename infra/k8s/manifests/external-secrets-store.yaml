# Component: ClusterSecretStore — wires External Secrets Operator (ESO,
# ../helm-values/external-secrets.yaml) to OpenBao
# (../helm-values/openbao.yaml), study 4.5.
#
# Auth method: Kubernetes auth (ESO's ServiceAccount token, validated by
# OpenBao's own TokenReview call to the cluster's API server) - the
# standard, credential-free way ESO authenticates to a real Vault/OpenBao
# deployment, rather than a long-lived static token
# (../manifests/dev/external-secrets-store.yaml uses the latter, but only
# because OpenBao's dev-mode server issues one fixed token by design - see
# that file's own comment for why the two differ).
#
# IMPORTANT — verify before deploying: the `path`/`auth.kubernetes.*` keys
# below follow ESO's documented `vault` provider shape, which OpenBao's API
# is designed to be compatible with (it's a Vault fork) - not independently
# verified end-to-end from this sandboxed environment (no live cluster to
# test against). Also requires OpenBao-side configuration this manifest
# alone doesn't perform: enabling the `kubernetes` auth method, and
# creating the `external-secrets` role/policy - done by
# infra/ansible/roles/openbao_config (see its own README for exactly what
# it runs and the same verification caveat).
#
# [CORRECTED] `apiVersion: external-secrets.io/v1beta1` used to fail with
# "no matches for kind ClusterSecretStore ... ensure CRDs are installed
# first" - found by actually running dev-cluster/deploy.sh:
# `external-secrets` 2.10.0 (the version `helm upgrade --install` currently
# pulls, unpinned) serves `v1` only (`served: true`), `v1beta1` is listed
# for backward-compat CRD metadata but `served: false`. Confirmed directly
# against the live CRD's `spec.versions[*].served` on a real cluster.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: libre365
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.libre365.svc.cluster.local:8200"
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: libre365
