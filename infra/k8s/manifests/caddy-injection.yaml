# 2.3 L.407-417 — Cross-cutting application top bar (menu, notification bell, search
# area) injected via reverse proxy rather than an iframe portal (ruled out for
# security reasons: clickjacking, third-party cookies, degraded browser APIs in an
# iframe).
#
# This ConfigMap only contains the injected HTML SNIPPET (the "banner"). The
# injection logic itself (plugin `caddy2-html-injection-plugin` or Caddy's
# equivalent `replace`/`sub_filter`) is configured in the Caddyfile, see
# infra/k8s/helm-values/caddy-deployment.yaml (main Caddyfile ConfigMap).
#
# The DOM anchor point (here the </body> tag) is fragile to version upgrades of
# each target application (2.3 L.413): to be revalidated on every major update of a
# component (Element Web, Seafile, Vikunja...).
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-html-banner
  namespace: libre365
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/component: portail-applicatif
data:
  banner.html: |
    <!-- libre365 cross-cutting application banner — injected before </body> -->
    <div id="libre365-banner" data-libre365-banner>
      <nav id="libre365-banner-menu">
        <!-- Links to each component: Element, Seafile, Vikunja, Visio, Grommunio-web, PeerTube -->
      </nav>
      <div id="libre365-banner-search">
        <!-- 2.2 L.398-399 — Unified search area: real-time fan-out to each service's
             native APIs (Matrix /search, Seafile, Vikunja, Grommunio IMAP),
             with the user's Keycloak token relayed on every call. -->
      </div>
      <div id="libre365-banner-notifications">
        <!-- 2.1 L.381-382 — Notification bell: Novu center, fed by the
             per-service webhook connectors. -->
      </div>
      <div id="libre365-banner-presence">
        <!-- 2.8 L.503-504 — Consolidated presence status (Matrix m.presence,
             Grommunio GetUserAvailability, LiveKit call state). -->
      </div>
    </div>
    <script src="/libre365-banner/banner.js" defer></script>
    <link rel="stylesheet" href="/libre365-banner/banner.css">
