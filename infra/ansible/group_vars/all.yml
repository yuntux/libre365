---
# Variables common to all playbooks. Real secrets (passwords, API keys)
# must be injected via Ansible Vault or an external vault (Vault/OpenBao) —
# study 4.5: "never in plaintext in the code repository".
# The values below are structural examples, not real secrets.

libre365_domain: "libre365.example.internal"

keycloak_base_url: "https://sso.{{ libre365_domain }}"
keycloak_admin_realm: "master"
keycloak_target_realm: "libre365"
# To be supplied via `--extra-vars` or a vault file, never in plaintext here:
keycloak_admin_user: "{{ vault_keycloak_admin_user | default('admin') }}"
keycloak_admin_password: "{{ vault_keycloak_admin_password | default(omit) }}"

grommunio_domain: "mail.{{ libre365_domain }}"
matrix_domain: "matrix.{{ libre365_domain }}"
seafile_domain: "files.{{ libre365_domain }}"
onlyoffice_domain: "docs.{{ libre365_domain }}"
