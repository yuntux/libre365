---
# Bootstraps OpenBao's Kubernetes auth method for External Secrets
# Operator (study 4.5) - see ../roles/openbao_config/README.md for the
# full rationale and prerequisites (OpenBao must already be initialized
# and unsealed - a manual step, deliberately not automated here).
#
# API-driven, like playbooks/keycloak-realm.yml - runs against
# control_apis (no SSH connection needed).
- name: "OpenBao Kubernetes auth method + external-secrets policy/role (study 4.5)"
  hosts: control_apis
  connection: local
  gather_facts: false
  # [ADDED] same fix as playbooks/keycloak-realm.yml's own comment: this
  # role only shells out to `kubectl`/the OpenBao API as the invoking
  # user - no local privileged action - ansible.cfg's global
  # `become = True` (meant for the real remote-host playbooks) made it
  # try to `sudo` locally for nothing.
  become: false
  vars_files:
    - ../group_vars/all.yml
  roles:
    - openbao_config
