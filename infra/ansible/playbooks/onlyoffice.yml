---
# OnlyOffice Document Server configuration — study 1.5 (component chosen,
# Community Edition >= 9.4) and 2.6 (internal chat disabled by default, in
# favor of the Matrix enterprise chat).
#
# OnlyOffice Document Server is deployed via Helm in the Kubernetes cluster
# (infra/k8s/helm-values/onlyoffice.yaml, out of scope for this task); this
# playbook carries the `document.permissions.chat` setting, applied when
# each document is opened from Seafile via the editor configuration passed
# on the Seafile<->OnlyOffice connector side (not a global server config
# file — see the note below).

- name: "Set document.permissions.chat: false by default"
  hosts: onlyoffice
  connection: local
  gather_facts: false
  vars:
    onlyoffice_namespace: "onlyoffice"
    # Study 2.6, line ~469: "document.permissions.chat: false [...] distinct
    # from document.permissions.comment (which can remain enabled)" — this
    # setting is set on the editor config side passed by the integration
    # connector (connectors/seafile-onlyoffice, out of scope for this task),
    # not in a global Document Server config file: this playbook only
    # carries the connector's default value.
    onlyoffice_default_editor_permissions:
      chat: false
      comment: true
      download: true
      edit: true
      print: true

  tasks:
    - name: "Publish the editor's default permissions as a ConfigMap consumed by the Seafile<->OnlyOffice connector"
      ansible.builtin.template:
        src: ../templates/onlyoffice-editor-defaults.json.j2
        dest: "{{ playbook_dir }}/../rendered/onlyoffice-editor-defaults.json"
        mode: "0640"

    - name: "Apply the ConfigMap to the Kubernetes cluster"
      ansible.builtin.command: >-
        kubectl create configmap onlyoffice-editor-defaults
        --namespace {{ onlyoffice_namespace }}
        --from-file=editor-defaults.json={{ playbook_dir }}/../rendered/onlyoffice-editor-defaults.json
        --dry-run=client -o yaml
      register: onlyoffice_configmap_manifest
      changed_when: false

    - name: "kubectl apply the ConfigMap"
      ansible.builtin.shell: |
        echo '{{ onlyoffice_configmap_manifest.stdout }}' | kubectl apply -f -
      changed_when: true

    - name: "Restart the Seafile<->OnlyOffice integration connector to pick up the new defaults"
      ansible.builtin.command: >-
        kubectl rollout restart deployment/seafile-onlyoffice-connector
        --namespace {{ onlyoffice_namespace }}
      changed_when: true
      ignore_errors: true # the connector may not yet be deployed depending on project progress (2.6)
