---
# Configuration OnlyOffice Document Server — étude 1.5 (brique retenue,
# Community Edition >= 9.4) et 2.6 (tchat interne désactivé par défaut, au
# profit du tchat d'entreprise Matrix).
#
# OnlyOffice Document Server est déployé par Helm dans le cluster Kubernetes
# (infra/k8s/helm-values/onlyoffice.yaml, hors périmètre de cette tâche) ; ce
# playbook porte le réglage `document.permissions.chat`, appliqué à l'ouverture
# de chaque document depuis Seafile via la configuration de l'éditeur transmise
# côté connecteur Seafile↔OnlyOffice (pas un fichier de configuration serveur
# global — cf. note ci-dessous).

- name: "Positionner document.permissions.chat: false par défaut"
  hosts: onlyoffice
  connection: local
  gather_facts: false
  vars:
    onlyoffice_namespace: "onlyoffice"
    # Étude 2.6, ligne ~469 : "document.permissions.chat: false [...] distinct
    # de document.permissions.comment (qui peut rester activé)" — ce réglage
    # est positionné côté config de l'éditeur transmise par le connecteur
    # d'intégration (connectors/seafile-onlyoffice, hors périmètre de cette
    # tâche), pas dans un fichier de config global du Document Server : ce
    # playbook ne fait que porter la valeur par défaut du connecteur.
    onlyoffice_default_editor_permissions:
      chat: false
      comment: true
      download: true
      edit: true
      print: true

  tasks:
    - name: "Publier les permissions par défaut de l'éditeur comme ConfigMap consommée par le connecteur Seafile↔OnlyOffice"
      ansible.builtin.template:
        src: ../templates/onlyoffice-editor-defaults.json.j2
        dest: "{{ playbook_dir }}/../rendered/onlyoffice-editor-defaults.json"
        mode: "0640"

    - name: "Appliquer la ConfigMap au cluster Kubernetes"
      ansible.builtin.command: >-
        kubectl create configmap onlyoffice-editor-defaults
        --namespace {{ onlyoffice_namespace }}
        --from-file=editor-defaults.json={{ playbook_dir }}/../rendered/onlyoffice-editor-defaults.json
        --dry-run=client -o yaml
      register: onlyoffice_configmap_manifest
      changed_when: false

    - name: "kubectl apply de la ConfigMap"
      ansible.builtin.shell: |
        echo '{{ onlyoffice_configmap_manifest.stdout }}' | kubectl apply -f -
      changed_when: true

    - name: "Redémarrer le connecteur d'intégration Seafile↔OnlyOffice pour prendre en compte les nouveaux défauts"
      ansible.builtin.command: >-
        kubectl rollout restart deployment/seafile-onlyoffice-connector
        --namespace {{ onlyoffice_namespace }}
      changed_when: true
      ignore_errors: true # le connecteur peut ne pas encore être déployé selon l'avancement du chantier (2.6)
