---
# Post-deployment configuration of the Grommunio appliance VM (study 1.1,
# 2.13, 4.3). The appliance itself is provisioned by Terraform
# (infra/terraform/grommunio.tf); this playbook takes over once the appliance
# is installed and reachable over SSH.

- name: "Configure the Grommunio appliance VM"
  hosts: grommunio
  become: true
  vars_files:
    - ../group_vars/all.yml
  vars:
    grommunio_dav_config_path: /etc/gromox/dav/grommunio-dav.cfg
    # GAL over CardDAV — study 2.13, line ~608-616: native feature added in
    # 2026.06.1, disabled by default, to be enabled from the initial
    # deployment so that Thunderbird/Apple Mail have the GAL like Outlook
    # over MAPI/EWS.
    grommunio_gal_enabled: true
    # Default TTL on the order of an hour: balances directory freshness
    # (consultants joining/leaving) against load on the DAV server (2.13,
    # line ~613) — 3600 seconds kept as the reference value.
    grommunio_gal_cache_ttl_seconds: 3600
    # Web admin disabled to stay under the 5-free-user threshold of the
    # Grommunio console (study 1.1, line ~53: "operated without the web
    # administration interface (CLI/API/config files) to avoid the license
    # cost beyond 5 users").
    grommunio_admin_web_enabled: false

  tasks:
    - name: "Ensure the grommunio-dav configuration directory exists"
      ansible.builtin.file:
        path: "{{ grommunio_dav_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Enable GAL over CardDAV (GAL_ENABLED, GAL_CACHE_TTL) — study 2.13"
      ansible.builtin.lineinfile:
        path: "{{ grommunio_dav_config_path }}"
        create: true
        owner: root
        group: root
        mode: "0640"
        regexp: "^{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: "GAL_ENABLED", value: "{{ grommunio_gal_enabled | lower }}" }
        - { key: "GAL_CACHE_TTL", value: "{{ grommunio_gal_cache_ttl_seconds }}" }
      notify: "Restart grommunio-dav"

    - name: "Disable the Grommunio web administration interface"
      ansible.builtin.systemd:
        name: gromox-adaptor.service
        enabled: false
        state: stopped
      when: not grommunio_admin_web_enabled
      ignore_errors: true # exact service name depends on the installed appliance version; adjust during staging

    - name: "Also block network access to the web admin console (defense in depth)"
      community.general.ufw:
        rule: deny
        port: "8080"
        proto: tcp
      when: not grommunio_admin_web_enabled
      ignore_errors: true # ufw may not be the firewall used on the appliance; adapt depending on the image

    - name: "Ensure the EWS connector is active (Outlook, Apple Mail, Thunderbird compatibility — study 1.9)"
      ansible.builtin.systemd:
        name: gromox-http.service
        state: started
        enabled: true

    - name: "Ensure the EAS/ActiveSync connector is active (mobile — study 1.1)"
      ansible.builtin.systemd:
        name: gromox-zcore.service
        state: started
        enabled: true

    - name: "Ensure MAPI/RPC-HTTP is active (native Outlook compatibility — study 1.1)"
      ansible.builtin.systemd:
        name: gromox-http.service
        state: started
        enabled: true

  handlers:
    - name: "Restart grommunio-dav"
      ansible.builtin.systemd:
        name: gromox-dav.service
        state: restarted
