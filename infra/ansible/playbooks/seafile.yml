---
# Seafile configuration — study 1.4 (component chosen) and 2.11 (ban on
# unauthenticated share links, complementary to Gokapi for external sharing,
# 1.8) and 1.5 (OnlyOffice connector).
#
# Seafile is deployed via Helm in the Kubernetes cluster
# (infra/k8s/helm-values/seafile.yaml, out of scope for this task); this
# playbook carries the application configuration (seahub_settings.py) via a
# ConfigMap.

- name: "Configure seahub_settings.py (authenticated sharing, OnlyOffice connector)"
  hosts: seafile
  connection: local
  gather_facts: false
  vars:
    seafile_namespace: "seafile"
    seafile_configmap: "seahub-settings"
    # Study 2.11, line ~564-565: "SHARE_LINK_LOGIN_REQUIRED = True [...] forces
    # login to view any share link" — so that any unauthenticated external
    # sharing goes exclusively through Gokapi (1.8).
    seafile_share_link_login_required: true
    # Permission that can be disabled per role rather than only restricting
    # viewing (2.11) — set globally by default here; the precise per-role
    # breakdown (seahub_settings.py, ROLE_PERMISSIONS) is a setting to refine
    # during staging depending on consultant profiles.
    seafile_can_generate_share_link_default: true
    # OnlyOffice connector — study 1.5: "OFFICE_SERVER_TYPE" documented by
    # Seafile itself for OnlyOffice/Collabora integration.
    seafile_office_server_type: "OnlyOffice"
    seafile_onlyoffice_url: "https://{{ onlyoffice_domain }}"

  tasks:
    - name: "Render seahub_settings.py"
      ansible.builtin.template:
        src: ../templates/seahub_settings.py.j2
        dest: "{{ playbook_dir }}/../rendered/seahub_settings.py"
        mode: "0640"

    - name: "Publish seahub_settings.py as a Kubernetes ConfigMap"
      ansible.builtin.command: >-
        kubectl create configmap {{ seafile_configmap }}
        --namespace {{ seafile_namespace }}
        --from-file=seahub_settings.py={{ playbook_dir }}/../rendered/seahub_settings.py
        --dry-run=client -o yaml
      register: seafile_configmap_manifest
      changed_when: false

    - name: "kubectl apply the Seafile configuration"
      ansible.builtin.shell: |
        echo '{{ seafile_configmap_manifest.stdout }}' | kubectl apply -f -
      changed_when: true

    - name: "Restart the Seahub pods to pick up the configuration"
      ansible.builtin.command: >-
        kubectl rollout restart deployment/seahub
        --namespace {{ seafile_namespace }}
      changed_when: true
