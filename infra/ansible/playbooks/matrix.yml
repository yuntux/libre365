---
# Configuration of the Matrix/Synapse domain and the OIDC provider pointing
# to Keycloak — study 1.2 (Matrix/Synapse chosen, workers mode from the
# design stage) and 1.7 (central Keycloak SSO for the whole stack).
#
# Synapse itself is deployed via Helm in the Kubernetes cluster
# (infra/k8s/helm-values/synapse.yaml, out of scope for this task); this
# playbook only carries the application configuration (homeserver.yaml,
# OIDC provider) rendered from a template and then applied via a Kubernetes
# rollout.

- name: "Configure the Matrix/Synapse domain and OIDC SSO"
  hosts: matrix
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  vars:
    synapse_server_name: "{{ matrix_domain }}"
    synapse_config_configmap: "synapse-homeserver-config"
    synapse_namespace: "matrix"
    # OIDC client created by the keycloak_realm role (client_id: matrix-synapse);
    # the corresponding secret is read from the file generated by that role
    # rather than requested/created again here.
    synapse_oidc_client_id: "matrix-synapse"
    synapse_oidc_client_secret_file: "{{ playbook_dir }}/../secrets/keycloak-clients/matrix-synapse.env"

  tasks:
    - name: "Load the OIDC client secret generated for Synapse"
      ansible.builtin.set_fact:
        synapse_oidc_client_secret: >-
          {{ (lookup('file', synapse_oidc_client_secret_file)
              | regex_search('KEYCLOAK_CLIENT_SECRET=(.*)', '\\1'))[0] }}
      no_log: true

    - name: "Render the homeserver.yaml configuration (OIDC excerpt + server_name)"
      ansible.builtin.template:
        src: ../templates/synapse-homeserver-oidc.yaml.j2
        dest: "{{ playbook_dir }}/../rendered/synapse-homeserver-oidc.yaml"
        mode: "0640"
      no_log: true

    - name: "Apply the configuration to the Kubernetes cluster (kubectl create configmap --dry-run + apply)"
      ansible.builtin.command: >-
        kubectl create configmap {{ synapse_config_configmap }}
        --namespace {{ synapse_namespace }}
        --from-file=homeserver-oidc.yaml={{ playbook_dir }}/../rendered/synapse-homeserver-oidc.yaml
        --dry-run=client -o yaml
      register: synapse_configmap_manifest
      changed_when: false

    - name: "kubectl apply the Synapse configmap"
      ansible.builtin.shell: |
        echo '{{ synapse_configmap_manifest.stdout }}' | kubectl apply -f -
      changed_when: true

    - name: "Restart the Synapse pods (rollout restart) to pick up the OIDC config"
      ansible.builtin.command: >-
        kubectl rollout restart deployment/synapse-main
        --namespace {{ synapse_namespace }}
      changed_when: true
