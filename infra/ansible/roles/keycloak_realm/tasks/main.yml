---
# keycloak_realm role — creates the main realm, enables native MFA
# (TOTP + WebAuthn/FIDO2, study 1.7), and OIDC clients for each component.
#
# Uses community.general.keycloak_* (official module) rather than the REST
# API via `uri`, to benefit from the native idempotence of these modules —
# consistent with the declarative spirit of the IaC adopted in chapter 4.

- name: "Check for the presence of community.general"
  ansible.builtin.command: ansible-doc -l community.general.keycloak_realm
  register: keycloak_module_check
  changed_when: false
  failed_when: false
  delegate_to: localhost
  run_once: true

- name: "Warn if the community.general collection is missing"
  ansible.builtin.debug:
    msg: >-
      The community.general collection (keycloak_* modules) appears to be
      missing. Install it with
      `ansible-galaxy collection install community.general`
      before re-running this role.
  when: keycloak_module_check.rc != 0

- name: "Create/update the {{ keycloak_realm_name }} realm"
  community.general.keycloak_realm:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    id: "{{ keycloak_realm_name }}"
    realm: "{{ keycloak_realm_name }}"
    display_name: "{{ keycloak_realm_display_name }}"
    enabled: true
    registration_allowed: false
    reset_password_allowed: true
    remember_me: true
    verify_email: true
    # UI language (platform.yaml's `locale` section, single source of
    # truth - see docs/i18n.md): internationalization_enabled/
    # supported_locales/default_locale map to Keycloak's own
    # internationalizationEnabled/supportedLocales/defaultLocale realm
    # attributes, following this module's own snake_case<->camelCase
    # convention already used for e.g. display_name above - inferred from
    # that convention and Keycloak's own long-stable REST API field names,
    # not directly verified against this module's source from this
    # sandboxed environment (community.general isn't installed offline
    # here, see this repo's CI job for where it actually gets installed
    # and could confirm this).
    internationalization_enabled: true
    supported_locales: "{{ libre365_locale_available }}"
    default_locale: "{{ libre365_locale_default }}"
    # OTP policy — TOTP natively enabled (study 1.7, line ~264).
    otp_policy_type: "{{ keycloak_realm_otp_policy_type }}"
    otp_policy_algorithm: "{{ keycloak_realm_otp_policy_algorithm }}"
    otp_policy_digits: "{{ keycloak_realm_otp_policy_digits }}"
    otp_policy_period: "{{ keycloak_realm_otp_policy_period }}"
    state: present
  no_log: true # avoids logging the admin password passed in plaintext in the module's parameters

# [CORRECTED] found live on a user's VM: community.general.keycloak_realm
# (any version within requirements.yml's >=8.0.0,<10.0.0 pin) has NO
# web_authn_policy_* parameters at all - "Unsupported parameters" listing
# every single realm field it DOES support, none of them WebAuthn-related
# - confirmed directly against the module's own real error output, then
# against community.general's real CHANGELOG.rst (main and stable-10
# branches): no keycloak_realm changelog entry ever mentions WebAuthn.
# Keycloak's own REST API has supported these RealmRepresentation fields
# (webAuthnPolicyRpEntityName etc.) for years - this is a gap in the
# Ansible module's own parameter coverage, not a Keycloak limitation, so
# worked around here with three plain REST calls (token -> GET -> PUT)
# instead of waiting on the module to add them. GET-then-merge-then-PUT
# (not a partial PUT) since Keycloak's realm update endpoint expects the
# full RealmRepresentation, not a partial patch.
- name: "Obtain an admin access token (WebAuthn policy REST calls below)"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/realms/{{ keycloak_admin_realm }}/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_admin_user }}"
      password: "{{ keycloak_admin_password }}"
    status_code: 200
  register: keycloak_admin_token
  no_log: true

- name: "Fetch the current {{ keycloak_realm_name }} realm representation"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ keycloak_admin_token.json.access_token }}"
    status_code: 200
  register: keycloak_realm_representation
  no_log: true

- name: "Apply the WebAuthn/FIDO2 policy — second factor AND passwordless primary factor (passkey), see study 1.7: 'both as a second factor and as a primary passwordless factor'"
  ansible.builtin.uri:
    url: "{{ keycloak_base_url }}/admin/realms/{{ keycloak_realm_name }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ keycloak_admin_token.json.access_token }}"
    body_format: json
    body: >-
      {{ keycloak_realm_representation.json | combine({
        'webAuthnPolicyRpEntityName': keycloak_realm_display_name,
        'webAuthnPolicyRpId': libre365_domain,
        'webAuthnPolicySignatureAlgorithms': ['ES256', 'RS256'],
        'webAuthnPolicyUserVerificationRequirement': 'preferred',
        'webAuthnPolicyPasswordlessRpEntityName': keycloak_realm_display_name,
        'webAuthnPolicyPasswordlessRpId': libre365_domain,
      }) }}
    status_code: 204
  no_log: true

- name: "Copy the built-in browser flow into a custom one with WebAuthn enabled"
  community.general.keycloak_authentication:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ keycloak_realm_name }}"
    # [CORRECTED] found live on a user's VM: Keycloak rejects any
    # execution added directly to a built-in flow ("It is illegal to add
    # execution to a built in flow") - `alias: "browser"` (the SAME name
    # as `copyFrom`) made the module treat the built-in flow as the
    # target to manage in place (it already exists, so no copy happened)
    # rather than creating a new one from it, and Keycloak then refused
    # the resulting execution-add call outright. `alias` must name a NEW,
    # non-built-in flow for `copyFrom` to actually copy into - the
    # realm's `browser_flow` (set just below) is what then makes login
    # actually use it instead of the untouched built-in "browser" flow.
    alias: "{{ keycloak_realm_browser_flow_alias }}"
    # [CORRECTED] found live on a user's VM: this module (unlike most
    # other community.general.keycloak_* modules used elsewhere in this
    # file) doesn't alias these two parameters to snake_case - confirmed
    # against its own real "Unsupported parameters" error, which lists
    # `copyFrom`/`authenticationExecutions` as the only accepted spelling.
    copyFrom: "browser"
    authenticationExecutions:
      - providerId: "webauthn-authenticator"
        requirement: "ALTERNATIVE"
      - providerId: "webauthn-authenticator-passwordless"
        requirement: "ALTERNATIVE"
    state: present
  no_log: true
  when: keycloak_realm_webauthn_enabled | bool

- name: "Point the realm's browser flow at the custom WebAuthn-enabled copy"
  community.general.keycloak_realm:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    id: "{{ keycloak_realm_name }}"
    realm: "{{ keycloak_realm_name }}"
    browser_flow: "{{ keycloak_realm_browser_flow_alias }}"
    state: present
  no_log: true
  when: keycloak_realm_webauthn_enabled | bool

- name: "Create/update the stack's OIDC clients"
  community.general.keycloak_client:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ keycloak_realm_name }}"
    client_id: "{{ item.client_id }}"
    name: "{{ item.name }}"
    root_url: "{{ item.root_url }}"
    redirect_uris: "{{ item.redirect_uris }}"
    web_origins: "{{ item.web_origins | default(omit) }}"
    public_client: "{{ item.public_client | default(false) }}"
    attributes: "{{ item.attributes | default(omit) }}"
    protocol_mappers: "{{ item.protocol_mappers | default(omit) }}"
    protocol: "openid-connect"
    standard_flow_enabled: true
    direct_access_grants_enabled: false
    service_accounts_enabled: false
    full_scope_allowed: false
    state: present
  no_log: true
  loop: "{{ keycloak_oidc_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  register: keycloak_clients_result

- name: "Retrieve the generated secret for each confidential client"
  community.general.keycloak_clientsecret_info:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ keycloak_realm_name }}"
    id: "{{ item.client_id }}"
  no_log: true
  loop: "{{ keycloak_oidc_clients }}"
  loop_control:
    label: "{{ item.client_id }}"
  when: not (item.public_client | default(false))
  register: keycloak_client_secrets

- name: "Write the client secrets on the controller (directory outside the versioned repository)"
  ansible.builtin.template:
    src: client-secret.env.j2
    dest: "{{ keycloak_client_secrets_output_dir }}/{{ item.item.client_id }}.env"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  loop: "{{ keycloak_client_secrets.results }}"
  loop_control:
    label: "{{ item.item.client_id }}"
  when: item.skipped is not defined

- name: "Create/update the app-portal banner's Keycloak groups (study 2.3)"
  community.general.keycloak_group:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ keycloak_realm_name }}"
    name: "{{ item.name }}"
    state: present
  no_log: true
  loop: "{{ keycloak_realm_groups }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Create the representative test user (study 4.4, point 2) - OPT-IN, dev/staging only"
  community.general.keycloak_user:
    auth_keycloak_url: "{{ keycloak_base_url }}"
    auth_realm: "{{ keycloak_admin_realm }}"
    auth_username: "{{ keycloak_admin_user }}"
    auth_password: "{{ keycloak_admin_password }}"
    realm: "{{ keycloak_realm_name }}"
    username: "{{ keycloak_realm_test_user_username }}"
    email: "{{ keycloak_realm_test_user_email }}"
    enabled: true
    email_verified: true
    credentials:
      - type: password
        value: "{{ keycloak_realm_test_user_password }}"
        temporary: false
    # Same default group a real new user would land in without further
    # provisioning (study 2.3) - exercises connectors/unified-search's
    # `/portal/apps` fallback-to-default path for real in every test run,
    # rather than only in the unit tests that mock it.
    groups:
      - "{{ (keycloak_realm_groups | selectattr('default', 'true') | first).name }}"
    state: present
  no_log: true
  when: keycloak_realm_test_user_enabled | bool
