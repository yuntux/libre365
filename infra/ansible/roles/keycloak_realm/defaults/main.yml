---
# Defaults du rôle keycloak_realm — étude 1.7 : Keycloak en SSO/IAM central,
# TOTP + WebAuthn/FIDO2 activés nativement dès le déploiement initial.

keycloak_realm_name: "open365"
keycloak_realm_display_name: "Open365"

# MFA — étude 1.7, ligne ~264-265 : TOTP et WebAuthn/FIDO2 "nativement
# supportés, sans développement". SMS et OTP mail sont volontairement absents
# de cette liste : ils nécessitent un SPI Keycloak custom non couvert par ce
# rôle (cf. chantiers à développer, fin de l'étude).
keycloak_realm_otp_policy_type: "totp"
keycloak_realm_otp_policy_algorithm: "HmacSHA1"
keycloak_realm_otp_policy_digits: 6
keycloak_realm_otp_policy_period: 30
keycloak_realm_webauthn_enabled: true
keycloak_realm_webauthn_passwordless_enabled: true # WebAuthn comme facteur principal sans mot de passe (passkey), cf. 1.7

# Clients OIDC — un par brique de la stack supportant nativement OIDC (étude
# 1.7, critères de choix : "à vérifier service par service ; Grommunio, Seafile,
# Vikunja et OnlyOffice supportent OIDC ; Matrix/Synapse également via
# provider OIDC"). Grommunio lui-même n'est PAS ajouté ici : le SSO applicatif
# de grommunio-web n'est pas retenu comme prioritaire par l'étude (l'admin web
# reste de toute façon désactivée, cf. playbooks/grommunio.yml) — laissé en
# commentaire pour extension future si un besoin de SSO webmail émerge.
keycloak_oidc_clients:
  - client_id: "seafile"
    name: "Seafile"
    root_url: "https://{{ seafile_domain }}"
    redirect_uris:
      - "https://{{ seafile_domain }}/oauth/callback/"
    public_client: false

  - client_id: "vikunja"
    name: "Vikunja"
    root_url: "https://tasks.{{ open365_domain }}"
    redirect_uris:
      - "https://tasks.{{ open365_domain }}/auth/openid/*"
    public_client: false

  - client_id: "onlyoffice"
    name: "OnlyOffice Document Server"
    root_url: "https://{{ onlyoffice_domain }}"
    redirect_uris:
      - "https://{{ onlyoffice_domain }}/oauth2/callback"
    public_client: false

  - client_id: "matrix-synapse"
    name: "Matrix Synapse"
    root_url: "https://{{ matrix_domain }}"
    redirect_uris:
      - "https://{{ matrix_domain }}/_synapse/client/oidc/callback"
    public_client: false

  - client_id: "gokapi"
    name: "Gokapi"
    root_url: "https://send.{{ open365_domain }}"
    redirect_uris:
      - "https://send.{{ open365_domain }}/oauth2/callback"
    public_client: false

  - client_id: "novu"
    name: "Novu (centre de notifications)"
    root_url: "https://notify.{{ open365_domain }}"
    redirect_uris:
      - "https://notify.{{ open365_domain }}/auth/oidc/callback"
    public_client: false

  - client_id: "peertube"
    name: "PeerTube"
    root_url: "https://video.{{ open365_domain }}"
    redirect_uris:
      - "https://video.{{ open365_domain }}/plugins/auth-openid-connect/router/callback"
    public_client: false

keycloak_client_secrets_output_dir: "{{ playbook_dir }}/../secrets/keycloak-clients"
