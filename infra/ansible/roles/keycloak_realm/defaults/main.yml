---
# Defaults for the keycloak_realm role — study 1.7: Keycloak as the central
# SSO/IAM, TOTP + WebAuthn/FIDO2 natively enabled from the initial deployment.

keycloak_realm_name: "{{ libre365_keycloak_realm_name }}"
keycloak_realm_display_name: "Libre365"

# MFA — study 1.7, line ~264-265: TOTP and WebAuthn/FIDO2 "natively
# supported, with no development needed". SMS and email OTP are deliberately
# absent from this list: they require a custom Keycloak SPI not covered by
# this role (see the future development items at the end of the study).
keycloak_realm_otp_policy_type: "totp"
keycloak_realm_otp_policy_algorithm: "HmacSHA1"
keycloak_realm_otp_policy_digits: 6
keycloak_realm_otp_policy_period: 30
keycloak_realm_webauthn_enabled: true
keycloak_realm_webauthn_passwordless_enabled: true # WebAuthn as the primary passwordless factor (passkey), see 1.7

# Representative test user (study 4.4, point 2) - used by every
# tests/integration/ scenario and by the ephemeral staging workflow
# (.github/workflows/ephemeral-staging.yml). OPT-IN and OFF by default: a
# fake "consultant" account has no reason to exist in a real production
# realm, so `site.yml` (the production playbook) never turns this on -
# only dev-cluster/provision-keycloak-dev.sh and the CI workflow above
# pass `-e keycloak_realm_test_user_enabled=true` explicitly.
#
# Username/email come from platform.yaml's `test_dataset` (single source,
# also read by tests/integration/_platform_defaults.py, generated by
# scripts/sync_platform.py) - only the password has no default here: it
# must always be supplied explicitly (`-e
# keycloak_realm_test_user_password=...` or an Ansible Vault variable),
# the same way keycloak_admin_password has none either.
keycloak_realm_test_user_enabled: false
keycloak_realm_test_user_username: "{{ libre365_test_user_username }}"
keycloak_realm_test_user_email: "{{ libre365_test_user_email }}"

# Cross-cutting app-portal banner groups (study 2.3) - single source is
# platform.yaml's `portal.groups`, read into group_vars/all.yml as
# libre365_portal_groups. Each group becomes a real Keycloak Group; the
# test user (above) is added to whichever one has `default: true`, the
# same way a real new user would be by whatever provisioning process the
# firm adopts (out of scope here - see this role's README).
keycloak_realm_groups: "{{ libre365_portal_groups }}"

# OIDC clients — one per stack component gated by Keycloak SSO (study 1.7,
# selection criteria: "to be checked service by service; Grommunio,
# Seafile, Vikunja and OnlyOffice support OIDC; Matrix/Synapse too via an
# OIDC provider"). Every component the study expects to be SSO-gated has a
# client here — including OnlyOffice and Novu, which don't support OIDC
# NATIVELY (see below), gated at the reverse-proxy layer instead rather
# than left unprotected.
#
# Every client below is expected to be a COMPLETE chain, not just a realm
# entry: docs/oidc.md documents, and scripts/sync_platform.py's
# check_oidc_coverage() enforces in CI, that each client_id here also
# appears (a) in the file that actually uses it as the OIDC client_id
# (either the application's own infra/k8s/helm-values/*.yaml, or an
# oauth2-proxy gate's helm-values file for the two below that need one),
# and (b) in infra/k8s/manifests/external-secrets.yaml as an ExternalSecret
# providing that client's secret — found missing on both counts for
# several clients during a review pass (see docs/oidc.md's changelog note
# for the details), fixed there rather than re-explained here.
#
#   - OnlyOffice Document Server: Community Edition has no standalone
#     end-user login screen of its own (JWT_ENABLED only signs individual
#     document-open requests from Seafile's editor integration - it does
#     nothing to stop a browser reaching office.libre365.example.org
#     directly). Gated instead by a Caddy forward_auth to oauth2-proxy
#     (infra/k8s/helm-values/oauth2-proxy-onlyoffice.yaml), which is what
#     this client's redirect_uris point at - in addition to, not instead
#     of, the existing JWT document-level signing.
#   - Novu: the notification-center WIDGET authenticates subscribers via an
#     HMAC-signed subscriber hash issued by the API key
#     (connectors/notification-hub's own secret), not OIDC - that part
#     (novu-api, consumed by the top-bar widget) is deliberately left
#     ungated so it keeps working without an interactive login. Novu's own
#     `web` ADMIN dashboard is a separate surface, now exposed at
#     notifications-admin.libre365.example.org behind its own oauth2-proxy
#     gate (infra/k8s/helm-values/oauth2-proxy-novu.yaml), which is what
#     this client's redirect_uris point at.
#
# Grommunio deliberately has NO client: application SSO for grommunio-web
# is not treated as a priority by the study (the web admin stays disabled
# anyway, see playbooks/grommunio.yml) - left for future extension, not a
# gap (see docs/oidc.md).
keycloak_oidc_clients:
  - client_id: "seafile"
    name: "Seafile"
    root_url: "https://{{ seafile_domain }}"
    redirect_uris:
      - "https://{{ seafile_domain }}/oauth/callback/"
    public_client: false

  - client_id: "vikunja"
    name: "Vikunja"
    root_url: "https://{{ vikunja_domain }}"
    redirect_uris:
      - "https://{{ vikunja_domain }}/auth/openid/*"
    public_client: false

  - client_id: "matrix-synapse"
    name: "Matrix Synapse"
    root_url: "https://{{ matrix_domain }}"
    redirect_uris:
      - "https://{{ matrix_domain }}/_synapse/client/oidc/callback"
    public_client: false

  - client_id: "gokapi"
    name: "Gokapi"
    root_url: "https://{{ gokapi_domain }}"
    redirect_uris:
      - "https://{{ gokapi_domain }}/oauth2/callback"
    public_client: false

  - client_id: "peertube"
    name: "PeerTube"
    root_url: "https://{{ peertube_domain }}"
    redirect_uris:
      - "https://{{ peertube_domain }}/plugins/auth-openid-connect/router/callback"
    public_client: false

  - client_id: "visio-meet"
    name: "Visio (LaSuite Meet)"
    root_url: "https://{{ visio_domain }}"
    # mozilla-django-oidc's own default callback path (LaSuite Meet is a
    # Django app, per its OIDC_OP_*/OIDC_RP_CLIENT_ID env var naming in
    # infra/k8s/helm-values/visio-meet.yaml, which is that library's own
    # naming convention) - inferred from that library's well-established
    # default, not independently confirmed against LaSuite Meet's own
    # source/docs from this sandboxed environment.
    redirect_uris:
      - "https://{{ visio_domain }}/oidc/callback/"
    public_client: false

  - client_id: "onlyoffice"
    name: "OnlyOffice (oauth2-proxy gate)"
    root_url: "https://{{ onlyoffice_domain }}"
    # oauth2-proxy's own default callback path - this client authenticates
    # the forward_auth gate in front of OnlyOffice, not OnlyOffice itself.
    redirect_uris:
      - "https://{{ onlyoffice_domain }}/oauth2/callback"
    public_client: false

  - client_id: "novu"
    name: "Novu admin dashboard (oauth2-proxy gate)"
    root_url: "https://{{ notifications_admin_domain }}"
    # Gates Novu's `web` admin dashboard only - novu-api (the top-bar
    # widget's own HMAC-authenticated endpoint) stays ungated, see the
    # comment above keycloak_oidc_clients.
    redirect_uris:
      - "https://{{ notifications_admin_domain }}/oauth2/callback"
    public_client: false

  - client_id: "libre365-portal"
    name: "libre365 application-portal banner (study 2.3)"
    root_url: "https://{{ libre365_domain }}"
    # Public SPA client (no secret, PKCE) used ONLY by banner.js's own
    # silent-SSO flow (hidden iframe, prompt=none) to obtain a short-lived
    # access token for connectors/unified-search's `/portal/apps` and
    # connectors/notification-hub's `/widget/session` - never used for an
    # interactive login of its own. One redirect URI per app the banner is
    # injected into (see infra/k8s/manifests/caddy.yaml's `injection`
    # blocks) - all 4 static callback pages are byte-identical
    # (caddy-injection.yaml's `sso-silent-callback.html`).
    redirect_uris:
      - "https://{{ chat_domain }}/libre365-banner/sso-silent-callback.html"
      - "https://{{ seafile_domain }}/libre365-banner/sso-silent-callback.html"
      - "https://{{ vikunja_domain }}/libre365-banner/sso-silent-callback.html"
      - "https://{{ peertube_domain }}/libre365-banner/sso-silent-callback.html"
    web_origins:
      - "https://{{ chat_domain }}"
      - "https://{{ seafile_domain }}"
      - "https://{{ vikunja_domain }}"
      - "https://{{ peertube_domain }}"
    public_client: true
    # PKCE (S256) is mandatory for a public client doing an Authorization
    # Code flow from a browser (no client secret to otherwise prove the
    # token-exchange request came from the same party that started the
    # flow) - `attributes` is community.general.keycloak_client's generic
    # passthrough for any Keycloak client attribute not covered by a
    # dedicated module parameter.
    attributes:
      pkce.code.challenge.method: "S256"
    # Realm-wide "Group Membership" protocol mapper (Keycloak built-in
    # `oidc-group-membership-mapper`) so the access token this client
    # issues carries a `groups` claim (group PATHS, e.g. "/consultants") -
    # what connectors/unified-search's `/portal/apps` and
    # connectors/notification-hub's `/widget/session` both read to
    # identify the caller's group/subscriberId. Only needed on this
    # client, not the other confidential ones above (those authenticate
    # applications, not this banner).
    protocol_mappers:
      - name: "groups"
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config:
          "claim.name": "groups"
          "full.path": "false"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"

keycloak_client_secrets_output_dir: "{{ playbook_dir }}/../secrets/keycloak-clients"
