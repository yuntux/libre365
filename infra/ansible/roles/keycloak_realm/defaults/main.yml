---
# Defaults for the keycloak_realm role — study 1.7: Keycloak as the central
# SSO/IAM, TOTP + WebAuthn/FIDO2 natively enabled from the initial deployment.

keycloak_realm_name: "libre365"
keycloak_realm_display_name: "Libre365"

# MFA — study 1.7, line ~264-265: TOTP and WebAuthn/FIDO2 "natively
# supported, with no development needed". SMS and email OTP are deliberately
# absent from this list: they require a custom Keycloak SPI not covered by
# this role (see the future development items at the end of the study).
keycloak_realm_otp_policy_type: "totp"
keycloak_realm_otp_policy_algorithm: "HmacSHA1"
keycloak_realm_otp_policy_digits: 6
keycloak_realm_otp_policy_period: 30
keycloak_realm_webauthn_enabled: true
keycloak_realm_webauthn_passwordless_enabled: true # WebAuthn as the primary passwordless factor (passkey), see 1.7

# OIDC clients — one per stack component that natively supports OIDC (study
# 1.7, selection criteria: "to be checked service by service; Grommunio,
# Seafile, Vikunja and OnlyOffice support OIDC; Matrix/Synapse too via an
# OIDC provider"). Grommunio itself is NOT added here: application SSO for
# grommunio-web is not treated as a priority by the study (the web admin
# stays disabled anyway, see playbooks/grommunio.yml) — left as a comment
# for future extension should a webmail SSO need emerge.
keycloak_oidc_clients:
  - client_id: "seafile"
    name: "Seafile"
    root_url: "https://{{ seafile_domain }}"
    redirect_uris:
      - "https://{{ seafile_domain }}/oauth/callback/"
    public_client: false

  - client_id: "vikunja"
    name: "Vikunja"
    root_url: "https://tasks.{{ libre365_domain }}"
    redirect_uris:
      - "https://tasks.{{ libre365_domain }}/auth/openid/*"
    public_client: false

  - client_id: "onlyoffice"
    name: "OnlyOffice Document Server"
    root_url: "https://{{ onlyoffice_domain }}"
    redirect_uris:
      - "https://{{ onlyoffice_domain }}/oauth2/callback"
    public_client: false

  - client_id: "matrix-synapse"
    name: "Matrix Synapse"
    root_url: "https://{{ matrix_domain }}"
    redirect_uris:
      - "https://{{ matrix_domain }}/_synapse/client/oidc/callback"
    public_client: false

  - client_id: "gokapi"
    name: "Gokapi"
    root_url: "https://send.{{ libre365_domain }}"
    redirect_uris:
      - "https://send.{{ libre365_domain }}/oauth2/callback"
    public_client: false

  - client_id: "novu"
    name: "Novu (notification center)"
    root_url: "https://notify.{{ libre365_domain }}"
    redirect_uris:
      - "https://notify.{{ libre365_domain }}/auth/oidc/callback"
    public_client: false

  - client_id: "peertube"
    name: "PeerTube"
    root_url: "https://video.{{ libre365_domain }}"
    redirect_uris:
      - "https://video.{{ libre365_domain }}/plugins/auth-openid-connect/router/callback"
    public_client: false

keycloak_client_secrets_output_dir: "{{ playbook_dir }}/../secrets/keycloak-clients"
