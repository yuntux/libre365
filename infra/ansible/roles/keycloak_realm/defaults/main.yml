---
# Defaults for the keycloak_realm role — study 1.7: Keycloak as the central
# SSO/IAM, TOTP + WebAuthn/FIDO2 natively enabled from the initial deployment.

keycloak_realm_name: "libre365"
keycloak_realm_display_name: "Libre365"

# MFA — study 1.7, line ~264-265: TOTP and WebAuthn/FIDO2 "natively
# supported, with no development needed". SMS and email OTP are deliberately
# absent from this list: they require a custom Keycloak SPI not covered by
# this role (see the future development items at the end of the study).
keycloak_realm_otp_policy_type: "totp"
keycloak_realm_otp_policy_algorithm: "HmacSHA1"
keycloak_realm_otp_policy_digits: 6
keycloak_realm_otp_policy_period: 30
keycloak_realm_webauthn_enabled: true
keycloak_realm_webauthn_passwordless_enabled: true # WebAuthn as the primary passwordless factor (passkey), see 1.7

# OIDC clients — one per stack component that has an actual end-user login
# surface of its own AND natively supports OIDC (study 1.7, selection
# criteria: "to be checked service by service; Grommunio, Seafile, Vikunja
# and OnlyOffice support OIDC; Matrix/Synapse too via an OIDC provider").
#
# Every client below is expected to be a COMPLETE chain, not just a realm
# entry: docs/oidc.md documents, and scripts/sync_platform.py's
# check_oidc_coverage() enforces in CI, that each client_id here also
# appears (a) in the corresponding infra/k8s/helm-values/*.yaml as the
# actual OIDC client_id the app is configured with, and (b) in
# infra/k8s/manifests/external-secrets.yaml as an ExternalSecret providing
# that client's secret — found missing on both counts for several clients
# during a review pass (see docs/oidc.md's changelog note for the details),
# fixed there rather than re-explained here.
#
# Two components deliberately have NO client, despite superficially
# "supporting OIDC" per the line quoted above - see docs/oidc.md for the
# full reasoning, summarized here:
#   - Grommunio: application SSO for grommunio-web is not treated as a
#     priority by the study (the web admin stays disabled anyway, see
#     playbooks/grommunio.yml) - left for future extension.
#   - OnlyOffice Document Server: in this architecture it has no standalone
#     end-user login at all - it's reached exclusively via JWT-signed
#     requests from Seafile's own editor integration (onlyoffice-jwt-secret,
#     already wired in seafile.yaml/onlyoffice.yaml), the same way every
#     self-hosted OnlyOffice-behind-a-host-app deployment works. A client
#     was previously created here with no corresponding login flow able to
#     ever use it - removed rather than papered over with invented config.
#   - Novu: the notification-center widget authenticates subscribers via an
#     HMAC-signed subscriber hash issued by the API key
#     (connectors/notification-hub's own secret), not an OIDC login - so a
#     "novu" Keycloak client had no real consumer either, for the same
#     reason as OnlyOffice above. Novu's own admin dashboard is not exposed
#     publicly in this stack (no Caddy site, no domain wired for it beyond
#     the API), so there is no login surface at all today for OIDC to
#     protect.
keycloak_oidc_clients:
  - client_id: "seafile"
    name: "Seafile"
    root_url: "https://{{ seafile_domain }}"
    redirect_uris:
      - "https://{{ seafile_domain }}/oauth/callback/"
    public_client: false

  - client_id: "vikunja"
    name: "Vikunja"
    root_url: "https://{{ vikunja_domain }}"
    redirect_uris:
      - "https://{{ vikunja_domain }}/auth/openid/*"
    public_client: false

  - client_id: "matrix-synapse"
    name: "Matrix Synapse"
    root_url: "https://{{ matrix_domain }}"
    redirect_uris:
      - "https://{{ matrix_domain }}/_synapse/client/oidc/callback"
    public_client: false

  - client_id: "gokapi"
    name: "Gokapi"
    root_url: "https://{{ gokapi_domain }}"
    redirect_uris:
      - "https://{{ gokapi_domain }}/oauth2/callback"
    public_client: false

  - client_id: "peertube"
    name: "PeerTube"
    root_url: "https://{{ peertube_domain }}"
    redirect_uris:
      - "https://{{ peertube_domain }}/plugins/auth-openid-connect/router/callback"
    public_client: false

  - client_id: "visio-meet"
    name: "Visio (LaSuite Meet)"
    root_url: "https://{{ visio_domain }}"
    # mozilla-django-oidc's own default callback path (LaSuite Meet is a
    # Django app, per its OIDC_OP_*/OIDC_RP_CLIENT_ID env var naming in
    # infra/k8s/helm-values/visio-meet.yaml, which is that library's own
    # naming convention) - inferred from that library's well-established
    # default, not independently confirmed against LaSuite Meet's own
    # source/docs from this sandboxed environment.
    redirect_uris:
      - "https://{{ visio_domain }}/oidc/callback/"
    public_client: false

keycloak_client_secrets_output_dir: "{{ playbook_dir }}/../secrets/keycloak-clients"
