# =============================================================================
# libre365 - development/test docker-compose environment
# Study, chapter 4.6: "Development/test: reduced scale, synthetic data."
#
# As of the k3d dev cluster migration, this file no longer hosts the whole
# dev/test tier. Every service that has a production Helm chart worth
# reusing (Keycloak, Synapse/Element, Seafile, OnlyOffice, Vikunja, Gokapi,
# MinIO, PeerTube, Caddy, and the 5 in-house connectors) now runs on the
# local k3d Kubernetes cluster instead, so that dev/test stays as close as
# possible to the production deployment model (chapter 4.4) - see
# dev-cluster/README.md for the full rationale and startup instructions.
#
# This file is what remains: the two services that could NOT be migrated to
# the k3d dev cluster.
#   - grommunio-dev: the study (4.3) targets a Proxmox VM appliance for
#     production, never a container, so there is no Helm chart to reuse -
#     kept here purely so integration tests (send/receive mail, study 5.5)
#     can run in CI without a Proxmox VM.
#   - novu-mock: a lightweight HTTP mock with no real Helm chart counterpart
#     worth reusing (the production `novu` chart deploys the full
#     api/worker/ws/MongoDB/Redis stack, disproportionate for a mock).
#
# All images are official Docker Hub/Quay images, explicitly tagged (never
# `latest`), with ports mapped in the clear on localhost rather than the
# ingress/TLS model of the K8s target (chapter 4.4).
# =============================================================================

name: libre365-dev

networks:
  libre365:
    driver: bridge

volumes:
  grommunio-dev-data:

services:

  # ---------------------------------------------------------------------
  # Unified notification center (study 2.1)
  # ---------------------------------------------------------------------
  # Documented choice: no full assembly of novu/api + novu/worker +
  # novu/ws + MongoDB + Redis here. The reference Novu stack is heavy for
  # this quick dev/test tier, and the main goal of this environment is to
  # test the application connectors (2.1, 2.7, 2.8), not Novu itself. We
  # therefore use a minimal HTTP mock (official node image) that exposes
  # the same API shape (POST /v1/events/trigger) that these connectors
  # consume. For an acceptance test with real Novu, follow
  # https://docs.novu.co/self-hosting (chapter 4.4/5.5, ephemeral staging
  # environment, not this dev/test tier).
  novu-mock:
    image: node:20.17-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/server.js"]
    environment:
      PORT: "3000"
    volumes:
      - ./config/novu-mock/server.js:/app/server.js:ro
    ports:
      - "${NOVU_MOCK_PORT:-13000}:3000"
    networks: [libre365]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Mail/calendar: Grommunio - DEV/TEST ONLY (study 1.1 / 4.3)
  # ---------------------------------------------------------------------
  # The study (4.3) explicitly selects Grommunio as a Proxmox VM appliance
  # for PRODUCTION, not as a container: the official container packaging
  # (grommunio/gromox-container) is presented by the vendor itself as a
  # solution for special needs, not production-ready (bundles
  # nginx/Postfix/gromox/Redis/PHP-FPM under a single supervisord).
  # It is included HERE only so integration tests (send/receive mail,
  # study 5.5) can run in CI without a Proxmox VM.
  # DO NOT reproduce this service as-is in a staging/production environment.
  grommunio-dev:
    image: grommunio/gromox-container:core-c9
    restart: unless-stopped
    environment:
      TZ: ${GROMMUNIO_TIMEZONE:-Europe/Paris}
      GROMMUNIO_ADMIN_PASSWORD: ${GROMMUNIO_ADMIN_PASSWORD:-devonly-changeme-grommunio-admin}
    volumes:
      - grommunio-dev-data:/etc/gromox
    ports:
      - "${GROMMUNIO_DEV_HTTP_PORT:-8443}:8443"
    networks: [libre365]
    # No documented standard healthcheck for this image (usage not
    # recommended in prod by the vendor itself, see comment above) -
    # wait-for-healthy.sh falls back to a simple TCP check for this service.
