# =============================================================================
# open365 - environnement docker-compose de developpement/test
# Etude, chapitre 4.6 : "Developpement/test : echelle reduite, donnees
# synthetiques." Chapitre 4.4 explique pourquoi ceci N'EST PAS la cible de
# production (pas de scaling horizontal ni de HA ici - Kubernetes assure
# cela en prod). Objectif de ce fichier : demarrer une version allegee de
# toute la stack pour le developpement local et pour que
# tests/integration/ (pytest, contre http://localhost:<port>) tourne en CI.
#
# Toutes les images sont des images officielles Docker Hub/Quay, taguees
# explicitement (jamais `latest`), avec des ports mappes en clair sur
# localhost plutot que le modele d'ingress/TLS de la cible K8s (chapitre 4.4).
# =============================================================================

name: open365-dev

networks:
  open365:
    driver: bridge

volumes:
  keycloak-db-data:
  synapse-db-data:
  synapse-data:
  onlyoffice-db-data:
  onlyoffice-data:
  seafile-data:
  seafile-data-mysql:
  vikunja-data:
  gokapi-data:
  minio-data:
  peertube-db-data:
  peertube-data:
  grommunio-dev-data:

services:

  # ---------------------------------------------------------------------
  # Identite / SSO (etude 1.7)
  # ---------------------------------------------------------------------
  postgres-keycloak:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-devonly-changeme-keycloak-db}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_KEYCLOAK_PORT:-5433}:5432"
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    restart: unless-stopped
    # Mode dev (start-dev) : pas de TLS, H2/Postgres au choix, adapte au
    # dev/test uniquement - cf. etude 4.4 pour le cluster Keycloak de prod.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-devonly-changeme-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-devonly-changeme-keycloak-db}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------
  # Tchat / visio-continuite : Matrix Synapse + Element (etude 1.2)
  # ---------------------------------------------------------------------
  postgres-synapse:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SYNAPSE_DB_NAME:-synapse}
      POSTGRES_USER: ${SYNAPSE_DB_USER:-synapse}
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD:-devonly-changeme-synapse-db}
      # Synapse impose ces deux reglages sur sa base Postgres, y compris en
      # dev (cf. documentation Synapse "Using Postgres").
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - synapse-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_SYNAPSE_PORT:-5434}:5432"
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYNAPSE_DB_USER:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: matrixdotorg/synapse:v1.114.0
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./config/synapse/homeserver.yaml:/data/homeserver.yaml:ro
      - ./config/synapse/log.config:/data/log.config:ro
      - synapse-data:/data/media_store
    ports:
      - "${SYNAPSE_CLIENT_PORT:-8008}:8008"
      - "${SYNAPSE_FEDERATION_PORT:-8448}:8448"
    depends_on:
      postgres-synapse:
        condition: service_healthy
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  element:
    image: vectorim/element-web:v1.11.86
    restart: unless-stopped
    ports:
      - "${ELEMENT_PORT:-8081}:80"
    depends_on:
      - synapse
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Fichiers : Seafile (etude 1.4)
  # ---------------------------------------------------------------------
  seafile:
    image: seafileltd/seafile-mc:11.0.13
    restart: unless-stopped
    environment:
      DB_HOST: seafile-mysql
      DB_ROOT_PASSWD: devonly-changeme-seafile-mysql-root
      TIME_ZONE: Europe/Paris
      SEAFILE_ADMIN_EMAIL: ${SEAFILE_ADMIN_EMAIL:-admin@open365.localhost}
      SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD:-devonly-changeme-seafile-admin}
      SEAFILE_SERVER_LETSENCRYPT: "false"
      SEAFILE_SERVER_HOSTNAME: "localhost"
    volumes:
      - seafile-data:/shared
    ports:
      - "${SEAFILE_PORT:-8082}:80"
    depends_on:
      - seafile-mysql
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Seafile-mc gere sa propre base MariaDB interne (contrairement a
  # Keycloak/Synapse/OnlyOffice, ici on suit le modele d'image officielle
  # "tout-en-un + DB dediee" fourni par l'editeur plutot que de la brancher
  # sur une base partagee - une base dediee par brique reste respectee).
  seafile-mysql:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devonly-changeme-seafile-mysql-root
    volumes:
      - seafile-data-mysql:/var/lib/mysql
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pdevonly-changeme-seafile-mysql-root"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Edition collaborative : OnlyOffice Document Server (etude 1.5)
  # ---------------------------------------------------------------------
  postgres-onlyoffice:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ONLYOFFICE_DB_NAME:-onlyoffice}
      POSTGRES_USER: ${ONLYOFFICE_DB_USER:-onlyoffice}
      POSTGRES_PASSWORD: ${ONLYOFFICE_DB_PASSWORD:-devonly-changeme-onlyoffice-db}
    volumes:
      - onlyoffice-db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_ONLYOFFICE_PORT:-5435}:5432"
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ONLYOFFICE_DB_USER:-onlyoffice}"]
      interval: 5s
      timeout: 5s
      retries: 20

  onlyoffice-documentserver:
    image: onlyoffice/documentserver:8.2.2
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres-onlyoffice
      DB_PORT: 5432
      DB_NAME: ${ONLYOFFICE_DB_NAME:-onlyoffice}
      DB_USER: ${ONLYOFFICE_DB_USER:-onlyoffice}
      DB_PWD: ${ONLYOFFICE_DB_PASSWORD:-devonly-changeme-onlyoffice-db}
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-devonly-changeme-onlyoffice-jwt}
      # cf. etude 2.7 : evenements onRequestUsers / onRequestSendNotify
      # (mentions) consommes par connectors/onlyoffice-mentions.
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
    ports:
      - "${ONLYOFFICE_PORT:-8083}:80"
    depends_on:
      postgres-onlyoffice:
        condition: service_healthy
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck | grep -q true || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------
  # Taches : Vikunja (etude 1.6)
  # ---------------------------------------------------------------------
  vikunja:
    image: vikunja/vikunja:0.24.3
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT_SECRET:-devonly-changeme-vikunja-jwt}
      VIKUNJA_SERVICE_PUBLICURL: "http://localhost:${VIKUNJA_PORT:-3456}/"
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      # Base dediee simplifiee en sqlite pour ce tier dev/test allege - la
      # cible de production utilise Postgres/MySQL (helm values, cf. mapping).
    volumes:
      - vikunja-data:/db
    ports:
      - "${VIKUNJA_PORT:-3456}:3456"
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3456/api/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Partage de fichiers volumineux/ephemere : Gokapi (etude 1.8)
  # ---------------------------------------------------------------------
  gokapi:
    image: f0rc3/gokapi:v1.9.6
    restart: unless-stopped
    environment:
      GOKAPI_PORT: "53842"
      GOKAPI_ADMIN_USER: ${GOKAPI_ADMIN_USER:-admin}
      GOKAPI_ADMIN_PASSWORD: ${GOKAPI_ADMIN_PASSWORD:-devonly-changeme-gokapi-admin}
      # cf. etude 1.8 : E2EE non audite selon l'editeur - a valider avant
      # toute mise en production (point ouvert liste en fin de document).
    volumes:
      - gokapi-data:/app/data
    ports:
      - "${GOKAPI_PORT:-53842}:53842"
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:53842 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Stockage objet : MinIO (etude 2.12, backend PeerTube)
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devonly-changeme-minio-root}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [open365]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Plateforme video : PeerTube (etude 2.12)
  # ---------------------------------------------------------------------
  peertube-db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PEERTUBE_DB_NAME:-peertube}
      POSTGRES_USER: ${PEERTUBE_DB_USER:-peertube}
      POSTGRES_PASSWORD: ${PEERTUBE_DB_PASSWORD:-devonly-changeme-peertube-db}
    volumes:
      - peertube-db-data:/var/lib/postgresql/data
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PEERTUBE_DB_USER:-peertube}"]
      interval: 5s
      timeout: 5s
      retries: 20

  peertube-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    networks: [open365]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  peertube:
    image: chocobozzz/peertube:v6.3.2-bookworm
    restart: unless-stopped
    environment:
      PEERTUBE_DB_HOSTNAME: peertube-db
      PEERTUBE_DB_USERNAME: ${PEERTUBE_DB_USER:-peertube}
      PEERTUBE_DB_PASSWORD: ${PEERTUBE_DB_PASSWORD:-devonly-changeme-peertube-db}
      PEERTUBE_DB_NAME: ${PEERTUBE_DB_NAME:-peertube}
      PEERTUBE_REDIS_HOSTNAME: peertube-redis
      PEERTUBE_WEBSERVER_HOSTNAME: localhost
      PEERTUBE_WEBSERVER_PORT: ${PEERTUBE_PORT:-9002}
      PEERTUBE_WEBSERVER_HTTPS: "false"
      PEERTUBE_ADMIN_EMAIL: ${PEERTUBE_ADMIN_EMAIL:-admin@open365.localhost}
      PEERTUBE_SECRET: ${PEERTUBE_SECRET:-devonly-changeme-peertube-secret}
      # cf. etude 2.12 : ingestion webhook -> connectors/peertube-ingest
    volumes:
      - peertube-data:/data
    ports:
      - "${PEERTUBE_PORT:-9002}:9000"
    depends_on:
      peertube-db:
        condition: service_healthy
      peertube-redis:
        condition: service_healthy
    networks: [open365]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/v1/config >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  # ---------------------------------------------------------------------
  # Reverse proxy / portail applicatif (etude 2.3)
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${CADDY_HTTP_PORT:-10080}:80"
      - "${CADDY_HTTPS_PORT:-10443}:443"
    depends_on:
      - keycloak
      - synapse
      - element
      - seafile
      - onlyoffice-documentserver
      - vikunja
      - gokapi
    networks: [open365]

  # ---------------------------------------------------------------------
  # Centre de notifications unifie (etude 2.1)
  # ---------------------------------------------------------------------
  # Choix documente : pas d'assemblage complet de novu/api + novu/worker +
  # novu/ws + MongoDB + Redis ici. La stack Novu de reference est lourde
  # pour ce tier dev/test rapide, et l'objectif principal de cet
  # environnement est de tester les connecteurs applicatifs (2.1, 2.7, 2.8),
  # pas Novu lui-meme. On utilise donc un mock HTTP minimal (image node
  # officielle) qui expose la meme forme d'API (POST /v1/events/trigger)
  # que consomment ces connecteurs. Pour un test de recette avec le vrai
  # Novu, suivre https://docs.novu.co/self-hosting (chapitre 4.4/5.5,
  # environnement de recette ephemere, pas ce tier dev/test).
  novu-mock:
    image: node:20.17-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "/app/server.js"]
    environment:
      PORT: "3000"
    volumes:
      - ./config/novu-mock/server.js:/app/server.js:ro
    ports:
      - "${NOVU_MOCK_PORT:-13000}:3000"
    networks: [open365]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------
  # Messagerie/agenda : Grommunio - DEV/TEST UNIQUEMENT (etude 1.1 / 4.3)
  # ---------------------------------------------------------------------
  # L'etude (4.3) retient explicitement Grommunio en VM appliance Proxmox
  # pour la PRODUCTION, pas en conteneur : le packaging conteneur officiel
  # (grommunio/gromox-container) est presente par l'editeur lui-meme comme
  # une solution pour des besoins speciaux, pas prete pour la production
  # (bundle nginx/Postfix/gromox/Redis/PHP-FPM sous un seul supervisord).
  # Il est inclus ICI uniquement pour permettre aux tests d'integration
  # (envoi/reception mail, etude 5.5) de s'executer en CI sans VM Proxmox.
  # NE PAS reproduire ce service tel quel en environnement de recette/prod.
  grommunio-dev:
    image: grommunio/gromox-container:core-c9
    restart: unless-stopped
    environment:
      TZ: ${GROMMUNIO_TIMEZONE:-Europe/Paris}
      GROMMUNIO_ADMIN_PASSWORD: ${GROMMUNIO_ADMIN_PASSWORD:-devonly-changeme-grommunio-admin}
    volumes:
      - grommunio-dev-data:/etc/gromox
    ports:
      - "${GROMMUNIO_DEV_HTTP_PORT:-8443}:8443"
    networks: [open365]
    # Pas de healthcheck standard documente pour cette image (usage non
    # recommande en prod par l'editeur lui-meme, cf. commentaire ci-dessus) -
    # wait-for-healthy.sh retombe sur un TCP-check simple pour ce service.

  # ---------------------------------------------------------------------
  # Connecteurs d'integration developpes en propre (etude, chapitre 2)
  # Ces repertoires sont peuples par un autre agent en parallele
  # (connectors/) - les build.context ci-dessous les referencent par
  # anticipation ; ils doivent exister (avec un Dockerfile) avant
  # `docker compose up`. Ports HTTP par defaut arbitraires (pas de valeur
  # imposee par l'etude) - a aligner avec le Dockerfile de chaque connecteur.
  # ---------------------------------------------------------------------
  notification-hub:
    build:
      context: ../connectors/notification-hub
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4001"
      NOVU_API_URL: http://novu-mock:3000
      SYNAPSE_URL: http://synapse:8008
    ports:
      - "${NOTIFICATION_HUB_PORT:-4001}:4001"
    depends_on:
      - novu-mock
      - synapse
    networks: [open365]

  unified-search:
    build:
      context: ../connectors/unified-search
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4002"
      SEAFILE_URL: http://seafile:80
      SYNAPSE_URL: http://synapse:8008
      VIKUNJA_URL: http://vikunja:3456
    ports:
      - "${UNIFIED_SEARCH_PORT:-4002}:4002"
    depends_on:
      - seafile
      - synapse
      - vikunja
    networks: [open365]

  presence-aggregator:
    build:
      context: ../connectors/presence-aggregator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4003"
      SYNAPSE_URL: http://synapse:8008
    ports:
      - "${PRESENCE_AGGREGATOR_PORT:-4003}:4003"
    depends_on:
      - synapse
    networks: [open365]

  onlyoffice-mentions:
    build:
      context: ../connectors/onlyoffice-mentions
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4004"
      NOVU_API_URL: http://novu-mock:3000
      ONLYOFFICE_URL: http://onlyoffice-documentserver:80
    ports:
      - "${ONLYOFFICE_MENTIONS_PORT:-4004}:4004"
    depends_on:
      - novu-mock
      - onlyoffice-documentserver
    networks: [open365]

  peertube-ingest:
    build:
      context: ../connectors/peertube-ingest
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4005"
      PEERTUBE_URL: http://peertube:9000
      MINIO_URL: http://minio:9000
    ports:
      - "${PEERTUBE_INGEST_PORT:-4005}:4005"
    depends_on:
      - peertube
      - minio
    networks: [open365]
