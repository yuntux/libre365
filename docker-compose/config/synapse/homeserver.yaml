# Minimal Synapse configuration for the docker-compose dev/test environment
# (study 1.2 / 4.6). NOT the production configuration (no workers, no real
# federation TLS - see 4.4 for the "workers" mode targeted on Kubernetes).
server_name: "matrix.libre365.localhost"
pid_file: /data/homeserver.pid
public_baseurl: "http://localhost:8008/"

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false

# NB: the Synapse image does not substitute environment variables into a
# homeserver.yaml supplied as-is (unlike docker-compose.yml, which does read
# .env) - these values are therefore hardcoded here as well, and must stay
# aligned with .env.example / .env (dev-only values).
database:
  name: psycopg2
  args:
    user: "synapse"
    password: "devonly-changeme-synapse-db"
    database: "synapse"
    host: postgres-synapse
    port: 5432
    cp_min: 5
    cp_max: 10

# Named volume "synapse-data" (see docker-compose.yml) for media stores
media_store_path: /data/media_store
uploads_path: /data/uploads

# Disabled in dev/test: no real federation with other Matrix servers;
# simplifies CI by not requiring valid federation TLS/DNS.
federation_domain_whitelist: []

registration_shared_secret: "devonly-changeme-synapse-registration"
enable_registration: true
enable_registration_without_verification: true

macaroon_secret_key: "devonly-changeme-synapse-macaroon"
form_secret: "devonly-changeme-synapse-form"

report_stats: false

signing_key_path: "/data/matrix.libre365.localhost.signing.key"

trusted_key_servers:
  - server_name: "matrix.org"

# Application services (Matrix webhook -> notification center, study 2.1)
# to be completed by the connectors agent via a file mounted into
# app_service_config_files once connectors/notification-hub is ready.
app_service_config_files: []

log_config: "/data/log.config"
