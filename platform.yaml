# =============================================================================
# libre365 - single registry of versions, ports, and public domain names.
# =============================================================================
#
# This file is the ONLY authorized source for:
#   - the image tags/versions used by both the development environment
#     (dev-cluster/, study 4.6) and the production target
#     (infra/k8s/helm-values, study 4.4);
#   - the default ports exposed by docker-compose and consumed by the
#     integration test suite (tests/integration/);
#   - the public domain names (`domains:` below) used across
#     infra/k8s/helm-values/*.yaml, infra/k8s/manifests/*.yaml, and the
#     Thunderbird WebExtension manifest — added after the same
#     `sso.libre365.example.org` string was found hardcoded independently in
#     8 different files with no single place to change it (e.g. before
#     pointing the production target at a real bought domain instead of the
#     `example.org` placeholder used throughout this repository).
#
# NEVER edit a tag/port/domain directly in docker-compose.yml,
# infra/k8s/helm-values/*.yaml, infra/k8s/manifests/*.yaml, a connector
# Dockerfile, or tests/integration/_platform_defaults.py: these files are
# (re)generated/patched from this one. Workflow:
#
#   1. Edit platform.yaml
#   2. pip install -r scripts/requirements.txt
#   3. python3 scripts/sync_platform.py        # applies the changes
#   4. Review the diff, commit
#
# CI checks that no manual drift was introduced:
#   python3 scripts/sync_platform.py --check   # fails if a generated file
#                                               # no longer matches this one
#
# See docs/mapping.md for the link to the study office365-exit-study.md.

# -----------------------------------------------------------------------------
# UI language, single source of truth for every component that supports a
# server-side default and/or a supported-locale list (Keycloak's realm
# internationalization, currently the only one actually wired to this -
# see infra/ansible/roles/keycloak_realm/). `default` is what a user sees
# with no browser-language preference or before auto-detection kicks in;
# `available` is the full list a user can switch to.
#
# NOT a claim that every component in this stack actually reads these
# values yet: several (Element Web, Vikunja - both confirmed via their own
# docs/config schemas) already auto-detect the browser's language on their
# own with no server-side setting needed, and several others could not be
# verified against a real config mechanism from this sandboxed environment
# (no live instance, and vendor docs were not conclusive) - see
# docs/i18n.md for the full per-component breakdown and what's actually
# wired versus still open.
# -----------------------------------------------------------------------------
locale:
  default: "fr"
  available: ["fr", "en"]

# Study 4.4, point 2: "a representative test dataset" — the ONE test user
# every integration test (tests/integration/) and staging validation run
# against. Non-secret identity only (username/email); the password is
# NEVER here - it comes from Ansible (vault_keycloak_test_user_password,
# same convention as vault_keycloak_admin_password) or, in the k3d dev
# cluster, a fixed "devonly-changeme-*" value passed by
# dev-cluster/provision-keycloak-dev.sh - see
# infra/ansible/roles/keycloak_realm/README.md. Provisioning this account
# in a real Keycloak realm is OPT-IN (keycloak_realm_test_user_enabled,
# defaults to false) - a fake consultant account must never appear in a
# real production realm by default.
test_dataset:
  username: "test.consultant"
  email: "test.consultant@libre365.test"

# -----------------------------------------------------------------------------
# Generic images reused by several services in docker-compose (avoids
# repeating/letting the same Postgres/Redis/MariaDB tag drift apart in
# 3-5 different places in the file).
# -----------------------------------------------------------------------------
shared:
  postgres: "16.4-alpine"
  redis: "7.4-alpine"
  mariadb: "10.11"
  # Base image for the in-house connectors (connectors/*/Dockerfile): FastAPI +
  # uvicorn/uvloop, chosen for consistency with the rest of the repo (already
  # Python: tests/integration/, scripts/sync_platform.py) and for async
  # performance parity with Node on this I/O-bound webhook/fan-out workload.
  python: "3.12-slim"

# -----------------------------------------------------------------------------
# Application bricks: one entry per brick selected in chapter 1 of the study.
# `version` is the single value propagated to BOTH targets when they share the
# same image publisher; `helm.image_repository` documents the case where the
# production chart republishes the image under a different registry (Bitnami
# in particular) - `version` remains the shared reference even when the
# generated tag differs slightly from the upstream vendor's.
# -----------------------------------------------------------------------------
#
# `ports`: dictionary {EXACT_VARIABLE_NAME: value}, used verbatim in
# docker-compose.yml and .env.example — declared explicitly rather than
# derived by convention, because the historical names don't all follow the
# same scheme (SYNAPSE_CLIENT_PORT, SEAWEEDFS_S3_PORT, CADDY_HTTP_PORT...). This
# guarantees that renaming a variable in platform.yaml shows up immediately in
# the diff instead of being silently inferred.
services:
  keycloak:
    # study 1.7 - deployed via the official Keycloak Operator
    # (infra/k8s/manifests/keycloak.yaml), not the `bitnami/keycloak` Helm
    # chart previously used here: Bitnami moved that image behind a paid
    # "Bitnami Secure Images" subscription, freezing its free history into
    # `bitnamilegacy/keycloak` at 26.3.3. The Operator uses the real,
    # official `quay.io/keycloak/keycloak` image directly (same one the
    # docker-compose dev tier already used), so this value now tracks the
    # real latest Keycloak release with no third-party packaging ceiling.
    version: "26.7.3"
    # Every OIDC app config in this repo builds its issuer/authorization
    # URL as "https://<sso_domain>/realms/<realm_name>" - this used to be
    # a literal "libre365" hand-copied into 7 different files (Vikunja,
    # Synapse, PeerTube, Gokapi, Visio, both oauth2-proxy gates) with
    # nothing keeping them in sync with
    # infra/ansible/roles/keycloak_realm/defaults/main.yml's
    # keycloak_realm_name - a rename there would have silently broken
    # every one of them. scripts/sync_platform.py now patches all 7 from
    # this single value the same way it already does for domains.
    realm_name: "libre365"
    ports: { KEYCLOAK_PORT: 8080 }
    compose:
      image: quay.io/keycloak/keycloak
    helm:
      # Not a Helm values file: the Keycloak Operator CR is a raw manifest
      # (infra/k8s/manifests/keycloak.yaml, see that file's header for why
      # - no Helm chart exists for the Operator's own workload, only for
      # the cluster-scoped controller install, which this `version` value
      # does NOT drive - see that file's comment on keeping the operator
      # install URL's {VERSION} in sync by hand).
      file: infra/k8s/manifests/keycloak.yaml
      image_repository: quay.io/keycloak/keycloak
      raw_image_line: true

  synapse:
    version: "v1.160.0" # study 1.2
    ports: { SYNAPSE_CLIENT_PORT: 8008, SYNAPSE_FEDERATION_PORT: 8448 }
    compose:
      image: matrixdotorg/synapse
    helm:
      file: infra/k8s/helm-values/synapse.yaml
      image_repository: matrixdotorg/synapse
      # ananace-chart/matrix-synapse chart: everything related to Synapse is
      # nested under the `synapse:` root key (workers, oidc, federation...) —
      # the image override follows the same convention rather than a root
      # `.image.tag`, which this chart doesn't have.
      tag_path: synapse.image.tag

  element_web:
    version: "v1.12.27" # study 1.2
    ports: { ELEMENT_PORT: 8081 }
    compose:
      image: vectorim/element-web
    helm:
      file: infra/k8s/helm-values/element-web.yaml
      image_repository: vectorim/element-web
      tag_path: .image.tag

  element_call:
    # study 1.3 - matches the real tag published at
    # ghcr.io/element-hq/element-call.
    version: "v0.25.0"
    compose: null # no dedicated docker-compose service: Element Call is
      # exercised via the MatrixRTC widget embedded in Element Web (1.3), not
      # as a standalone service in the dev/test tier.
    helm:
      file: infra/k8s/helm-values/element-call.yaml
      image_repository: ghcr.io/element-hq/element-call
      tag_path: .image.tag

  element_call_auth:
    # ghcr.io/element-hq/lk-jwt-service - Element Call's own dedicated
    # LiveKit JWT auth service (element-call.yaml's authService.image), a
    # separate upstream repo/image from element-call itself, versioned
    # independently.
    version: "0.6.0"
    compose: null
    helm:
      file: infra/k8s/helm-values/element-call.yaml
      image_repository: ghcr.io/element-hq/lk-jwt-service
      tag_path: authService.image.tag

  visio:
    # study 1.3 - LaSuite Meet (Django backend + frontend), no dedicated
    # docker-compose service at this stage (not yet wired into the dev tier:
    # to add if the Matrix<->Visio widget connector, 2.4, needs local
    # testing). `version` applies to both images, published together on
    # Docker Hub (lasuite/meet-backend + lasuite/meet-frontend).
    version: "v1.30.0"
    compose: null
    helm_images:
      - file: infra/k8s/helm-values/visio-meet.yaml
        image_repository: lasuite/meet-backend
        tag_path: backend.image.tag
      - file: infra/k8s/helm-values/visio-meet.yaml
        image_repository: lasuite/meet-frontend
        tag_path: frontend.image.tag

  seafile:
    # study 1.4. This repo provisions FRESH deployments, not in-place
    # upgrades of an already-running instance: on an already-running
    # instance, Seafile's own upgrade scripts
    # (scripts/upgrade/upgrade_11.0_12.0.sh, upgrade_12.0_13.0.sh) require
    # going through each major version in sequence (no combined jump) -
    # keep that in mind if this value is ever bumped on a live deployment
    # rather than a fresh one.
    version: "13.0.25"
    ports: { SEAFILE_PORT: 8082 }
    compose:
      image: seafileltd/seafile-mc
    helm:
      file: infra/k8s/helm-values/seafile.yaml
      image_repository: seafileltd/seafile-mc
      tag_path: .image.tag

  onlyoffice:
    # study 1.5 - >= 9.4 is a decision explicitly settled by the study
    # (removal of the connection cap, architecture simplification): the
    # dev/test tier was mistakenly running 8.2.2 before platform.yaml was
    # introduced - fixed here, not only in the Helm file.
    version: "9.4"
    ports: { ONLYOFFICE_PORT: 8083 }
    compose:
      image: onlyoffice/documentserver
    helm:
      file: infra/k8s/helm-values/onlyoffice.yaml
      image_repository: onlyoffice/documentserver
      tag_path: .image.tag

  vikunja:
    # study 1.6 - matches the real vikunja/vikunja Docker Hub tag (no "v"
    # prefix). Since 1.0.0-rc0, the OpenID provider config uses a map keyed
    # by an arbitrary provider name rather than a numeric index - see
    # vikunja.yaml's own comments for what that means for this deployment.
    version: "2.6.0"
    ports: { VIKUNJA_PORT: 3456 }
    compose:
      image: vikunja/vikunja
    helm:
      file: infra/k8s/helm-values/vikunja.yaml
      image_repository: vikunja/vikunja
      tag_path: .image.tag

  gokapi:
    # study 1.8 - OIDC is configured non-interactively via
    # infra/k8s/manifests/gokapi.yaml's gokapi-setup-bootstrap
    # initContainer (Gokapi's one-time setup wizard writes config.json, no
    # GOKAPI_OAUTH_* env vars). See that file's header and docs/oidc.md.
    version: "v2.2.4"
    ports: { GOKAPI_PORT: 53842 }
    compose:
      image: f0rc3/gokapi
    helm:
      # No official Helm chart (see infra/k8s/helm-values/README.md): raw
      # Deployment manifest, patched by direct substitution of the `image:`
      # line rather than a structured YAML path.
      file: infra/k8s/manifests/gokapi.yaml
      image_repository: f0rc3/gokapi
      raw_image_line: true

  seaweedfs:
    # study 2.12 - replaces MinIO: the minio/minio project is no longer
    # maintained upstream (moved to source-only distribution, no new
    # community-edition images published since ~Sept 2025). SeaweedFS was
    # chosen over Garage (the other actively-maintained candidate) because
    # Garage has no bucket event notification support at all, which this
    # stack's PeerTube handoff connector (connectors/peertube-ingest)
    # depends on - see infra/k8s/helm-values/seaweedfs.yaml's header for
    # the full comparison.
    version: "4.45"
    # SeaweedFS's own default ports (chart values `s3.port`/`admin.port`,
    # not MinIO's 9000/9001 this replaces).
    ports: { SEAWEEDFS_S3_PORT: 8333, SEAWEEDFS_ADMIN_PORT: 23646 }
    compose:
      image: chrislusf/seaweedfs
    helm:
      file: infra/k8s/helm-values/seaweedfs.yaml
      image_repository: chrislusf/seaweedfs
      tag_path: .image.tag

  peertube:
    # study 2.12 - matches the real chocobozzz/peertube Docker Hub
    # "-bookworm" tag. PeerTube plugin settings (including the OpenID
    # Connect plugin) are DB-backed, not static config - see
    # peertube.yaml's own comment.
    version: "v8.2.4-bookworm"
    ports: { PEERTUBE_PORT: 9002 }
    compose:
      image: chocobozzz/peertube
    helm:
      file: infra/k8s/helm-values/peertube.yaml
      image_repository: chocobozzz/peertube
      tag_path: .image.tag

  caddy:
    # study 2.3 - land on 2.11.2 or later: GHSA-7r4p-vjf4-gxv4 (identity-
    # header injection via forward_auth) is fixed there, and this repo's
    # OnlyOffice/Novu SSO gates rely on forward_auth (study 1.7).
    version: "2.11.4-alpine"
    ports: { CADDY_HTTP_PORT: 10080, CADDY_HTTPS_PORT: 10443 }
    compose:
      image: caddy
    helm: null # infra/k8s/manifests/caddy.yaml uses a custom image (xcaddy
      # build + injection plugin, internal registry): the base Caddy tag
      # baked into it is maintained by hand in that image's build Dockerfile,
      # not here (no `caddy:X` tag directly present in the K8s manifest to
      # synchronize).

  novu:
    # study 2.1 - production notification hub, also deployed as-is (with
    # the infra/k8s/helm-values/dev/novu.yaml dev-hardening overlay) on the
    # k3d dev cluster - see dev-cluster/README.md. No docker-compose service
    # (Novu was never meant to run outside Kubernetes here; a hand-rolled
    # HTTP mock used to fill that gap in docker-compose, replaced once the
    # k3d dev cluster made a real chart deployment available - see the
    # description of the whole dev tier for the tradeoff this closed).
    #
    # [CORRECTED] Novu has NO official Helm chart at all - found while
    # actually running dev-cluster/deploy.sh ("novuhq/helm-charts" 404s, no
    # such repository exists under the novuhq GitHub org). The chart
    # actually used (see infra/k8s/helm-values/novu.yaml's own header) is
    # Nova-Edge/novu-chart, a low-adoption community project that itself
    # disclaims official Novu support, published as an OCI artifact -
    # pinned by NOVU_CHART/NOVU_CHART_VERSION shell variables in
    # dev-cluster/deploy.sh (same pattern as KEYCLOAK_VERSION there), not
    # here: OCI references are pinned by `--version` at install time, not
    # resolved through a repo's own index the way every other chart's
    # `helm repo add` + implicit-latest works.
    # This chart manages the images of its sub-components (api/worker/ws/
    # web) itself, with no single usable `image.tag` field here either: not
    # synchronized by this script.
    ports: { NOVU_API_PORT: 13000 }
    compose: null
    helm: null

  grommunio_dev:
    # [CORRECTED] the image/tag below used to be "grommunio/gromox-container:
    # core-c9" - that repository does not exist on Docker Hub at all (a real
    # `docker compose up` fails immediately with "pull access denied...
    # repository does not exist"), found while actually running this stack.
    # The real image, verified against grommunio/gromox-container's own
    # docker-compose.yml (github.com/grommunio/gromox-container) and Docker
    # Hub's tag list API for grommunio/gromox-core, is "grommunio/gromox-core"
    # - version below is the most recent tag that repository has ever
    # published (verified via the Docker Hub API, not guessed); grommunio only
    # publishes early/experimental tags for this image (0.1 through 0.3, all
    # against openSUSE Leap 15.x base images) - [UNCERTAIN] whether a more
    # current one exists that Docker Hub's public tag-list API doesn't
    # surface, not otherwise verifiable from this sandboxed environment.
    version: "0.3-opensuse-leap-15-4" # dev/test image only, see study 4.3
    ports:
      GROMMUNIO_DEV_HTTP_PORT: 8443
      # Added because the test suite (tests/integration/test_mail_grommunio.py)
      # actually needs SMTP/IMAP reachable on localhost for its send/receive
      # scenario (study 5.5) - the previous version of this file only ever
      # exposed the admin port, so that test could never have passed against
      # this compose stack even once the image name above is fixed.
      GROMMUNIO_DEV_SMTP_PORT: 587
      GROMMUNIO_DEV_IMAP_PORT: 993
    compose:
      image: grommunio/gromox-core
    helm: null # study 4.3: Proxmox VM appliance in production, never a
      # Kubernetes container - no equivalent Helm file to synchronize.

# -----------------------------------------------------------------------------
# In-house connectors (chapter 2): no third-party version tag (built from this
# repo), only the default port is centralized to avoid the drift already
# observed between the dev environment's .env.example and
# tests/integration/conftest.py.
# -----------------------------------------------------------------------------
connector_ports:
  NOTIFICATION_HUB_PORT: 4001
  UNIFIED_SEARCH_PORT: 4002
  PRESENCE_AGGREGATOR_PORT: 4003
  ONLYOFFICE_MENTIONS_PORT: 4004
  PEERTUBE_INGEST_PORT: 4005

# -----------------------------------------------------------------------------
# Cross-cutting app-portal banner (study 2.3) — which apps show in the top-bar
# menu depends on the logged-in user's Keycloak group, read from the `groups`
# claim of the token the banner's own silent-SSO client obtains (see
# infra/ansible/roles/keycloak_realm and connectors/unified-search's
# `/portal/apps` endpoint - GENERATED into that connector's manifest by
# scripts/sync_platform.py, do not hand-edit the env var there).
#
# Every user lands in whichever group has `default: true` unless explicitly
# added to another one. This ships 2 starting groups as a real, working
# example - which roles at the firm actually need more/fewer apps is a
# business decision for the firm to make, not something this repo can
# invent; adjust freely, `apps` values are subdomain keys from `domains.
# subdomains` below.
# -----------------------------------------------------------------------------
portal:
  groups:
    - name: consultants
      default: true
      apps: [chat, files, taches, videos]
    - name: admin-si
      default: false
      apps: [chat, files, taches, videos, sso, seaweedfs_admin, notifications_admin]

# -----------------------------------------------------------------------------
# Services kept on plain docker-compose (never deployed to the k3d dev
# cluster, see dev-cluster/README.md): only Grommunio, for the reason
# already documented in the `grommunio_dev` entry above - a Proxmox VM
# appliance in production, no Kubernetes counterpart to reuse. Novu used to
# be here too (a hand-rolled HTTP mock, before the k3d dev cluster made
# deploying the real chart practical - see the `novu` entry above); nothing
# else currently needs this list. Each chart-backed brique's own
# Postgres/database now lives inside its Helm release in the dev cluster
# (see infra/k8s/helm-values/dev/), so there is no longer a standalone
# dev-tier Postgres port to track here either.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Local Kubernetes dev cluster (k3d), reusing the production Helm
# values/charts (infra/k8s/helm-values/, infra/k8s/manifests/) instead of a
# second, hand-maintained docker-compose definition per brique - see
# dev-cluster/README.md for the full rationale and workflow. Generates
# dev-cluster/k3d-config.yaml (port mappings only; cluster shape/topology is
# fixed directly in that file's template in scripts/sync_platform.py).
#
# Port mappings cover every `services.*.ports` entry EXCEPT `grommunio_dev`
# (stays on docker-compose, see that entry above) plus `connector_ports`
# (the 5 in-house connectors, deployed via infra/k8s/manifests/connectors/).
# The node-port range is widened below the Kubernetes default (30000-32767)
# so these existing port numbers (3456, 4001-4005, 8008-9002, etc.) can be
# used as NodePorts as-is, without remapping them yet again.
# -----------------------------------------------------------------------------
dev_cluster:
  name: libre365-dev
  servers: 1
  agents: 2
  node_port_range: "3000-32767"

# -----------------------------------------------------------------------------
# Public domain names (production target only - the k3d dev cluster and
# docker-compose never use these, see dev-cluster/README.md for how they're
# reached instead: NodePort/localhost or in-cluster Service DNS).
#
# `base` is the one placeholder domain used throughout this repository
# (study doesn't mandate a real one - to be replaced with an actually
# purchased domain before any real production deployment). `subdomains`
# names each service's slot under that base (e.g. `sso` -> the FQDN
# `sso.libre365.example.org`), so a service's own subdomain choice and the
# shared base domain are two independent, single-source values instead of
# the full FQDN being retyped in every Helm values file/manifest that
# references it (Ingress hostname/TLS, OIDC issuer/endpoint URLs, the
# Caddy reverse-proxy routing and its external-dns hostname annotation, the
# Thunderbird extension's WebExtension ID, external-dns's domainFilters).
#
# Patching mechanism (scripts/sync_platform.py, sub_domain()): anchored on
# the SUBDOMAIN label (e.g. "sso"), never on the previously-generated base -
# same principle as image tag patching being anchored on the repository
# name, not the previous tag. This means changing `base` here propagates
# everywhere on the next sync, repeatably. It does NOT support renaming a
# subdomain label itself (e.g. changing `sso` to `auth`): the script has no
# record of what a service's PREVIOUS subdomain was, so it cannot find and
# rename existing occurrences - that kind of change still has to be made by
# hand across the files listed in DOMAIN_TARGET_FILES, with this file
# updated to match afterwards.
# -----------------------------------------------------------------------------
domains:
  base: "libre365.example.org"
  subdomains:
    mail: mail # Grommunio (study 1.1/4.3) - NOT Caddy-fronted (Proxmox VM
      # appliance, not a Kubernetes Service) - consumed directly by
      # infra/ansible/group_vars/all.yml, not by anything under
      # infra/k8s/. Listed in scripts/sync_platform.py's
      # DOMAINS_WITHOUT_CADDY_SITE for that reason, same as `registry`.
    autodiscover: autodiscover # Microsoft Autodiscover protocol (study 1.9)
      # - Outlook/EAS-style clients resolve account settings against
      # Grommunio's own Exchange emulation here. Same reasoning as `mail`:
      # NOT Caddy-fronted, since Grommunio terminates its own HTTPS
      # certificate for this hostname too (a CNAME to `mail.<base>` is the
      # simplest way to populate it - see docs/clients.md). Listed in
      # DOMAINS_WITHOUT_CADDY_SITE for that reason.
    autoconfig: autoconfig # Mozilla autoconfig (config-v1.1.xml) for
      # Thunderbird (study 1.9) - via Caddy, static file
      # (infra/k8s/manifests/caddy.yaml). See docs/clients.md.
    sso: sso # Keycloak (study 1.7)
    matrix: matrix # Synapse client/federation (study 1.2)
    chat: chat # Element Web, via Caddy (study 1.2/2.3)
    call: call # Element Call (study 1.3)
    visio: visio # LaSuite Meet (study 1.3)
    livekit: livekit # Shared SFU backend for Visio/Element Call (study 1.3)
    files: files # Seafile, via Caddy (study 1.4/2.3)
    office: office # OnlyOffice Document Server, via Caddy (study 1.5/2.3)
    taches: taches # Vikunja, via Caddy (study 1.6/2.3)
    depot: depot # Gokapi, via Caddy (study 1.8/2.3)
    onboarding: onboarding # Static onboarding portal, no injection (study 2.5)
    videos: videos # PeerTube, via Caddy (study 2.12/2.3)
    s3: s3 # SeaweedFS S3 API (study 2.12)
    seaweedfs_admin: seaweedfs-admin # SeaweedFS Admin UI (study 2.12)
    portal_api: api # App-portal banner's own backend (study 2.3) - Caddy
      # site path-routing to unified-search's /search+/portal, notification-
      # hub's /widget/session and presence-aggregator's /presence, none of
      # which had a public route before the banner needed to reach them
      # directly from the browser.
    notifications: notifications # Novu (study 2.1)
    notifications_admin: notifications-admin # Novu admin dashboard (study 1.7/2.1)
      # - Novu's own `web` UI (template/workflow management), gated by
      # Keycloak SSO via the oauth2-proxy forward_auth gate in front of it
      # (infra/k8s/helm-values/oauth2-proxy-novu.yaml) - separate from
      # `notifications` above, which is the API consumed by the top-bar
      # widget's own HMAC subscriberHash auth and must stay reachable
      # without an interactive Keycloak login. See docs/oidc.md.
    registry: registry # Internal image registry (custom Caddy image, study 2.3)
