[pytest]
# Placed in tests/integration/ (and not at the repo root) because this
# suite remains under the sole responsibility of tests/integration/: run
# pytest from this directory (or with `-c tests/integration/pytest.ini`)
# for this configuration to be picked up. See README.md for the full
# launch commands.

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: minimal critical scenario, replayed first / most often (study 4.5).
    slow: longer scenario (asynchronous convergence wait, network polling).
    sso: end-to-end SSO authentication scenario via Keycloak (study 4.5).

# Default timeout when a test does not declare its own (pytest-timeout):
# avoids a service that failed to start hanging the whole suite instead of
# failing cleanly (a constraint of this task).
timeout = 180
timeout_method = thread

addopts =
    --strict-markers
    -ra

# Generates the HTML results report (success/failure per scenario), which
# conditions the decision to promote to production (study 4.5, line 797).
# The file name is reused/displayed by the ephemeral staging CI/CD pipeline
# (see README.md).
# Uncomment to enable by default without passing the option on the command
# line (left commented here to avoid imposing pytest-html when it is absent
# in a quick development environment):
# addopts = --html=report.html --self-contained-html
