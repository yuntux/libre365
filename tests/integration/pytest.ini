[pytest]
# Placé dans tests/integration/ (et non à la racine du dépôt) car cette
# suite reste sous la seule responsabilité de tests/integration/: lancer
# pytest depuis ce répertoire (ou avec `-c tests/integration/pytest.ini`)
# pour que cette configuration soit prise en compte. Voir README.md pour les
# commandes de lancement complètes.

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: scénario critique minimal, rejoué en premier / le plus souvent (étude 4.5).
    slow: scénario plus long (attente de convergence asynchrone, sondage réseau).
    sso: scénario d'authentification SSO bout en bout via Keycloak (étude 4.5).

# Timeout par défaut si un test n'en déclare pas explicitement le sien
# (pytest-timeout): évite qu'un service non démarré fasse pendre la suite
# indéfiniment plutôt que d'échouer proprement (contrainte de la tâche).
timeout = 180
timeout_method = thread

addopts =
    --strict-markers
    -ra

# Génération du rapport HTML de résultats (succès/échec par scénario), qui
# conditionne la décision de promotion vers la production (étude 4.5, ligne
# 797). Le nom de fichier est repris/affiché par le pipeline CI/CD de
# recette éphémère (voir README.md).
# Décommenter pour activer par défaut sans passer l'option en ligne de
# commande (laissé en commentaire ici pour ne pas imposer pytest-html si
# absent en environnement de développement rapide):
# addopts = --html=report.html --self-contained-html
