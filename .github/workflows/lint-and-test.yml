name: Lint & test

# "Baseline" pipeline of the CI/CD chain described in chapter 5 of the study
# (office365-exit-study.md, lines 769-802): this is the first link of
# "monitoring for new versions -> ephemeral staging -> promotion" (5.3/5.4),
# applied here to every code change rather than to a new component version
# detected by Renovate (see renovate.json and ephemeral-staging.yml for the
# rest of the cycle).
#
# The repo is populated in parallel by several teams/agents working on
# infra/, connectors/, docker-compose/ and tests/integration/: each job
# therefore checks for the existence of its own scope before running and
# never fails solely because a subdirectory does not exist yet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/terraform
        id: check
        run: |
          if [ -d "infra/terraform" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/terraform not present yet (directory still being populated) - job skipped."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init (backend-less, validation only)
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false
        continue-on-error: true

      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/ansible
        id: check
        run: |
          if [ -d "infra/ansible" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/ansible not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        if: steps.check.outputs.present == 'true'
        run: pip install "ansible-lint>=6.22,<7" "ansible-core>=2.15,<2.17"

      - name: ansible-lint infra/ansible
        if: steps.check.outputs.present == 'true'
        run: ansible-lint infra/ansible
        continue-on-error: true

  helm-values-yamllint:
    name: yamllint Helm values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s
        id: check
        run: |
          if [ -d "infra/k8s" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        if: steps.check.outputs.present == 'true'
        run: pip install "yamllint>=1.35,<2"

      - name: yamllint infra/k8s
        if: steps.check.outputs.present == 'true'
        # Permissive config (no versioned .yamllint enforced here): this
        # mainly checks the syntactic validity of the Helm values, not style.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' infra/k8s

  connectors:
    name: Node connectors (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & test each connector
        run: |
          set -e
          if [ ! -d "connectors" ]; then
            echo "::notice::connectors/ not present yet - job skipped."
            exit 0
          fi
          found=0
          for pkg in connectors/*/package.json; do
            [ -e "$pkg" ] || continue
            found=1
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (
              cd "$dir"
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              npm run build --if-present
              npm test --if-present
            )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No connector (package.json) found under connectors/*/ - job skipped."
          fi

  docker-compose-config:
    name: docker-compose syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          set -e
          compose_file="docker-compose/docker-compose.yml"
          if [ ! -f "$compose_file" ]; then
            echo "::notice::$compose_file not present yet - job skipped."
            exit 0
          fi
          docker compose -f "$compose_file" config

  platform-drift-check:
    name: Version/port drift (platform.yaml)
    runs-on: ubuntu-latest
    # platform.yaml (repo root) is the single source of truth for the image
    # tags and ports shared by docker-compose/ AND infra/k8s/helm-values/
    # (see its header). This job guarantees that none of these consuming
    # files was hand-edited without going back through
    # `scripts/sync_platform.py` — otherwise the dev/test tier and the
    # production target would silently drift apart, exactly the risk
    # platform.yaml exists to eliminate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for platform.yaml
        id: check
        run: |
          if [ -f "platform.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::platform.yaml not present yet - job skipped."
          fi

      - name: Install scripts/requirements.txt
        if: steps.check.outputs.present == 'true'
        run: pip install -r scripts/requirements.txt

      - name: sync_platform.py --check
        if: steps.check.outputs.present == 'true'
        run: python3 scripts/sync_platform.py --check
