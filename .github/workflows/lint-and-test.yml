name: Lint & test

# "Baseline" pipeline of the CI/CD chain described in chapter 5 of the study
# (office365-exit-study.md, lines 769-802): this is the first link of
# "monitoring for new versions -> ephemeral staging -> promotion" (5.3/5.4),
# applied here to every code change rather than to a new component version
# detected by Renovate (see renovate.json and ephemeral-staging.yml for the
# rest of the cycle).
#
# The repo is populated in parallel by several teams/agents working on
# infra/, connectors/, docker-compose/ and tests/integration/: each job
# therefore checks for the existence of its own scope before running and
# never fails solely because a subdirectory does not exist yet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/terraform
        id: check
        run: |
          if [ -d "infra/terraform" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/terraform not present yet (directory still being populated) - job skipped."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init (backend-less, validation only)
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false
        continue-on-error: true

      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/ansible
        id: check
        run: |
          if [ -d "infra/ansible" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/ansible not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        if: steps.check.outputs.present == 'true'
        run: pip install "ansible-lint>=6.22,<7" "ansible-core>=2.15,<2.17"

      - name: Install Galaxy collections
        if: steps.check.outputs.present == 'true'
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      # Run from infra/ansible (not the repo root) so that ansible.cfg's
      # `roles_path = roles` resolves the same way it does for a real
      # ansible-playbook invocation (see infra/ansible/README.md) - running
      # `ansible-lint infra/ansible` from the repo root left ansible.cfg
      # undiscovered and made the `keycloak_realm` role unresolvable.
      - name: ansible-lint
        if: steps.check.outputs.present == 'true'
        working-directory: infra/ansible
        run: ansible-lint .

  helm-values-yamllint:
    name: yamllint Helm values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s
        id: check
        run: |
          if [ -d "infra/k8s" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        if: steps.check.outputs.present == 'true'
        run: pip install "yamllint>=1.35,<2"

      - name: yamllint infra/k8s
        if: steps.check.outputs.present == 'true'
        # Permissive config (no versioned .yamllint enforced here): this
        # mainly checks the syntactic validity of the Helm values, not style.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' infra/k8s

  helm-template-validate:
    name: helm template Helm values against their real charts
    runs-on: ubuntu-latest
    # [ADDED] the yamllint job above only ever checked generic YAML syntax,
    # never that a values file's keys actually exist in the chart it's
    # meant for - an entire class of bug (a wrong chart name, a key nested
    # under a fictional parent, a required field missing) only ever
    # surfaced when a live user actually ran `helm install` on a real
    # cluster (dev-cluster/deploy.sh), several times over in a single
    # evening. `helm template` renders a chart fully offline (no cluster
    # needed) and fails loudly on exactly those errors, so this job is
    # the same check, just running here instead of on someone's VM.
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s/helm-values
        id: check
        run: |
          if [ -d "infra/k8s/helm-values" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s/helm-values not present yet - job skipped."
          fi

      - name: Install helm
        if: steps.check.outputs.present == 'true'
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        if: steps.check.outputs.present == 'true'
        # Same repos/URLs as dev-cluster/deploy.sh's own "5/14 Helm repos"
        # step - kept in sync by hand (both are a handful of lines, no
        # single source of truth exists yet for this list). The
        # `|| true` on the 3 "to be confirmed" repos matches deploy.sh's
        # own reasoning in that step's comment: if one of these moved, the
        # `helm template` calls below fail loudly instead, which is the
        # point of this job.
        run: |
          helm repo add ananace-charts https://ananace.gitlab.io/charts
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add seaweedfs https://seaweedfs.github.io/seaweedfs/helm
          helm repo add seafile-charts https://haiwen.github.io/seafile-helm-chart/repo || true
          helm repo add onlyoffice https://download.onlyoffice.com/charts/stable || true
          helm repo add peertube-helm https://zendet.github.io/peertube-helm/ || true
          helm repo add external-dns https://kubernetes-sigs.github.io/external-dns/
          helm repo add openbao https://openbao.github.io/openbao-helm/ || true
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
          helm repo update

      - name: helm template every release against its real chart
        if: steps.check.outputs.present == 'true'
        working-directory: infra/k8s/helm-values
        # One entry per real `helm upgrade --install` in
        # dev-cluster/deploy.sh's "8/14 Helm releases" step (plus
        # openbao/external-secrets/oauth2-proxy from steps 6/7/13) -
        # `release|chart|version|values-files` (comma-separated, applied in
        # order, mirroring `-f a.yaml -f b.yaml`). NOT included:
        # element-call.yaml/visio-meet.yaml/vikunja.yaml - documented in
        # README.md as "no official chart confirmed to exist" placeholders,
        # not actually `helm upgrade --install`-ed anywhere yet.
        run: |
          set -euo pipefail
          releases=(
            "openbao|openbao/openbao||openbao.yaml,dev/openbao.yaml"
            "external-secrets|external-secrets/external-secrets||external-secrets.yaml,dev/external-secrets.yaml"
            "keycloak-postgres|bitnami/postgresql||keycloak-postgres.yaml,dev/keycloak-postgres.yaml"
            "synapse|ananace-charts/matrix-synapse||synapse.yaml,dev/synapse.yaml"
            "synapse|ananace-charts/matrix-synapse||synapse.yaml,synapse-100.yaml"
            "synapse|ananace-charts/matrix-synapse||synapse.yaml,synapse-2000.yaml"
            "element-web|ananace-charts/element-web||element-web.yaml,dev/element-web.yaml"
            "seafile-mysql|bitnami/mysql||seafile-mysql.yaml,dev/seafile-mysql.yaml"
            "seafile-memcached|bitnami/memcached||seafile-memcached.yaml,dev/seafile-memcached.yaml"
            "seafile|seafile-charts/ce||seafile.yaml,dev/seafile.yaml"
            "onlyoffice|onlyoffice/docs||onlyoffice.yaml,dev/onlyoffice.yaml"
            "onlyoffice|onlyoffice/docs||onlyoffice.yaml,onlyoffice-100.yaml"
            "onlyoffice|onlyoffice/docs||onlyoffice.yaml,onlyoffice-2000.yaml"
            "seaweedfs|seaweedfs/seaweedfs||seaweedfs.yaml,dev/seaweedfs.yaml"
            "peertube|peertube-helm/peertube||peertube.yaml,dev/peertube.yaml"
            "novu|oci://ghcr.io/nova-edge/charts/novu|0.2.1|novu.yaml,dev/novu.yaml"
            "external-dns|external-dns/external-dns||external-dns.yaml,dev/external-dns.yaml"
            "oauth2-proxy-onlyoffice|oauth2-proxy/oauth2-proxy||oauth2-proxy-onlyoffice.yaml"
            "oauth2-proxy-novu|oauth2-proxy/oauth2-proxy||oauth2-proxy-novu.yaml"
          )
          fail=0
          for entry in "${releases[@]}"; do
            IFS='|' read -r release chart version files <<<"$entry"
            f_args=()
            IFS=',' read -ra file_list <<<"$files"
            for f in "${file_list[@]}"; do
              f_args+=(-f "$f")
            done
            version_args=()
            [ -n "$version" ] && version_args=(--version "$version")
            echo "::group::helm template ${release} ${chart} (${files})"
            if ! helm template "$release" "$chart" "${version_args[@]}" "${f_args[@]}" >/dev/null; then
              echo "::error::helm template failed for release '${release}' (${chart}, ${files})"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  connectors:
    name: Python connectors (install + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Each connector (notification-hub, unified-search, presence-aggregator,
      # onlyoffice-mentions, peertube-ingest) is a self-contained FastAPI app
      # with its own requirements.txt - see connectors/README.md. Excludes
      # thunderbird-filelink-gokapi, a Thunderbird WebExtension (plain JS, not
      # a backend service), which this job never touches.
      - name: Install & test each connector
        run: |
          set -e
          if [ ! -d "connectors" ]; then
            echo "::notice::connectors/ not present yet - job skipped."
            exit 0
          fi
          found=0
          for req in connectors/*/requirements.txt; do
            [ -e "$req" ] || continue
            found=1
            dir=$(dirname "$req")
            echo "::group::$dir"
            (
              cd "$dir"
              python -m venv .venv
              . .venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
              python -c "import app.main" # import smoke test: catches broken FastAPI wiring early
              pytest
            )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No connector (requirements.txt) found under connectors/*/ - job skipped."
          fi

  docker-compose-config:
    name: docker-compose syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          set -e
          compose_file="dev-cluster/grommunio-dev/docker-compose.yml"
          if [ ! -f "$compose_file" ]; then
            echo "::notice::$compose_file not present yet - job skipped."
            exit 0
          fi
          docker compose -f "$compose_file" config

  grommunio-dev-boot-smoke:
    name: grommunio-dev boot smoke test
    runs-on: ubuntu-latest
    # `docker compose config` above only resolves YAML/variable interpolation
    # - it never contacts a registry, so a renamed/nonexistent image (or an
    # image that boots but immediately crash-loops on a missing/wrong env
    # var) passed that check without ever being caught by CI, found instead
    # by a real deployment on a live machine (grommunio/gromox-container
    # never existed as a Docker Hub repository). This job actually pulls and
    # boots the real containers to catch that whole bug class going forward
    # - cheap enough for a standard runner (2 small containers: MariaDB +
    # gromox-core), unlike a full dev-cluster/deploy.sh run (see
    # ephemeral-staging.yml's own comment on why THAT stays manual/
    # workflow_dispatch: it needs far more RAM than a standard GitHub-hosted
    # runner reliably offers).
    #
    # Deliberately does NOT run tests/integration/test_mail_grommunio.py's
    # real send/receive scenario here: that test's IMAPS/STARTTLS connection
    # uses Python's default (certificate-verifying) SSLContext, which
    # rejects this container's self-signed certificate - a separate,
    # already-flagged gap (see docker-compose.yml's own comment) independent
    # of what this job checks for (the containers actually starting and
    # staying healthy).
    steps:
      - uses: actions/checkout@v4

      - name: Check for dev-cluster/grommunio-dev
        id: check
        run: |
          if [ -f "dev-cluster/grommunio-dev/docker-compose.yml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev-cluster/grommunio-dev/docker-compose.yml not present yet - job skipped."
          fi

      - name: Boot grommunio-dev and wait for it to become healthy
        if: steps.check.outputs.present == 'true'
        working-directory: dev-cluster/grommunio-dev
        run: |
          set -e
          cp .env.example .env
          docker compose up -d
          ./scripts/wait-for-healthy.sh 180

      - name: Dump logs on failure
        if: steps.check.outputs.present == 'true' && failure()
        working-directory: dev-cluster/grommunio-dev
        run: docker compose logs --tail=200

      - name: Tear down
        if: steps.check.outputs.present == 'true' && always()
        working-directory: dev-cluster/grommunio-dev
        run: docker compose down -v

  k8s-manifests-validate:
    name: k8s manifests schema validation
    runs-on: ubuntu-latest
    # Structural/schema validation without needing a live cluster -
    # complements helm-values-yamllint above (which only checks generic YAML
    # syntax, not that a manifest is a structurally valid Kubernetes object)
    # for the raw manifests introduced by the k3d dev cluster
    # (infra/k8s/manifests/connectors/, infra/k8s/manifests/dev/) plus the
    # pre-existing ones.
    #
    # Uses kubeconform rather than `kubectl apply --dry-run=client`: the
    # latter still performs API discovery against a live server even in
    # dry-run mode (confirmed by this job's own first, failing version -
    # `kubectl apply --dry-run=client --validate=false` on a GitHub-hosted
    # runner with no cluster still fails with "connect: connection
    # refused"), so it cannot validate manifests fully offline. kubeconform
    # is a standalone schema validator built for exactly this: it ships/
    # fetches the upstream Kubernetes JSON schemas itself and never talks to
    # a cluster.
    #
    # Helm charts themselves (infra/k8s/helm-values/) aren't
    # `helm template`-able here: several are third-party charts hosted on
    # repos this environment has no guaranteed access to in a locked-down CI
    # runner - out of scope for this job, see dev-cluster/README.md for the
    # caveats already documented around those charts.
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s/manifests
        id: check
        run: |
          if [ -d "infra/k8s/manifests" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s/manifests not present yet - job skipped."
          fi

      - name: Install kubeconform
        if: steps.check.outputs.present == 'true'
        run: |
          curl -sSL -o kubeconform.tgz "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform.tgz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: kubeconform on every raw manifest
        if: steps.check.outputs.present == 'true'
        # -ignore-missing-schemas: this directory also carries
        # ExternalSecret/ClusterSecretStore CRDs (external-secrets.io) that
        # kubeconform has no built-in schema for - skipped rather than
        # failed, since kubeconform can only validate structure, not fetch
        # a CRD's schema from a live cluster (which would defeat the
        # "fully offline" point of using kubeconform at all, see above).
        run: kubeconform -strict -ignore-missing-schemas -summary $(find infra/k8s/manifests -name '*.yaml')

  platform-drift-check:
    name: Version/port drift (platform.yaml)
    runs-on: ubuntu-latest
    # platform.yaml (repo root) is the single source of truth for the image
    # tags and ports shared by dev-cluster/grommunio-dev/ AND infra/k8s/helm-values/
    # (see its header). This job guarantees that none of these consuming
    # files was hand-edited without going back through
    # `scripts/sync_platform.py` — otherwise the dev/test tier and the
    # production target would silently drift apart, exactly the risk
    # platform.yaml exists to eliminate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for platform.yaml
        id: check
        run: |
          if [ -f "platform.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::platform.yaml not present yet - job skipped."
          fi

      - name: Install scripts/requirements.txt
        if: steps.check.outputs.present == 'true'
        run: pip install -r scripts/requirements.txt

      - name: sync_platform.py --check
        if: steps.check.outputs.present == 'true'
        run: python3 scripts/sync_platform.py --check

  scripts-unit-tests:
    name: scripts/ unit tests
    runs-on: ubuntu-latest
    # Offline tests for scripts/*.py that don't fit sync_platform.py's own
    # --check invocation above (e.g. security_feeds.py's Atom/RSS parsing
    # and dedup-marker logic, study 5.2) - fixture-based, no network calls.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install pytest
          pip install -r scripts/requirements.txt

      - name: pytest scripts/
        run: pytest scripts/
