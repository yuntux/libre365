name: Lint & test

# "Baseline" pipeline of the CI/CD chain described in chapter 5 of the study
# (office365-exit-study.md, lines 769-802): this is the first link of
# "monitoring for new versions -> ephemeral staging -> promotion" (5.3/5.4),
# applied here to every code change rather than to a new component version
# detected by Renovate (see renovate.json and ephemeral-staging.yml for the
# rest of the cycle).
#
# The repo is populated in parallel by several teams/agents working on
# infra/, connectors/, docker-compose/ and tests/integration/: each job
# therefore checks for the existence of its own scope before running and
# never fails solely because a subdirectory does not exist yet.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/terraform
        id: check
        run: |
          if [ -d "infra/terraform" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/terraform not present yet (directory still being populated) - job skipped."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init (backend-less, validation only)
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false
        continue-on-error: true

      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/ansible
        id: check
        run: |
          if [ -d "infra/ansible" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/ansible not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        if: steps.check.outputs.present == 'true'
        run: pip install "ansible-lint>=6.22,<7" "ansible-core>=2.15,<2.17"

      - name: Install Galaxy collections
        if: steps.check.outputs.present == 'true'
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      # Run from infra/ansible (not the repo root) so that ansible.cfg's
      # `roles_path = roles` resolves the same way it does for a real
      # ansible-playbook invocation (see infra/ansible/README.md) - running
      # `ansible-lint infra/ansible` from the repo root left ansible.cfg
      # undiscovered and made the `keycloak_realm` role unresolvable.
      - name: ansible-lint
        if: steps.check.outputs.present == 'true'
        working-directory: infra/ansible
        run: ansible-lint .

  helm-values-yamllint:
    name: yamllint Helm values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s
        id: check
        run: |
          if [ -d "infra/k8s" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s not present yet - job skipped."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        if: steps.check.outputs.present == 'true'
        run: pip install "yamllint>=1.35,<2"

      - name: yamllint infra/k8s
        if: steps.check.outputs.present == 'true'
        # Permissive config (no versioned .yamllint enforced here): this
        # mainly checks the syntactic validity of the Helm values, not style.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' infra/k8s

  connectors:
    name: Python connectors (install + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Each connector (notification-hub, unified-search, presence-aggregator,
      # onlyoffice-mentions, peertube-ingest) is a self-contained FastAPI app
      # with its own requirements.txt - see connectors/README.md. Excludes
      # thunderbird-filelink-gokapi, a Thunderbird WebExtension (plain JS, not
      # a backend service), which this job never touches.
      - name: Install & test each connector
        run: |
          set -e
          if [ ! -d "connectors" ]; then
            echo "::notice::connectors/ not present yet - job skipped."
            exit 0
          fi
          found=0
          for req in connectors/*/requirements.txt; do
            [ -e "$req" ] || continue
            found=1
            dir=$(dirname "$req")
            echo "::group::$dir"
            (
              cd "$dir"
              python -m venv .venv
              . .venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
              python -c "import app.main" # import smoke test: catches broken FastAPI wiring early
              pytest
            )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::No connector (requirements.txt) found under connectors/*/ - job skipped."
          fi

  docker-compose-config:
    name: docker-compose syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          set -e
          compose_file="docker-compose/docker-compose.yml"
          if [ ! -f "$compose_file" ]; then
            echo "::notice::$compose_file not present yet - job skipped."
            exit 0
          fi
          docker compose -f "$compose_file" config

  k8s-manifests-dry-run:
    name: k8s manifests client-side validation
    runs-on: ubuntu-latest
    # Client-side only (`--dry-run=client`): validates YAML/schema syntax
    # without needing a live cluster - complements helm-values-yamllint
    # above (which only checks generic YAML syntax, not that a manifest is a
    # structurally valid Kubernetes object) for the raw manifests
    # introduced by the k3d dev cluster (infra/k8s/manifests/connectors/,
    # infra/k8s/manifests/dev/) plus the pre-existing ones. Helm charts
    # themselves (infra/k8s/helm-values/) aren't `helm template`-able here:
    # several are third-party charts hosted on repos this environment has
    # no guaranteed access to in a locked-down CI runner - out of scope for
    # this fast syntax-only job, see dev-cluster/README.md for the caveats
    # already documented around those charts.
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s/manifests
        id: check
        run: |
          if [ -d "infra/k8s/manifests" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s/manifests not present yet - job skipped."
          fi

      - name: Set up kubectl
        if: steps.check.outputs.present == 'true'
        uses: azure/setup-kubectl@v4

      - name: kubectl apply --dry-run=client for every raw manifest
        if: steps.check.outputs.present == 'true'
        run: |
          set -e
          for f in $(find infra/k8s/manifests -name '*.yaml'); do
            echo "::group::$f"
            kubectl apply --dry-run=client --validate=true -f "$f"
            echo "::endgroup::"
          done

  platform-drift-check:
    name: Version/port drift (platform.yaml)
    runs-on: ubuntu-latest
    # platform.yaml (repo root) is the single source of truth for the image
    # tags and ports shared by docker-compose/ AND infra/k8s/helm-values/
    # (see its header). This job guarantees that none of these consuming
    # files was hand-edited without going back through
    # `scripts/sync_platform.py` — otherwise the dev/test tier and the
    # production target would silently drift apart, exactly the risk
    # platform.yaml exists to eliminate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for platform.yaml
        id: check
        run: |
          if [ -f "platform.yaml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::platform.yaml not present yet - job skipped."
          fi

      - name: Install scripts/requirements.txt
        if: steps.check.outputs.present == 'true'
        run: pip install -r scripts/requirements.txt

      - name: sync_platform.py --check
        if: steps.check.outputs.present == 'true'
        run: python3 scripts/sync_platform.py --check
