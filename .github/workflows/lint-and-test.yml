name: Lint & test

# Pipeline "socle" de la chaine CI/CD decrite au chapitre 5 de l'etude
# (sortie-office365-etude.md, lignes 769-802) : c'est le premier maillon de
# "veille sur les nouvelles versions -> recette ephemere -> promotion"
# (5.3/5.4), applique ici a chaque changement de code plutot qu'a une nouvelle
# version de brique detectee par Renovate (voir renovate.json et
# ephemeral-staging.yml pour la suite du cycle).
#
# Le depot est peuple en parallele par plusieurs equipes/agents sur
# infra/, connectors/, docker-compose/ et tests/integration/ : chaque job
# verifie donc l'existence de son propre perimetre avant de s'executer et
# n'echoue jamais uniquement parce qu'un sous-repertoire n'existe pas encore.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/terraform
        id: check
        run: |
          if [ -d "infra/terraform" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/terraform absent pour l'instant (repertoire en cours de peuplement) - job ignore."
          fi

      - name: Setup Terraform
        if: steps.check.outputs.present == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: terraform init (backend-less, validation seulement)
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false
        continue-on-error: true

      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        working-directory: infra/terraform
        run: terraform validate

  ansible-lint:
    name: Ansible lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/ansible
        id: check
        run: |
          if [ -d "infra/ansible" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/ansible absent pour l'instant - job ignore."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        if: steps.check.outputs.present == 'true'
        run: pip install "ansible-lint>=6.22,<7" "ansible-core>=2.15,<2.17"

      - name: ansible-lint infra/ansible
        if: steps.check.outputs.present == 'true'
        run: ansible-lint infra/ansible
        continue-on-error: true

  helm-values-yamllint:
    name: yamllint values Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for infra/k8s
        id: check
        run: |
          if [ -d "infra/k8s" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::infra/k8s absent pour l'instant - job ignore."
          fi

      - name: Set up Python
        if: steps.check.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        if: steps.check.outputs.present == 'true'
        run: pip install "yamllint>=1.35,<2"

      - name: yamllint infra/k8s
        if: steps.check.outputs.present == 'true'
        # Config permissive (pas de .yamllint versionne impose ici) : on
        # verifie surtout la validite syntaxique des values Helm, pas le style.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' infra/k8s

  connectors:
    name: Connecteurs Node (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & test each connector
        run: |
          set -e
          if [ ! -d "connectors" ]; then
            echo "::notice::connectors/ absent pour l'instant - job ignore."
            exit 0
          fi
          found=0
          for pkg in connectors/*/package.json; do
            [ -e "$pkg" ] || continue
            found=1
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            (
              cd "$dir"
              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              npm run build --if-present
              npm test --if-present
            )
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice::Aucun connecteur (package.json) trouve sous connectors/*/ - job ignore."
          fi

  docker-compose-config:
    name: Validation syntaxique docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: |
          set -e
          compose_file="docker-compose/docker-compose.yml"
          if [ ! -f "$compose_file" ]; then
            echo "::notice::$compose_file absent pour l'instant - job ignore."
            exit 0
          fi
          docker compose -f "$compose_file" config
