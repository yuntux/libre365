name: Consolidated dashboard

# Implements study 5.6 (lines 800-802): "A single dashboard consolidating:
# open vulnerabilities per component, current versions vs. available
# versions per component, results of the latest acceptance runs, health
# status (technical monitoring) of each component in production."
#
# scripts/build_dashboard.py gathers the first three from platform.yaml,
# the GitHub Code Scanning API (Trivy findings, cve-scan.yml) and the
# GitHub Actions API (latest ephemeral-staging.yml run); the fourth
# (production health) has no live target to report from in this
# infrastructure-as-code case study and is reported as unavailable rather
# than fabricated (see the script's own header and docs/ci-cd.md).
#
# Published to GitHub Pages - enable it once under Settings > Pages >
# "GitHub Actions" as the source for this to actually go live.

on:
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  actions: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scripts/requirements.txt
        run: pip install -r scripts/requirements.txt

      - name: Build the static dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_dashboard.py --output-dir dashboard-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
