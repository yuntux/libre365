name: Ephemeral staging (manual)

# Implements study 5.4 "Automatically triggering a staging environment"
# (lines 786-791) and 5.5 "Replaying the test scenarios" (793-797).
#
# Explicit choice (to also document in docs/ci-cd.md): the study describes
# an EPHEMERAL staging environment provisioned from the Kubernetes/Terraform
# IaC definition (chapter 4), with a dedicated test dataset and an automatic
# trigger on every new version detected (5.3/5.4). Reproducing that full
# Kubernetes provisioning from a GitHub Actions runner would mean hosting an
# ephemeral cluster, which is outside the scope of this task (node creation,
# ingress, DNS, volumes...): for now this workflow is therefore limited to
# starting the docker-compose environment (dev/test scale, cf. chapter 4.6)
# as a functional, CI-testable substitute. It validates the CYCLE (startup ->
# wait for health -> replay scenarios -> report -> promotion decision)
# independently of the real provisioner; pointing this same cycle at a real
# ephemeral Kubernetes environment (via infra/terraform + infra/k8s) is a
# separate effort, cf. docs/ci-cd.md.
#
# Manual trigger (workflow_dispatch) here rather than automatic on Renovate
# detection (5.3): having a Renovate PR trigger this directly is not wired
# up yet (would require a dedicated event, e.g. `pull_request` filtered on
# the "renovate[bot]" author + a per-component branch); this workflow is the
# execution building block of the cycle, invokable manually as of now and
# connectable later to an automatic trigger.

on:
  workflow_dispatch:
    inputs:
      brique:
        description: >-
          Component whose new version is to be validated (e.g. synapse,
          seafile, onlyoffice, vikunja, keycloak, grommunio). Informational
          for now: the dev docker-compose starts the whole stack, targeting
          the update at a single image will be wired up once per-component
          Kubernetes staging exists (cf. docs/ci-cd.md).
        required: true
        type: string
      version:
        description: Version of the component to validate in staging.
        required: true
        type: string

permissions:
  contents: read

jobs:
  recette-ephemere:
    name: Recette ephemere docker-compose (${{ inputs.brique }} @ ${{ inputs.version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier la presence de l'environnement docker-compose
        id: check
        run: |
          if [ ! -f "docker-compose/docker-compose.yml" ]; then
            echo "::error::docker-compose/docker-compose.yml absent - impossible de demarrer la recette ephemere."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Demarrer l'environnement (brique=${{ inputs.brique }}, version=${{ inputs.version }})
        working-directory: docker-compose
        env:
          RECETTE_BRIQUE: ${{ inputs.brique }}
          RECETTE_VERSION: ${{ inputs.version }}
        run: |
          # Jeu de donnees de test represente ici par la configuration par
          # defaut du docker-compose de dev (5.4, point 2 : "pas les donnees
          # reelles de production") ; le pilotage fin de la version demarree
          # pour ${{ inputs.brique }} se fera via une variable d'environnement
          # ou un fichier d'override docker-compose, a cabler par la brique
          # concernee (hors perimetre de ce workflow generique).
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose up -d

      - name: Attendre que les services soient sains
        working-directory: docker-compose
        run: |
          script="scripts/wait-for-healthy.sh"
          if [ ! -x "$script" ] && [ ! -f "$script" ]; then
            echo "::error::$script introuvable (script attendu, ecrit par ailleurs dans le depot) - impossible de valider la sante de l'environnement."
            exit 1
          fi
          chmod +x "$script" || true
          "$script"

      - name: Afficher l'etat des services en cas d'echec
        if: failure()
        working-directory: docker-compose
        run: docker compose ps && docker compose logs --tail=200

      - name: Installer les dependances des tests d'integration
        working-directory: tests/integration
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rejouer les scenarios critiques (pytest -m smoke)
        id: pytest
        working-directory: tests/integration
        env:
          RECETTE_BRIQUE: ${{ inputs.brique }}
          RECETTE_VERSION: ${{ inputs.version }}
        run: |
          # Rapport HTML = "rapport de resultats (succes/echec par scenario)"
          # qui conditionne la decision de promotion (etude 5.5, ligne 797).
          # continue-on-error au niveau du step (pas du job) : on veut publier
          # le rapport meme en cas d'echec de scenario, la decision de
          # promotion restant humaine/automatisee en aval de ce workflow.
          pytest -m smoke --html=report.html --self-contained-html
        continue-on-error: true

      - name: Publier le rapport de recette en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-recette-${{ inputs.brique }}-${{ inputs.version }}
          path: tests/integration/report.html
          retention-days: 90
          if-no-files-found: warn

      - name: Statut final des scenarios
        if: always()
        run: |
          if [ "${{ steps.pytest.outcome }}" = "failure" ]; then
            echo "::error::Au moins un scenario smoke a echoue - promotion en production NON recommandee (etude 5.5). Voir le rapport HTML en artifact."
            exit 1
          fi
          echo "Tous les scenarios smoke ont reussi - rapport joint en artifact pour decision de promotion."

      - name: Arreter l'environnement (nettoyage de la recette ephemere)
        if: always()
        working-directory: docker-compose
        run: docker compose down -v
