name: Ephemeral staging (manual)

# Implements study 5.4 "Automatically triggering a staging environment"
# (lines 786-791) and 5.5 "Replaying the test scenarios" (793-797).
#
# Explicit choice (to also document in docs/ci-cd.md): the study describes
# an EPHEMERAL staging environment provisioned from the Kubernetes/Terraform
# IaC definition (chapter 4), with a dedicated test dataset and an automatic
# trigger on every new version detected (5.3/5.4). Reproducing the real
# Proxmox/Terraform provisioning from a GitHub Actions runner is outside the
# scope of this task - but as of the k3d dev cluster migration (chapter 4.6,
# dev-cluster/), this workflow now starts the SAME thing a developer runs
# locally: an ephemeral k3d cluster with the production Helm charts
# (dev-cluster/deploy.sh, Novu included), plus grommunio-dev on
# docker-compose for the one brick with no Kubernetes counterpart worth
# reusing (see dev-cluster/README.md). This gets much closer to the study's intent
# (chart-level config exercised, not a parallel compose-only definition)
# than the previous docker-compose-only substitute, while still not being
# the real Proxmox/Terraform provisioner; pointing this cycle at that real
# provisioner remains a separate effort, cf. docs/ci-cd.md.
#
# Manual trigger (workflow_dispatch) here rather than automatic on Renovate
# detection (5.3): having a Renovate PR trigger this directly is not wired
# up yet (would require a dedicated event, e.g. `pull_request` filtered on
# the "renovate[bot]" author + a per-component branch); this workflow is the
# execution building block of the cycle, invokable manually as of now and
# connectable later to an automatic trigger.

on:
  workflow_dispatch:
    inputs:
      brique:
        description: >-
          Component whose new version is to be validated (e.g. synapse,
          seafile, onlyoffice, vikunja, keycloak, grommunio). Informational
          for now: dev-cluster/deploy.sh starts every brick, targeting the
          update at a single image (bumping just its platform.yaml entry
          and re-running the affected `helm upgrade`) will be wired up
          separately (cf. docs/ci-cd.md).
        required: true
        type: string
      version:
        description: Version of the component to validate in staging.
        required: true
        type: string

permissions:
  contents: read

jobs:
  recette-ephemere:
    name: Ephemeral staging k3d + docker-compose (${{ inputs.brique }} @ ${{ inputs.version }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the dev environment definitions
        id: check
        run: |
          if [ ! -f "dev-cluster/grommunio-dev/docker-compose.yml" ] || [ ! -x "dev-cluster/deploy.sh" ]; then
            echo "::error::dev-cluster/grommunio-dev/docker-compose.yml or dev-cluster/deploy.sh missing - cannot start the ephemeral staging environment."
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Start grommunio-dev (docker-compose)
        working-directory: dev-cluster/grommunio-dev
        run: |
          # Test dataset represented here by the default configuration of
          # the dev docker-compose (5.4, point 2: "not real production
          # data"); fine-grained control of the version started for
          # ${{ inputs.brique }} will be done via an environment variable
          # or a docker-compose override file, to be wired up by the
          # component concerned (out of scope for this generic workflow).
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose up -d

      - name: Wait for grommunio-dev to be healthy
        working-directory: dev-cluster/grommunio-dev
        run: |
          script="scripts/wait-for-healthy.sh"
          if [ ! -x "$script" ] && [ ! -f "$script" ]; then
            echo "::error::$script not found (expected script, written elsewhere in the repo) - cannot validate the health of the environment."
            exit 1
          fi
          chmod +x "$script" || true
          "$script"

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Ansible (dev-cluster/deploy.sh's Keycloak provisioning step)
        run: |
          # dev-cluster/deploy.sh's step 6/11 (provision-keycloak-dev.sh) runs
          # the infra/ansible/roles/keycloak_realm role against the k3d
          # cluster's Keycloak - needed here for the exact same reason
          # lint-and-test.yml's ansible-lint job needs it, just to execute
          # the playbook instead of lint it.
          pip install "ansible-core>=2.15,<2.17"
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Start every other brick (k3d, dev-cluster/deploy.sh)
        run: ./dev-cluster/deploy.sh

      - name: Wait for the k3d workloads to be ready
        run: |
          kubectl config use-context k3d-libre365-dev
          kubectl wait --for=condition=Available deployment --all -n libre365 --timeout=600s
          kubectl wait --for=condition=Ready pod --all -n libre365 --timeout=600s

      - name: Show the state of the services on failure
        if: failure()
        run: |
          docker compose -f dev-cluster/grommunio-dev/docker-compose.yml ps && docker compose -f dev-cluster/grommunio-dev/docker-compose.yml logs --tail=200
          kubectl get pods -n libre365 -o wide || true
          kubectl describe pods -n libre365 || true

      - name: Install the integration tests' dependencies
        working-directory: tests/integration
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay every scenario (pytest, no marker filter)
        id: pytest
        working-directory: tests/integration
        env:
          RECETTE_BRIQUE: ${{ inputs.brique }}
          RECETTE_VERSION: ${{ inputs.version }}
        run: |
          # HTML report = "results report (success/failure per scenario)"
          # that conditions the promotion decision (study 5.5, line 797).
          # continue-on-error at the step level (not the job level): we
          # want to publish the report even if a scenario fails, the
          # promotion decision remaining human/automated downstream of
          # this workflow.
          #
          # Deliberately NOT `-m smoke`: only test_mail_grommunio.py
          # carries that marker, so that filter silently ran a single
          # test file and never exercised the SSO/OIDC scenarios
          # (test_sso_e2e.py) or any of the other component tests
          # (test_file_sync_seafile.py, test_coedition_onlyoffice.py,
          # test_matrix_visio.py, test_task_vikunja.py,
          # test_connectors.py) - none of which declare a `smoke`/`slow`/
          # `sso` marker of their own. Run the whole suite instead; use
          # `-m` again once specific scenarios are deliberately tiered by
          # marker (see tests/integration/pytest.ini).
          pytest --html=report.html --self-contained-html
        continue-on-error: true

      - name: Publish the staging report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-recette-${{ inputs.brique }}-${{ inputs.version }}
          path: tests/integration/report.html
          retention-days: 90
          if-no-files-found: warn

      - name: Final status of the scenarios
        if: always()
        run: |
          if [ "${{ steps.pytest.outcome }}" = "failure" ]; then
            echo "::error::At least one scenario failed - promotion to production is NOT recommended (study 5.5). See the HTML report artifact."
            exit 1
          fi
          echo "All scenarios passed - report attached as an artifact for the promotion decision."

      - name: Stop the environment (ephemeral staging cleanup)
        if: always()
        run: |
          ./dev-cluster/destroy.sh || true
          docker compose -f dev-cluster/grommunio-dev/docker-compose.yml down -v
