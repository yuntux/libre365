# =============================================================================
# libre365 - development/test docker-compose environment
# Study, chapter 4.6: "Development/test: reduced scale, synthetic data."
#
# As of the k3d dev cluster migration, this file no longer hosts the whole
# dev/test tier. Every service that has a production Helm chart worth
# reusing (Keycloak, Synapse/Element, Seafile, OnlyOffice, Vikunja, Gokapi,
# MinIO, PeerTube, Novu, Caddy, and the 5 in-house connectors) now runs on
# the local k3d Kubernetes cluster instead, so that dev/test stays as close
# as possible to the production deployment model (chapter 4.4) - see
# dev-cluster/README.md for the full rationale and startup instructions.
# Novu used to be the exception here too (a lightweight HTTP mock, before
# the k3d dev cluster made deploying the real chart practical) - see
# dev-cluster/README.md for why the real chart is worth the extra resource
# footprint for this one.
#
# This file is what remains: grommunio-dev, the only service that could NOT
# be migrated to the k3d dev cluster - the study (4.3) targets a Proxmox VM
# appliance for production, never a container, so there is no Helm chart to
# reuse. Kept here purely so integration tests (send/receive mail, study
# 5.5) can run in CI without a Proxmox VM.
#
# All images are official Docker Hub/Quay images, explicitly tagged (never
# `latest`), with ports mapped in the clear on localhost rather than the
# ingress/TLS model of the K8s target (chapter 4.4).
# =============================================================================

name: libre365-dev

networks:
  libre365:
    driver: bridge

volumes:
  grommunio-dev-data:

services:

  # ---------------------------------------------------------------------
  # Mail/calendar: Grommunio - DEV/TEST ONLY (study 1.1 / 4.3)
  # ---------------------------------------------------------------------
  # The study (4.3) explicitly selects Grommunio as a Proxmox VM appliance
  # for PRODUCTION, not as a container: the official container packaging
  # (grommunio/gromox-container) is presented by the vendor itself as a
  # solution for special needs, not production-ready (bundles
  # nginx/Postfix/gromox/Redis/PHP-FPM under a single supervisord).
  # It is included HERE only so integration tests (send/receive mail,
  # study 5.5) can run in CI without a Proxmox VM.
  # DO NOT reproduce this service as-is in a staging/production environment.
  grommunio-dev:
    image: grommunio/gromox-container:core-c9
    restart: unless-stopped
    environment:
      TZ: ${GROMMUNIO_TIMEZONE:-Europe/Paris}
      GROMMUNIO_ADMIN_PASSWORD: ${GROMMUNIO_ADMIN_PASSWORD:-devonly-changeme-grommunio-admin}
    volumes:
      - grommunio-dev-data:/etc/gromox
    ports:
      - "${GROMMUNIO_DEV_HTTP_PORT:-8443}:8443"
    networks: [libre365]
    # No documented standard healthcheck for this image (usage not
    # recommended in prod by the vendor itself, see comment above) -
    # wait-for-healthy.sh falls back to a simple TCP check for this service.
