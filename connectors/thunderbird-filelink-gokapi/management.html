<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gokapi Filelink</title>
    <style>
      body { font-family: sans-serif; padding: 1em; max-width: 32em; }
      label { display: block; margin-top: 0.75em; font-weight: bold; }
      input { width: 100%; box-sizing: border-box; padding: 0.4em; margin-top: 0.2em; }
      button { margin-top: 1em; padding: 0.5em 1em; }
      #status { margin-top: 0.75em; font-size: 0.9em; }
    </style>
  </head>
  <body>
    <h3>Gokapi account settings</h3>
    <p>This information is used by <code>background.js</code> to upload attachments.</p>

    <label for="baseUrl">Gokapi instance URL</label>
    <input id="baseUrl" type="url" placeholder="https://gokapi.example.org" />

    <label for="apiKey">Gokapi API key</label>
    <input id="apiKey" type="password" placeholder="Key associated with the sender's OIDC account" />

    <label for="expiryDays">Retention duration (days, optional)</label>
    <input id="expiryDays" type="number" min="1" placeholder="e.g. 14" />

    <label for="allowedDownloads">Maximum number of downloads (optional)</label>
    <input id="allowedDownloads" type="number" min="1" placeholder="e.g. 10" />

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="management.js"></script>
  </body>
</html>
